# Draft JTBD scenario for the Agent OS proposal. Commands and shapes are proposals; the data is invented.
# The scenario shows that no command input passes a host path or one of the host's credentials
# into a machine, and that a value the secret rules recognise is refused. Those rules detect; they
# do not guarantee. That code running inside finds none is M1's exit test: a scenario cannot run
# code in a machine.
name: Give a machine no credential and no path into the host
description: >-
  When code under validation looks for a token, a sign-in or the host's files, I want it to find
  none, because no input passes one of the host's through, so that a branch cannot merge itself,
  write to GitHub or read what the lane holds.
job: give-a-machine-no-credential
tags: [m1]
fixture:
  file: fixtures/host.json
steps:
  - description: A new machine holds no credential, and its only mounts are the host's own volumes
    command: machine-create
    input: { repository: example-repo, for: fix/tokens }
    expect:
      success: true
      data:
        machine:
          credentials: { length: 0 }
          network: { default: none }
          mounts:
            - { name: work, kind: work }
            - { name: build, kind: build }
            - { name: downloads, kind: cache }
  - description: A caller cannot mount a host path; the input does not exist
    command: machine-create
    input:
      repository: example-repo
      for: fix/parser
      mounts:
        - { host: /etc/ssh, at: /config }
    expect:
      success: false
      error:
        code: VALIDATION_ERROR
        suggestion: { contains: mounts }
  - description: A value that looks like a secret is refused before it reaches the machine or the journal
    command: run-start
    input:
      machine: "${{ steps[0].data.machine.id }}"
      head: 3f9a2c4e5b6d7081928374a5b6c7d8e9f0a1b2c3
      steps:
        - label: validate
          args: [pnpm, verify, "--keep-going"]
          timeoutSeconds: 5400
          network: none
          env: { GH_TOKEN: EXAMPLE-SECRET-12345 }
    expect:
      success: false
      error:
        code: SECRET_IN_INPUT
        suggestion: { contains: credential }
  - description: An ordinary variable is passed
    command: run-start
    input:
      machine: "${{ steps[0].data.machine.id }}"
      head: 3f9a2c4e5b6d7081928374a5b6c7d8e9f0a1b2c3
      steps:
        - label: validate
          args: [pnpm, verify, "--keep-going"]
          timeoutSeconds: 5400
          network: none
          env: { CI: "true" }
    expect:
      success: true
      data:
        run:
          state: running
  - description: The machine still holds no credential while the run is active
    command: machine-get
    input: { id: "${{ steps[0].data.machine.id }}" }
    expect:
      success: true
      data:
        machine:
          state: busy
          credentials: { length: 0 }
