# The fixture's histories also run through scripts/issue-claim.test.mjs, so the factory and the
# issue-claim CLI are held to the same holder. Each issue's `expected` there says what both
# observe, or what each does where they are known to differ.
name: Identify the holder before starting work
description: >-
  When branches post competing claims, I want the factory to name the earliest
  still-standing live claimant and direct me to available work, so that I never start
  a second cell on work someone holds.
job: triage-the-backlog
tags: [slice]
fixture:
  file: fixtures/claim-histories.json
  base: fresh.json
steps:
  - description: One live claim
    command: cell-register
    input: { branch: fix/observer, issues: [301], route: sol/high }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/alpha
        suggestion: { contains: issue-check }
        recovery: { kind: call, command: issue-check }
  - description: Two live claims
    command: cell-register
    input: { branch: fix/observer, issues: [302], route: sol/high }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/alpha
        suggestion: { contains: issue-check }
        recovery: { kind: call, command: issue-check }
  - description: Later branch released
    command: cell-register
    input: { branch: fix/observer, issues: [303], route: sol/high }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/alpha
        suggestion: { contains: issue-check }
        recovery: { kind: call, command: issue-check }
  - description: Earlier branch released
    command: cell-register
    input: { branch: fix/observer, issues: [304], route: sol/high }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/bravo
        suggestion: { contains: issue-check }
        recovery: { kind: call, command: issue-check }
  - description: A later claim whose lease ran out does not displace the live one
    command: cell-register
    input: { branch: fix/observer, issues: [306], route: sol/high }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/alpha
        suggestion: { contains: issue-check }
        recovery: { kind: call, command: issue-check }
  - description: A renewal shows the holder's current lease
    command: cell-register
    input: { branch: fix/observer, issues: [310], route: sol/high }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: "fix/alpha (laptop, lease until 2030-01-06T00:00:00Z)"
        suggestion: { contains: issue-check }
        recovery: { kind: call, command: issue-check }
    # Following the refusal finds available work and the claims that ran out.
    follow:
      expect:
        success: true
        data:
          dispatchable: [305]
          staleClaims:
            - { number: 308, branch: fix/alpha }
            - { number: 309, branch: fix/bravo }
            - { number: 313, branch: fix/charlie }
            - { number: 315 }
  - description: Register the observer on the free issue
    command: cell-register
    input: { branch: fix/observer, issues: [305], route: sol/high }
    expect:
      success: true
      data:
        cell: { branch: fix/observer, issues: [305] }
