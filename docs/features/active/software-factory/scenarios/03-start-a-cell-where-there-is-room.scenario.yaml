# Draft JTBD scenario for the Software Factory proposal. Commands and shapes are proposals; the data is invented.
name: Start a cell on the plan and host with room
description: >-
  When the queue is short, I want to know whether to start another cell and on which plan, and the
  limits enforced when I register it, so that allowance about to reset is spent first, no plan is
  drained early and the host never takes more cells than it can carry.
job: start-a-cell-where-there-is-room
tags: [slice]
fixture:
  file: fixtures/fresh.json
  overrides:
    laneHost: workstation
    dials: { cells.max: 1 }
steps:
  - description: >-
      Each plan shows its room (window elapsed minus share used), what is left below the ceiling
      and its pace (what is left per day to its reset); the plan with the highest pace is next
    command: plan-list
    expect:
      success: true
      data:
        plans:
          - { id: plan-a, room: 70, left: 75, pace: 10.71, daysToReset: 7, aboveCeiling: false }
          - { id: plan-b, room: 20, left: 45, pace: 5, daysToReset: 9, aboveCeiling: false }
        next: plan-a
  - description: Status says a cell may start, on which plan, and with which issue
    command: lane-status
    expect:
      success: true
      data:
        canStartCell: true
        plan: { id: plan-a, pace: 10.71 }
        nextIssue: 101
  - description: >-
      A cell with two issues is refused while one issue per cell is the rule; registered with one,
      before the cell starts, it claims its issue and is assigned the plan
    command: cell-register
    input: { branch: fix/parser-empty-input, issues: [101, 102], route: opus/medium }
    expect:
      success: false
      error:
        code: TOO_MANY_ISSUES
        recovery: { kind: fix-input, needs: [issues] }
        suggestion: { contains: cells.issuesMax }
    follow:
      input: { issues: [101] }
      expect:
        success: true
        data:
          cell: { branch: fix/parser-empty-input, plan: plan-a, issues: [101] }
  - description: Once delegate_task returns, its thread is attached to the cell
    command: cell-attach
    input: { branch: fix/parser-empty-input, thread: thread-1 }
    expect:
      success: true
      data:
        cell: { thread: thread-1 }
  - description: The same branch cannot be registered twice
    command: cell-register
    input: { branch: fix/parser-empty-input, issues: [102], route: opus/medium }
    expect:
      success: false
      error:
        code: ALREADY_EXISTS
        recovery: { kind: fix-input, needs: [branch] }
        suggestion: { contains: lane-drop }
    # A new branch gets past the duplicate, to the next limit: one cell at a time.
    follow:
      input: { branch: fix/parser-other }
      expect: { success: false, error: { code: CELLS_FULL } }
  - description: Another cell beyond cells.max is refused before anything is spent on it
    command: cell-register
    input: { branch: fix/client-retry, issues: [103], route: sol/high }
    expect:
      success: false
      error:
        code: CELLS_FULL
        recovery: { kind: call, command: lane-status }
        suggestion: { contains: lane-wait }
    follow: { expect: { success: true, data: { canStartCell: false } } }
