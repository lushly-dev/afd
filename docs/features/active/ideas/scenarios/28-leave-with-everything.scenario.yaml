# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.
#
# Both commands are an operator's, at the command line of the instance, and both are paged: an
# adapter writes the pages to files, as memory's export does. Restoring into an empty instance
# needs two stores, which one run does not have; exit criterion 12 covers it. This file shows
# the half that one store can: pages read back into the store they came from add nothing.

name: Leave with everything
description: >-
  When I want a copy of everything, to keep or to move to another instance, I want one archive
  with every idea, its history, its sources and the record of what used it, so that the store
  never holds my thinking hostage and a lost disk does not lose it.
job: leave-with-everything
tags: [trust, loop]

steps:
  - description: A source
    command: ideas-source-add
    input:
      title: Notes on tools
      kind: notes
      content: "Oil wooden handles every winter."
    expect:
      success: true

  - description: An idea from it
    command: ideas-capture
    input:
      type: principle
      statement: Oil wooden handles every winter.
      sources:
        - source: "${{ steps[0].data.source }}"
          sentences: [1]
    expect:
      success: true

  - description: A second wording, so that there is history to keep
    command: ideas-reframe
    input:
      id: "${{ steps[1].data.id }}"
      statement: Oil wooden handles every winter, with raw linseed.
      reason: Says which oil.
    expect:
      success: true

  - description: A piece that used it, so that there is a use to keep
    command: ideas-output-record
    input:
      title: Winter tool care
      format: article
      ideas: ["${{ steps[1].data.id }}"]
    expect:
      success: true

  - description: Export everything; a small store is one page, and the last page carries the manifest
    command: ideas-export
    expect:
      success: true
      data:
        items: { exists: true }
        next: { notExists: true }
        manifest:
          ideas: 1
          versions: 2
          sources: 1
          outputs: 1
          digest: { matches: '^sha256:' }

  - description: Read back into the same store, the page adds nothing and matches
    command: ideas-import
    input:
      items: "${{ steps[4].data.items }}"
      verify: true
    expect:
      success: true
      data:
        same: true
        added:
          ideas: 0
          versions: 0
          sources: 0
          outputs: 0
