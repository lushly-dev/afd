# Phase A JTBD scenario for Patterns (`docs/features/active/patterns/spec.md`, Umbel Amendment A31).
# The data is invented, on the pack format's `example` library: a `select` pattern implemented by
# `example-select` and a `field` pattern implemented by `example-field`. Both are component-backed
# so Slice 1 passes without Slice 2 copy serving. Saved copy discovery is covered by Jobs 6 and 10.
# Lists are asserted with dotted index paths where only part of an item or a variable length
# matters, because `afd-testing` requires exact length matches on object arrays and compares
# plain arrays whole.

name: Find a pattern by what a region must do
description: >-
  When I know what a region must do but not what it is called, I want the patterns that fit
  and what implements each, so that I reuse what exists and am told plainly when nothing fits.
job: find-by-need
tags: [slice, discover]

steps:
  - description: A need stated as a purpose finds the pattern and the component that implements it
    command: components-pattern-list
    input:
      facets:
        purpose: [choose-one]
    expect:
      success: true
      data:
        content.trust: content
        content.patterns: { length: 1 }
        content.patterns.0.library: example
        content.patterns.0.pattern: select
        content.patterns.0.scope: control
        content.patterns.0.implementations: { length: 1 }
        content.patterns.0.implementations.0.library: example
        content.patterns.0.implementations.0.kind: component
        content.patterns.0.implementations.0.tag: example-select
        content.patterns.0.implementations.0.linkage: instance

  - description: A need in words finds a matching pattern and its component implementation
    command: components-pattern-list
    input:
      contains: single line of text
      scope: control
    expect:
      success: true
      data:
        content.patterns: { length: 1 }
        content.patterns.0.library: example
        content.patterns.0.pattern: field
        content.patterns.0.scope: control
        content.patterns.0.implementations: { length: 1 }
        content.patterns.0.implementations.0.library: example
        content.patterns.0.implementations.0.kind: component
        content.patterns.0.implementations.0.tag: example-field
        content.patterns.0.implementations.0.linkage: instance

  - description: A need nothing serves is an empty answer with available facets, not a failure
    command: components-pattern-list
    input:
      facets:
        purpose: [show-a-trend]
    expect:
      success: true
      data:
        content.patterns: { length: 0 }
        content.availableFacets.purpose: { includes: choose-one }
