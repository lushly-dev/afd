# Draft JTBD scenario for the Factory Gateway proposal. Commands and shapes are proposals; the data is invented.
# Runs against the foreman endpoint. The fixture is the gateway after a restart or a lost disk: its
# cache is empty and GitHub holds the claim comments. Issue 104's claim was written before the
# cutover by the owner's account in the old marker, inside the cutover window.
name: Restart the gateway without losing or inventing a claim
description: >-
  When the always-on machine restarts or loses its disk, I want the gateway to come back with the
  claims exactly as GitHub records them, counting only what the gateway wrote (and, during the
  cutover, the old claims still running), so that a restart costs nothing, no claim is lost, and a
  comment someone forged is never treated as a claim.
job: restart-without-losing-a-claim
tags: [mvp]
fixture:
  file: fixtures/restart.json
  base: gateway.json
steps:
  - description: The claims are the bot's two and the old claim still inside the cutover; the forged one is not there
    command: claim-list
    input: { repo: example-org/example-repo }
    expect:
      success: true
      data:
        claims:
          - { number: 101, holder: { branch: fix/parser }, legacy: false }
          - { number: 102, holder: { branch: fix/line-numbers }, legacy: false }
          - { number: 104, holder: { branch: docs/commas }, legacy: true }
  - description: The issue with only a forged claim comment can be claimed
    command: issue-claim
    input:
      repo: example-org/example-repo
      numbers: [103]
      holder: { branch: fix/slow-parser, machine: workstation }
    expect:
      success: true
      data:
        claims:
          - { number: 103, holder: { branch: fix/slow-parser } }
  - description: A claim that came back from GitHub still holds against a second holder
    command: issue-claim
    input:
      repo: example-org/example-repo
      numbers: [101]
      holder: { branch: fix/parser-2, machine: laptop }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/parser
