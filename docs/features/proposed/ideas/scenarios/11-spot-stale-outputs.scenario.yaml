# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.

name: Spot published pieces that no longer match my thinking
description: >-
  When I have published, I want to know which pieces no longer match what I think, so that I
  can correct or retire them, and stop hearing about the ones I have dealt with.
job: spot-stale-outputs
tags: [change, slice]

steps:
  - description: One idea
    command: ideas-capture
    input:
      type: principle
      statement: Dig the vegetable plot over every autumn.
    expect:
      success: true

  - description: Another
    command: ideas-capture
    input:
      type: principle
      statement: Lime the plot every third year.
    expect:
      success: true

  - description: Put both in front of me
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[0].data.id }}"
          version: "${{ steps[0].data.version }}"
        - decide: affirm
          id: "${{ steps[1].data.id }}"
          version: "${{ steps[1].data.version }}"
    expect:
      success: true

  - description: I hold both
    command: ideas-review-apply
    input:
      review: "${{ steps[2].data.review }}"
      digest: "${{ steps[2].data.digest }}"
    expect:
      success: true

  - description: An article used both
    command: ideas-output-record
    input:
      title: Autumn jobs
      format: article
      channel: newsletter
      ideas: ["${{ steps[0].data.id }}", "${{ steps[1].data.id }}"]
    expect:
      success: true
      data:
        state: draft

  - description: It was published, and the record says where
    command: ideas-output-update
    input:
      output: "${{ steps[4].data.output }}"
      state: published
      location: https://example.org/autumn-jobs
      publishedOn: "2026-10-20"
    expect:
      success: true
      data:
        state: published

  - description: What I think now, in place of the first
    command: ideas-capture
    input:
      type: principle
      statement: Leave the plot undug and mulch it instead.
    expect:
      success: true

  - description: A new wording for the second
    command: ideas-reframe
    input:
      id: "${{ steps[1].data.id }}"
      statement: Lime only after a soil test says so.
      reason: The test showed the plot did not need it.
    expect:
      success: true

  - description: Put the changes in front of me, the new view among them
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[6].data.id }}"
          version: "${{ steps[6].data.version }}"
        - decide: retire
          id: "${{ steps[0].data.id }}"
          successor: "${{ steps[6].data.id }}"
          reason: Went no-dig.
        - decide: affirm
          id: "${{ steps[1].data.id }}"
          version: "${{ steps[7].data.version }}"
    expect:
      success: true

  - description: I agree to all three
    command: ideas-review-apply
    input:
      review: "${{ steps[8].data.review }}"
      digest: "${{ steps[8].data.digest }}"
    expect:
      success: true
      data:
        applied:
          retire: 1
          affirm: 2

  - description: The article is compared with the present
    command: ideas-output-show
    input:
      output: "${{ steps[4].data.output }}"
    expect:
      success: true
      data:
        drift:
          changed: 1
          retired: 1

  - description: The digest lists it
    command: ideas-digest
    expect:
      success: true
      data:
        outputsDrifted: { length: 1 }

  - description: The report finds a published piece that pins a retired idea
    command: ideas-check
    input:
      checks: [output-pins-retired]
    expect:
      success: true
      data:
        counts:
          output-pins-retired: 1

  - description: A corrected article is written from what I hold now, and recorded as published
    command: ideas-output-record
    input:
      title: Autumn jobs, without the spade
      format: article
      channel: newsletter
      state: published
      location: https://example.org/autumn-jobs-2
      ideas: ["${{ steps[6].data.id }}", "${{ steps[1].data.id }}"]
    expect:
      success: true
      data:
        attention:
          seeds: { length: 0 }

  - description: The old one is marked as replaced by it
    command: ideas-output-update
    input:
      output: "${{ steps[4].data.output }}"
      state: superseded
      supersededBy: "${{ steps[13].data.output }}"
    expect:
      success: true
      data:
        state: superseded

  - description: The digest stops listing it
    command: ideas-digest
    expect:
      success: true
      data:
        outputsDrifted: { length: 0 }

  - description: And so does the report
    command: ideas-check
    input:
      checks: [output-pins-retired]
    expect:
      success: true
      data:
        counts:
          output-pins-retired: 0
