# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.
#
# The upload itself is a request a shell or a browser makes to the ticket's address, between
# the first step and a later ideas-source-add that names the ticket. A scenario cannot make
# that request, so the two files below are a fixture instead (P14): a workspace whose
# collection `inbox`, which nobody has configured as the person's own, holds
#   plan-2019.md:  Plant the orchard on the north boundary.
#                  Keep hens under the fruit trees.
#   plan-2021.md:  Plant the orchard on the south slope.
#                  Keep hens under the fruit trees.

name: Load an archive of files
description: >-
  When I bring several hundred files, drafts of the same document among them, I want them
  loaded without passing through a model, later drafts recognised, a wrong date corrected, and
  mining able to stop and pick up where it left off, so that the archive goes in once and whole.
job: load-an-archive
tags: [collect, slice]

steps:
  - description: Ask for somewhere to send the files; one address takes them all, and no model handles a byte
    command: ideas-source-upload
    input:
      files: 2
      kind: notes
    expect:
      success: true
      data:
        ticket: { matches: '^up-' }
        url: { matches: '^https://' }
        expires: { exists: true }

  - description: A first draft, which nobody has yet said is mine
    command: ideas-source-add
    input:
      document: inbox/plan-2019.md
      kind: notes
      thoughtOn: "2019-03-01"
    expect:
      success: true
      data:
        attests: false

  - description: A later draft is reported as a likely version of the first
    command: ideas-source-add
    input:
      document: inbox/plan-2021.md
      kind: notes
      thoughtOn: "2021-03-01"
    expect:
      success: true
      data:
        likelyVersionOf: { matches: '^src-' }

  - description: The caller judges that they are one document, earlier and later, and that is recorded
    command: ideas-settle
    input:
      check: source-versions
      subjects: ["${{ steps[1].data.source }}", "${{ steps[2].data.source }}"]
      how: same-document
      reason: The 2021 file is a later draft of the 2019 one.
    expect:
      success: true

  - description: Put both in front of me as my own writing
    command: ideas-review-stage
    input:
      decisions:
        - decide: own
          source: "${{ steps[1].data.source }}"
        - decide: own
          source: "${{ steps[2].data.source }}"
    expect:
      success: true

  - description: I confirm both at once, having been shown their titles, dates and opening lines
    command: ideas-review-apply
    input:
      review: "${{ steps[4].data.review }}"
      digest: "${{ steps[4].data.digest }}"
    expect:
      success: true
      data:
        applied:
          own: 2

  - description: Two sources wait for this extractor
    command: ideas-source-list
    input:
      notMinedBy: fixture-model, prompt 1
    expect:
      success: true
      data:
        total: 2

  - description: A run over both
    command: ideas-run-open
    input:
      sources: ["${{ steps[1].data.source }}", "${{ steps[2].data.source }}"]
      extractor: fixture-model, prompt 1
    expect:
      success: true

  - description: A sentence that both drafts share
    command: ideas-capture
    input:
      type: principle
      statement: Keep hens under the fruit trees.
      run: "${{ steps[7].data.run }}"
      sources:
        - source: "${{ steps[1].data.source }}"
          sentences: [2]
    expect:
      success: true
      data:
        standing: attested

  - description: Seen again in the later draft, it counts as one document, not two
    command: ideas-observe
    input:
      id: "${{ steps[8].data.id }}"
      run: "${{ steps[7].data.run }}"
      source: "${{ steps[2].data.source }}"
      sentences: [2]
    expect:
      success: true
      data:
        sightings: 2
        documents: 1

  - description: A sentence only the first draft has
    command: ideas-capture
    input:
      type: position
      statement: Plant the orchard on the north boundary.
      run: "${{ steps[7].data.run }}"
      sources:
        - source: "${{ steps[1].data.source }}"
          sentences: [1]
    expect:
      success: true

  - description: The run stops after the first file, and says which one it finished
    command: ideas-run-close
    input:
      run: "${{ steps[7].data.run }}"
      done: ["${{ steps[1].data.source }}"]
    expect:
      success: true

  - description: One source is still waiting, so the work can be picked up where it stopped
    command: ideas-source-list
    input:
      notMinedBy: fixture-model, prompt 1
    expect:
      success: true
      data:
        total: 1

  - description: A second run, in another session, takes what is left
    command: ideas-run-open
    input:
      sources: ["${{ steps[2].data.source }}"]
      extractor: fixture-model, prompt 1
    expect:
      success: true

  - description: And finishes it
    command: ideas-run-close
    input:
      run: "${{ steps[13].data.run }}"
    expect:
      success: true

  - description: Nothing is left for this extractor
    command: ideas-source-list
    input:
      notMinedBy: fixture-model, prompt 1
    expect:
      success: true
      data:
        total: 0

  - description: The view I dropped in the later draft is reported, so an abandoned view does not pass as mine
    command: ideas-check
    input:
      checks: [attested-in-earlier-draft]
    expect:
      success: true
      data:
        counts:
          attested-in-earlier-draft: 1

  - description: The date the agent guessed for the first draft is corrected; its bytes are untouched
    command: ideas-source-amend
    input:
      source: "${{ steps[1].data.source }}"
      thoughtOn: "2019-04-12"
    expect:
      success: true
      data:
        thoughtOn: "2019-04-12"
