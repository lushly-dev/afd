# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.
#
# Whether the answer a model writes from the bundle is a good one is measured in phase 0.3.

name: Ask a question and get an answer from what I hold
description: >-
  When I have a question, I want to ask it from wherever I am working and get an answer built
  from my current ideas, each marked with how far I stand behind it, and to keep a question the
  store cannot answer, so that I never dig through documents and gaps become visible.
job: ask-a-question
tags: [use, loop]

steps:
  - description: A view
    command: ideas-capture
    input:
      type: position
      statement: Water deeply once a week rather than a little every day.
    expect:
      success: true

  - description: Evidence for it, which I have not looked at
    command: ideas-capture
    input:
      type: evidence
      statement: In the fixture beds, weekly soaking sent roots twice as deep as daily sprinkling.
      links:
        - kind: supports
          to: "${{ steps[0].data.id }}"
    expect:
      success: true

  - description: Put the view in front of me
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[0].data.id }}"
          version: "${{ steps[0].data.version }}"
    expect:
      success: true

  - description: I hold it
    command: ideas-review-apply
    input:
      review: "${{ steps[2].data.review }}"
      digest: "${{ steps[2].data.digest }}"
    expect:
      success: true

  - description: Ask in my own words; the answer's material comes back in one call, marked by standing
    command: ideas-ask
    input:
      question: How often should I water?
    expect:
      success: true
      data:
        found: 2
        at: { exists: true }
        attention:
          seeds: { length: 1 }

  - description: Ask something the store holds nothing on; it says so and does not guess
    command: ideas-ask
    input:
      question: How deep should a garden pond be?
    expect:
      success: true
      data:
        found: 0

  - description: The question is kept
    command: ideas-capture
    input:
      type: question
      statement: How deep should a garden pond be?
    expect:
      success: true

  - description: It is listed as open
    command: ideas-find
    input:
      type: question
      open: true
    expect:
      success: true
      data:
        total: 1

  - description: Later an idea answers it
    command: ideas-capture
    input:
      type: position
      statement: A wildlife pond needs a shelf at 20 cm and a deep point of at least 60 cm.
      links:
        - kind: answers
          to: "${{ steps[6].data.id }}"
    expect:
      success: true

  - description: The question is no longer open
    command: ideas-find
    input:
      type: question
      open: true
    expect:
      success: true
      data:
        total: 0

  - description: Asked again, it is answered
    command: ideas-ask
    input:
      question: How deep should a garden pond be?
    expect:
      success: true
      data:
        found: { gte: 1 }
