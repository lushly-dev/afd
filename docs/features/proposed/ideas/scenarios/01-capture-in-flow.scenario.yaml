# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.

name: Capture an idea in the flow of a conversation
description: >-
  When an idea surfaces in the middle of a conversation with an agent, I want it saved in one
  step and checked against what I already have, so that nothing is lost and nothing is duplicated.
job: capture-in-flow
tags: [collect, slice]

steps:
  - description: Capture the idea as it was said
    command: ideas-capture
    input:
      type: position
      statement: Raised beds warm earlier in spring, so they lengthen the season in cool climates.
      tags: [beds]
    expect:
      success: true
      data:
        id: { matches: '^idea-' }
        standing: seed

  - description: The same idea in other words is refused, with the way forward
    command: ideas-capture
    input:
      type: position
      statement: In cold regions a bed lifted off the ground heats up sooner after winter, which gives more growing weeks.
    expect:
      success: false
      error:
        code: ALREADY_EXISTS
        suggestion: { contains: ideas-observe }

  - description: The store still holds one idea on the subject
    command: ideas-find
    input:
      text: raised beds and season length
    expect:
      success: true
      data:
        total: 1

  - description: An idea that is only related is admitted, and the first is offered as a link candidate
    command: ideas-capture
    input:
      type: evidence
      statement: In the fixture trial, soil in a raised bed was three degrees warmer than open ground in April.
    expect:
      success: true
      data:
        standing: seed
        related: { length: 1 }

  - description: State the link in the same exchange
    command: ideas-link
    input:
      from: "${{ steps[3].data.id }}"
      kind: supports
      to: "${{ steps[0].data.id }}"
    expect:
      success: true
