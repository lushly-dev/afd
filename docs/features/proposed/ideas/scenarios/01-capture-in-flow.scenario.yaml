# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.
#
# A refusal carries the ids of what it matched in its details, which the runner cannot assert.

name: Capture an idea in the flow of a conversation
description: >-
  When an idea surfaces in the middle of a conversation with an agent, I want it saved in one
  step and checked against what I already have, so that nothing is lost and nothing is duplicated.
job: capture-in-flow
tags: [collect, loop]

steps:
  - description: Capture the idea as the person said it
    command: ideas-capture
    input:
      type: position
      statement: Raised beds warm earlier in spring, so they lengthen the season in cool climates.
      tags: [beds]
      saidBy: person
      idempotency_key: chat-41/1
    expect:
      success: true
      data:
        id: { matches: '^idea-' }
        version: 1
        standing: seed

  - description: The same call sent again after a dropped connection returns the same idea
    command: ideas-capture
    input:
      type: position
      statement: Raised beds warm earlier in spring, so they lengthen the season in cool climates.
      tags: [beds]
      saidBy: person
      idempotency_key: chat-41/1
    expect:
      success: true
      data:
        replayed: true
        standing: seed

  - description: The same idea in other words is refused, with the way forward
    command: ideas-capture
    input:
      type: position
      statement: In cold regions a bed lifted off the ground heats up sooner after winter, which gives more growing weeks.
    expect:
      success: false
      error:
        code: ALREADY_EXISTS
        suggestion: { contains: ideas-match }

  - description: The caller reads what it matched, with the wording, before deciding what it is
    command: ideas-match
    input:
      statements:
        - In cold regions a bed lifted off the ground heats up sooner after winter, which gives more growing weeks.
    expect:
      success: true
      data:
        results: { length: 1 }

  - description: It is the same idea, so the caller records that it came up again
    command: ideas-observe
    input:
      id: "${{ steps[0].data.id }}"
    expect:
      success: true
      data:
        sightings: 2

  - description: The store still holds one idea on the subject
    command: ideas-find
    input:
      text: raised beds and season length
    expect:
      success: true
      data:
        total: 1

  - description: An idea that is only related is admitted, and the first is offered as a link candidate
    command: ideas-capture
    input:
      type: evidence
      statement: In the fixture trial, soil in a raised bed was three degrees warmer than open ground in April.
    expect:
      success: true
      data:
        standing: seed
        related: { length: 1 }

  - description: State the link in the same exchange
    command: ideas-link
    input:
      from: "${{ steps[6].data.id }}"
      kind: supports
      to: "${{ steps[0].data.id }}"
    expect:
      success: true
