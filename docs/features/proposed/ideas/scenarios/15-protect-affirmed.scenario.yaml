# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.

name: Never change what I affirmed
description: >-
  When an agent or a new extraction run touches an idea I have affirmed, I want my wording to
  stand until I say otherwise, so that I can trust what the store says I hold.
job: protect-affirmed
tags: [anti, trust, slice]

steps:
  - description: An idea
    command: ideas-capture
    input:
      type: principle
      statement: Water in the morning, never at dusk.
    expect:
      success: true

  - description: I hold it
    command: ideas-affirm
    input:
      ids: ["${{ steps[0].data.id }}"]
    expect:
      success: true

  - description: An agent proposes another wording
    command: ideas-reframe
    input:
      id: "${{ steps[0].data.id }}"
      statement: Water at dawn or dusk, whichever is cooler.
      reason: Proposed by an agent.
    expect:
      success: true
      data:
        standing: seed

  - description: What I hold is still my wording, with the proposal waiting
    command: ideas-open
    input:
      id: "${{ steps[0].data.id }}"
    expect:
      success: true
      data:
        standing: affirmed
        statement: { contains: never at dusk }
        pending: { exists: true }

  - description: A bundle of affirmed ideas returns my wording
    command: ideas-bundle
    input:
      ids: ["${{ steps[0].data.id }}"]
      standing: [affirmed]
    expect:
      success: true
      data:
        ideas: { length: 1 }

  - description: A new run
    command: ideas-run-open
    input:
      sources: []
      extractor: better-fixture-model, prompt 2
    expect:
      success: true

  - description: The run finds the idea again and is refused
    command: ideas-capture
    input:
      type: principle
      statement: Morning is the time to water; evening watering should be avoided.
      run: "${{ steps[5].data.run }}"
    expect:
      success: false
      error:
        code: ALREADY_EXISTS

  - description: My wording still stands
    command: ideas-open
    input:
      id: "${{ steps[0].data.id }}"
    expect:
      success: true
      data:
        standing: affirmed
