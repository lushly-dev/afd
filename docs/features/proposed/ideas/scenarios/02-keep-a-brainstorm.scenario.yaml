# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.
#
# The transcript is sent in the call, so a model typed it. Nothing taken from it is attested,
# however it is quoted: the person's own sentences are affirmed in a review like any other seed.

name: Keep a brainstorm and pull its ideas out
description: >-
  When I finish a brainstorm or a voice memo, I want the raw session kept and its ideas pulled
  out against it, with my words told apart from the agent's, so that my thinking is preserved,
  its ideas are usable, and each can be traced back to what was said.
job: keep-a-brainstorm
tags: [collect, loop]

steps:
  - description: Send the transcript, naming the speaker who is the person
    command: ideas-source-add
    input:
      title: Bed planning, spoken notes
      kind: transcript
      thoughtOn: "2026-10-02"
      speaker: Me
      content: "Me: Mulch is the cheapest irrigation I have.\nAssistant: Drip lines would save more water than mulch.\nMe: I should stop watering by the calendar."
    expect:
      success: true
      data:
        source: { matches: '^src-' }
        arrived: call
        attests: false
        sentences: 3
        copyOf: { notExists: true }

  - description: Open a run that names the source and the extractor
    command: ideas-run-open
    input:
      sources: ["${{ steps[0].data.source }}"]
      extractor: fixture-model, prompt 1
    expect:
      success: true
      data:
        run: { matches: '^run-' }

  - description: A sentence the person said, cited by its number; the engine says whose turn it was
    command: ideas-capture
    input:
      type: position
      statement: Mulch is the cheapest irrigation I have.
      run: "${{ steps[1].data.run }}"
      sources:
        - source: "${{ steps[0].data.source }}"
          sentences: [1]
    expect:
      success: true
      data:
        standing: seed
        saidBy: person

  - description: A sentence the agent said in the same session
    command: ideas-capture
    input:
      type: position
      statement: Drip lines would save more water than mulch.
      run: "${{ steps[1].data.run }}"
      sources:
        - source: "${{ steps[0].data.source }}"
          sentences: [2]
    expect:
      success: true
      data:
        standing: seed
        saidBy: other

  - description: A model's restatement of what the person said
    command: ideas-capture
    input:
      type: principle
      statement: Water when the soil asks for it, not when the calendar says so.
      run: "${{ steps[1].data.run }}"
      sources:
        - source: "${{ steps[0].data.source }}"
          sentences: [3]
    expect:
      success: true
      data:
        standing: seed

  - description: Close the run, so the source counts as mined by this extractor
    command: ideas-run-close
    input:
      run: "${{ steps[1].data.run }}"
    expect:
      success: true
      data:
        closed: true

  - description: The first idea traces back to the session it came from
    command: ideas-open
    input:
      id: "${{ steps[2].data.id }}"
    expect:
      success: true
      data:
        sources: { length: 1 }

  - description: And the session can be read back, sentence by sentence
    command: ideas-source-open
    input:
      source: "${{ steps[0].data.source }}"
    expect:
      success: true
      data:
        sentences: { length: 3 }

  - description: Put my own sentence in front of me
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[2].data.id }}"
          version: "${{ steps[2].data.version }}"
    expect:
      success: true
      data:
        review: { matches: '^rev-' }
        counts:
          affirm: 1

  - description: I hold it
    command: ideas-review-apply
    input:
      review: "${{ steps[8].data.review }}"
      digest: "${{ steps[8].data.digest }}"
    expect:
      success: true
      data:
        applied:
          affirm: 1

  - description: My sentence is what I hold
    command: ideas-open
    input:
      id: "${{ steps[2].data.id }}"
    expect:
      success: true
      data:
        standing: affirmed

  - description: The agent's sentence is still only a suggestion
    command: ideas-open
    input:
      id: "${{ steps[3].data.id }}"
    expect:
      success: true
      data:
        standing: seed

  - description: The same transcript sent again is recognised as the same source
    command: ideas-source-add
    input:
      title: Bed planning, spoken notes (again)
      kind: transcript
      content: "Me: Mulch is the cheapest irrigation I have.\nAssistant: Drip lines would save more water than mulch.\nMe: I should stop watering by the calendar."
    expect:
      success: true
      data:
        copyOf: { matches: '^src-' }

  - description: A copy that differs only in line endings is reported as a near copy
    command: ideas-source-add
    input:
      title: Bed planning, exported
      kind: transcript
      content: "Me: Mulch is the cheapest irrigation I have.\r\nAssistant: Drip lines would save more water than mulch.\r\nMe: I should stop watering by the calendar.  "
    expect:
      success: true
      data:
        nearCopyOf: { matches: '^src-' }
