# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.

name: Connect older ideas as the store grows
description: >-
  When the store has grown, I want older ideas that belong together to be offered for linking,
  and a pair I have judged not to belong never offered again, so that connections do not depend
  on what I remembered at capture.
job: connect-older-ideas
tags: [organise, slice]

steps:
  - description: An idea
    command: ideas-capture
    input:
      type: principle
      statement: Sow green manure as soon as a bed is cleared.
    expect:
      success: true

  - description: A related one, captured without a link
    command: ideas-capture
    input:
      type: evidence
      statement: In the fixture beds, a winter cover of rye held twice the nitrogen of bare soil.
    expect:
      success: true
      data:
        related: { length: 1 }

  - description: One that only sounds related
    command: ideas-capture
    input:
      type: principle
      statement: Clear a bed the day its crop is finished, before pests settle in.
    expect:
      success: true
      data:
        related: { length: 1 }

  - description: Both pairs are offered
    command: ideas-link-candidates
    expect:
      success: true
      data:
        total: 2

  - description: A model judges the first pair and states the link
    command: ideas-link
    input:
      from: "${{ steps[1].data.id }}"
      kind: supports
      to: "${{ steps[0].data.id }}"
    expect:
      success: true

  - description: It judges that the second pair does not belong together, and that is recorded
    command: ideas-settle
    input:
      check: link-candidate
      subjects: ["${{ steps[0].data.id }}", "${{ steps[2].data.id }}"]
      how: unrelated
      reason: One is about what to sow, the other about pests.
    expect:
      success: true

  - description: Nothing is left to offer
    command: ideas-link-candidates
    expect:
      success: true
      data:
        total: 0
