# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.

name: Change my mind once, and see what rested on it
description: >-
  When my view on something changes, I want to change it once and see everything that rested on
  the old view, so that nothing stale survives.
job: change-my-mind
tags: [change, loop]

steps:
  - description: The view
    command: ideas-capture
    input:
      type: position
      statement: Tomatoes should be pruned to a single stem.
    expect:
      success: true

  - description: Put that wording in front of me
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[0].data.id }}"
          version: "${{ steps[0].data.version }}"
    expect:
      success: true

  - description: I hold it
    command: ideas-review-apply
    input:
      review: "${{ steps[1].data.review }}"
      digest: "${{ steps[1].data.digest }}"
    expect:
      success: true
      data:
        applied:
          affirm: 1

  - description: A practice that rests on it
    command: ideas-capture
    input:
      type: principle
      statement: Space tomato plants 45 cm apart.
    expect:
      success: true

  - description: Say that it rests on it
    command: ideas-link
    input:
      from: "${{ steps[3].data.id }}"
      kind: depends-on
      to: "${{ steps[0].data.id }}"
    expect:
      success: true

  - description: A synthesis that summarises it
    command: ideas-capture
    input:
      type: synthesis
      statement: Tomato care here is built around single-stem plants.
      links:
        - kind: summarises
          to: "${{ steps[0].data.id }}"
    expect:
      success: true

  - description: An article that used it
    command: ideas-output-record
    input:
      title: Growing tomatoes in a short season
      format: article
      ideas: ["${{ steps[0].data.id }}"]
    expect:
      success: true
      data:
        output: { matches: '^out-' }
        pinned: 1

  - description: I change my mind, with the reason
    command: ideas-reframe
    input:
      id: "${{ steps[0].data.id }}"
      statement: Tomatoes do better on two stems where the season is long enough.
      reason: Two seasons of side-by-side rows.
    expect:
      success: true
      data:
        version: 2
        standing: seed

  - description: Until I affirm it, the new wording waits and the old one is still what I hold
    command: ideas-open
    input:
      id: "${{ steps[0].data.id }}"
    expect:
      success: true
      data:
        standing: affirmed
        statement: { contains: single stem }
        pending: { exists: true }
        history: { length: 2 }

  - description: A wording that only waits disturbs nothing
    command: ideas-check
    input:
      checks: [rests-on-changed, synthesis-out-of-date]
    expect:
      success: true
      data:
        counts:
          rests-on-changed: 0
          synthesis-out-of-date: 0

  - description: Put the new wording in front of me, by its version
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[0].data.id }}"
          version: "${{ steps[7].data.version }}"
    expect:
      success: true

  - description: Before I confirm, the review says what rests on the wording I am leaving
    command: ideas-review-show
    expect:
      success: true
      data:
        total: 1
        affected:
          restsOn: 1
          syntheses: 1
          outputs: 1

  - description: I affirm it
    command: ideas-review-apply
    input:
      review: "${{ steps[11].data.review }}"
      digest: "${{ steps[11].data.digest }}"
    expect:
      success: true

  - description: The new wording is what I hold
    command: ideas-open
    input:
      id: "${{ steps[0].data.id }}"
    expect:
      success: true
      data:
        standing: affirmed
        statement: { contains: two stems }
        pending: { notExists: true }

  - description: What rested on the old view is reported
    command: ideas-check
    input:
      checks: [rests-on-changed, synthesis-out-of-date]
    expect:
      success: true
      data:
        counts:
          rests-on-changed: 1
          synthesis-out-of-date: 1

  - description: The article no longer matches
    command: ideas-output-show
    input:
      output: "${{ steps[6].data.output }}"
    expect:
      success: true
      data:
        drift:
          changed: 1

  - description: The spacing still holds on two stems, and that is recorded
    command: ideas-settle
    input:
      check: rests-on-changed
      subjects: ["${{ steps[3].data.id }}", "${{ steps[0].data.id }}"]
      how: still-holds
      reason: Two stems fit the same spacing.
    expect:
      success: true

  - description: The synthesis is rewritten against the new view
    command: ideas-reframe
    input:
      id: "${{ steps[5].data.id }}"
      statement: Tomato care here is built around two-stem plants where the season allows.
      reason: Follows the change of view on pruning.
    expect:
      success: true

  - description: The article is dated and stays as it was written, and that is recorded
    command: ideas-settle
    input:
      check: output-drifted
      subjects: ["${{ steps[6].data.output }}"]
      how: stands
      reason: A piece about one season; it says what I thought then.
    expect:
      success: true

  - description: Nothing stale is left
    command: ideas-check
    input:
      checks: [rests-on-changed, synthesis-out-of-date, output-drifted]
    expect:
      success: true
      data:
        counts:
          rests-on-changed: 0
          synthesis-out-of-date: 0
          output-drifted: 0
