# Draft JTBD scenario for the Ideas proposal. The commands and their shapes are proposals;
# the statements are invented fixtures about gardening and assert nothing about the world.

name: Frame the same idea for an audience
description: >-
  When I write for a particular audience, I want my ideas in that audience's wording without
  keeping a second copy, so that one change reaches every framing that has not said otherwise.
job: frame-for-an-audience
tags: [use, whole]

steps:
  - description: A framing for beginners
    command: ideas-framing-create
    input:
      id: beginners
      title: Beginners
      parent: core
    expect:
      success: true

  - description: A framing for market growers
    command: ideas-framing-create
    input:
      id: growers
      title: Market growers
      parent: core
    expect:
      success: true

  - description: The idea as I hold it
    command: ideas-capture
    input:
      type: principle
      statement: Match cultivar maturity days to the frost-free window.
    expect:
      success: true

  - description: Put that wording in front of me
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[2].data.id }}"
          version: "${{ steps[2].data.version }}"
    expect:
      success: true

  - description: I hold it
    command: ideas-review-apply
    input:
      review: "${{ steps[3].data.review }}"
      digest: "${{ steps[3].data.digest }}"
    expect:
      success: true

  - description: Reword it for beginners
    command: ideas-reframe
    input:
      id: "${{ steps[2].data.id }}"
      framing: beginners
      statement: Pick varieties that ripen before your first autumn frost.
      reason: Plain words for a first-year grower.
    expect:
      success: true

  - description: The beginners framing resolves the plain wording
    command: ideas-open
    input:
      id: "${{ steps[2].data.id }}"
      framing: beginners
    expect:
      success: true
      data:
        statement: { contains: first autumn frost }

  - description: The growers framing has said nothing, so it resolves mine
    command: ideas-open
    input:
      id: "${{ steps[2].data.id }}"
      framing: growers
    expect:
      success: true
      data:
        statement: { contains: frost-free window }

  - description: I sharpen the idea at the root
    command: ideas-reframe
    input:
      id: "${{ steps[2].data.id }}"
      statement: Match cultivar maturity days to the frost-free window, less two weeks.
      reason: Late springs kept catching me out.
    expect:
      success: true

  - description: Put the sharper wording in front of me
    command: ideas-review-stage
    input:
      decisions:
        - decide: affirm
          id: "${{ steps[2].data.id }}"
          version: "${{ steps[8].data.version }}"
    expect:
      success: true

  - description: I hold it
    command: ideas-review-apply
    input:
      review: "${{ steps[9].data.review }}"
      digest: "${{ steps[9].data.digest }}"
    expect:
      success: true

  - description: The one change reached the framing that had not said otherwise
    command: ideas-open
    input:
      id: "${{ steps[2].data.id }}"
      framing: growers
    expect:
      success: true
      data:
        statement: { contains: less two weeks }

  - description: The beginners framing keeps its own wording
    command: ideas-open
    input:
      id: "${{ steps[2].data.id }}"
      framing: beginners
    expect:
      success: true
      data:
        statement: { contains: first autumn frost }

  - description: The two framings differ in one idea
    command: ideas-compare
    input:
      a:
        framing: core
      b:
        framing: beginners
    expect:
      success: true
      data:
        differs: { length: 1 }

  - description: Drop the beginners wording
    command: ideas-restore
    input:
      id: "${{ steps[2].data.id }}"
      framing: beginners
      reason: The sharper wording is plain enough.
    expect:
      success: true

  - description: The beginners framing follows the root again
    command: ideas-open
    input:
      id: "${{ steps[2].data.id }}"
      framing: beginners
    expect:
      success: true
      data:
        statement: { contains: less two weeks }

  - description: Nothing differs
    command: ideas-compare
    input:
      a:
        framing: core
      b:
        framing: beginners
    expect:
      success: true
      data:
        differs: { length: 0 }
