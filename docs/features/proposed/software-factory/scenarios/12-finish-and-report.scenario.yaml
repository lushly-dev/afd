# Draft JTBD scenario for the Software Factory proposal. Commands and shapes are proposals; the data is invented.
# The run's history is fixture state the lane's loop would have written.
name: Finish a run and see its numbers
description: >-
  When the queue is empty and nothing is left, I want the run's numbers and a clean stop, so
  that I can judge the routes and dials without anyone keeping records by hand.
job: finish-and-report
tags: [slice]
fixture:
  file: fixtures/finished.json
  base: fresh.json
steps:
  - description: The wait reports the empty queue
    command: lane-wait
    input: { timeoutMs: 1000 }
    expect:
      success: true
      data:
        event: { type: queue-empty }
  - description: The report gives the run's numbers
    command: lane-report
    input: { run: run-1 }
    expect:
      success: true
      data:
        mergedPerHour: 2.25
        staleRuns: 0
        reruns: 3
  - description: The lane stops cleanly
    command: lane-stop
    expect:
      success: true
      data: { running: false }
