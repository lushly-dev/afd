# Draft JTBD scenario for the Software Factory proposal. Commands and shapes are proposals; the data is invented.
name: Stop starting cells when every plan is at its ceiling
description: >-
  When every plan has used more than the ceiling, I want to be told to start nothing and when the
  next window resets, and a registration refused, so that no cell is paused for days holding its issue.
job: stop-at-the-ceiling
fixture:
  file: fixtures/at-ceiling.json
  base: fresh.json
steps:
  - description: Both plans are marked above the ceiling
    command: plan-list
    expect:
      success: true
      data:
        plans:
          - { id: plan-a, aboveCeiling: true }
          - { id: plan-b, aboveCeiling: true }
  - description: Status says not to start a cell, why, and when room returns
    command: lane-status
    expect:
      success: true
      data:
        canStartCell: false
        reason: { contains: ceiling }
        nextReset: '2030-01-08T00:00:00Z'
  - description: A registration on a plan above its ceiling is refused
    command: cell-register
    input: { branch: fix/parser-empty-input, issues: [101], thread: thread-1, plan: plan-a, route: sol/high }
    expect:
      success: false
      error:
        code: PLAN_ABOVE_CEILING
        suggestion: { contains: '2030-01-08' }
