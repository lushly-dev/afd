# Draft JTBD scenario for the Software Factory proposal. Commands and shapes are proposals; the data is invented.
# The ejection is fixture state the lane's loop would have written.
name: Get an ejected branch back and return to the front
description: >-
  When the lane ejects my branch, I want the reason, the failing line and the log, and my repaired
  branch to go to the front of the queue, so that one repair costs one more validation and no wait.
job: return-an-ejected-branch
tags: [slice]
fixture:
  file: fixtures/ejected.json
  base: fresh.json
steps:
  - description: The foreman's wait returns the ejection with everything the cell needs
    command: lane-wait
    input: { consumer: foreman, timeout_ms: 1000 }
    expect:
      success: true
      data:
        events:
          - id: ev-7
            type: ejected
            branch: fix/parser-empty-input
            reason: final-failed
            detail: { contains: parses empty input }
            logPath: { contains: attempts/ }
  - description: Reading does not resolve it, and the lane has counted the ejection
    command: lane-status
    expect:
      success: true
      data:
        openEvents: { length: 1 }
        cells:
          - { branch: fix/parser-empty-input, ejections: 1 }
  - description: The repaired branch goes ahead of the branch that was already waiting
    command: lane-enqueue
    input: { worktree: wt/parser }
    expect:
      success: true
      data:
        state: queued
        position: 1
  - description: The re-enqueue answered the ejection
    command: lane-status
    expect:
      success: true
      data:
        openEvents: { length: 0 }
  - description: A second wait has nothing new
    command: lane-wait
    input: { consumer: foreman, timeout_ms: 1 }
    expect:
      success: true
      data:
        events: { length: 0 }
        timedOut: true
