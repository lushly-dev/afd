# Draft JTBD scenario for the Software Factory proposal. Commands and shapes are proposals; the data is invented.
# do-triage itself is a skill that writes labels through gh; these steps show what it reads back.
name: Triage the backlog so the foreman takes the most urgent work first
description: >-
  When issues arrive unlabelled or labelled against the rules, I want them listed with each broken
  rule and the dispatchable issues listed in priority order, with stale claims named, so that the
  foreman takes the most urgent work first and two cells never take the same issue.
job: triage-the-backlog
tags: [slice]
fixture:
  file: fixtures/backlog.json
  base: fresh.json
steps:
  - description: The check lists untriaged issues, rule violations, the dispatch order and stale claims
    command: issue-check
    expect:
      success: true
      data:
        untriaged: [202]
        violations:
          - { number: 203, rule: { contains: one execution } }
        dispatchable: [206, 201]
        staleClaims:
          - { number: 208, branch: fix/cli-help }
  - description: Registering a cell on the first dispatchable issue claims it
    command: cell-register
    input: { branch: fix/server-timeout, issues: [206], route: sol/high }
    expect:
      success: true
      data:
        cell: { issues: [206] }
  - description: An issue another cell holds is refused, naming the holder
    command: cell-register
    input: { branch: fix/other-attempt, issues: [205], route: sol/high }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/client-timeout
        suggestion: { contains: issue-check }
  - description: An issue triage deferred cannot be taken
    command: cell-register
    input: { branch: feat/naming, issues: [204], route: sol/high }
    expect:
      success: false
      error:
        code: NOT_DISPATCHABLE
        suggestion: { contains: do-triage }
  - description: The claimed issue leaves the dispatch list, and the expert lane never enters it
    command: issue-check
    expect:
      success: true
      data:
        dispatchable: [201]
