# Draft JTBD scenario for the Software Factory proposal. Commands and shapes are proposals; the data is invented.
name: Triage the backlog so the foreman has work
description: >-
  When issues arrive unlabelled or labelled against the rules, I want them listed with each broken
  rule and the planned, unclaimed issues listed apart, so that the foreman dispatches only work
  triage has decided and two cells never take the same issue.
job: triage-the-backlog
tags: [slice]
fixture:
  file: fixtures/backlog.json
steps:
  - description: The check lists untriaged issues, rule violations and what may be dispatched
    command: issue-check
    expect:
      success: true
      data:
        untriaged: [202]
        violations:
          - { number: 203, rule: { contains: one execution } }
        dispatchable: [201]
  - description: A cell claims a dispatchable issue for its branch
    command: issue-claim
    input: { number: 201, branch: fix/parser-empty-input }
    expect:
      success: true
      data:
        claim: { number: 201, branch: fix/parser-empty-input }
  - description: A second claim on the same issue is refused, naming the holder
    command: issue-claim
    input: { number: 201, branch: fix/other-attempt }
    expect:
      success: false
      error:
        code: ALREADY_CLAIMED
        message: fix/parser-empty-input
        suggestion: { contains: issue-check }
  - description: An issue triage deferred cannot be claimed
    command: issue-claim
    input: { number: 204, branch: feat/naming }
    expect:
      success: false
      error:
        code: NOT_DISPATCHABLE
        suggestion: { contains: do-triage }
  - description: The claimed issue leaves the dispatchable list
    command: issue-check
    expect:
      success: true
      data:
        dispatchable: { length: 0 }
