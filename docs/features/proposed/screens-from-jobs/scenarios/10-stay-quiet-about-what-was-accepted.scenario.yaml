# Draft JTBD scenario for the Screens from Jobs proposal. The commands and their shapes are
# proposals, and the data is invented. A set labelled `main` holds `example-keep-a-draft`'s
# captures, and nothing has changed on the branch since.

name: Stay quiet about what was accepted
description: >-
  When a job step's screen is the same as on main, or a change to it was already answered, I want
  it left out of what I am shown and only counted, so that my attention goes only to what changed.
job: stay-quiet-about-what-was-accepted
tags: []

steps:
  - description: The job runs on the branch
    command: specimen-job-run
    input:
      id: example-keep-a-draft
      label: branch
    expect:
      success: true
      data:
        status: passed

  - description: Nothing changed, so nothing is listed, only counted
    command: specimen-review
    input:
      before: main
      after: branch
      ids: [example-keep-a-draft]
    expect:
      success: true
      data:
        open: { length: 0 }
        blocking: { length: 0 }
        settled.unchanged: 2
