# Draft JTBD scenario for the Agent OS proposal. Commands and shapes are proposals; the data is invented.
# The caller is a cell repairing an ejected branch on the lane host. Every step runs as the same
# test actor, so the scenario cannot show that; the commands are the lane's own. The fixture
# (fixtures/ejected.json over fixtures/host.json) holds the lane's failed run, whose id the
# ejection gave the cell, on a machine the lane has destroyed. The fake runtime plays that head's
# failure again and then the repaired head. What the cell does when the failure does not happen
# in the machine is the factory's rule, not a command of the host.
name: Reproduce a branch's failure in a machine of the cell's own
description: >-
  When my branch is ejected for a failure that does not happen on my own system, I want to repeat
  the lane's failed run in a machine, read what failed, and run my repair there before I queue
  again, so that I repair the cause and not my reading of a log.
job: reproduce-a-failure-in-a-machine
tags: [m1]
fixture:
  file: fixtures/ejected.json
  base: host.json
steps:
  - description: The run the ejection names says what the lane ran, on which commit and base, and in what size
    command: run-get
    input: { id: r-41 }
    expect:
      success: true
      data:
        run:
          for: fix/parser
          state: failed
          fault: branch
          failed: validate
          head: 7c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d
          base: 0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f0f
          size: standard
          steps:
            - { label: install, args: [pnpm, install, "--frozen-lockfile"], timeoutSeconds: 1800, network: registries }
            - { label: validate, args: [pnpm, verify, "--keep-going"], timeoutSeconds: 5400, network: none }
  - description: The lane destroyed its machine with the ejection, so the cell makes one of the same size
    command: machine-create
    input:
      repository: example-repo
      for: fix/parser
      size: "${{ steps[0].data.run.size }}"
      ttlMinutes: 240
    expect:
      success: true
      data:
        created: true
        machine:
          for: fix/parser
          size: standard
          credentials: { length: 0 }
          expiresAt: { exists: true }
  - description: The same steps on the same commit and base
    command: run-start
    input:
      machine: "${{ steps[1].data.machine.id }}"
      head: "${{ steps[0].data.run.head }}"
      base: "${{ steps[0].data.run.base }}"
      steps:
        - label: install
          args: [pnpm, install, "--frozen-lockfile"]
          timeoutSeconds: 1800
          network: registries
        - label: validate
          args: [pnpm, verify, "--keep-going"]
          timeoutSeconds: 5400
          network: none
    expect:
      success: true
      data:
        run:
          state: running
  - description: The failure happens here as it did in the lane's validation
    command: run-wait
    input: { id: "${{ steps[2].data.run.id }}", timeoutMs: 300000 }
    expect:
      success: true
      data:
        waitExpired: false
        run:
          state: failed
          fault: branch
          failed: validate
          log:
            trust: content
            tail: { includes: "FAIL packages/example/src/parser.test.ts > accepts empty input" }
  - description: The failing step's log is there to read, labelled as content from the machine
    command: run-log
    input: { id: "${{ steps[2].data.run.id }}", step: validate }
    expect:
      success: true
      data:
        trust: content
        lines: { includes: "AssertionError: expected an empty document, received an error" }
  - description: The repaired head runs in the same machine, on a fresh checkout that is installed again
    command: run-start
    input:
      machine: "${{ steps[1].data.machine.id }}"
      head: 6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d
      base: "${{ steps[0].data.run.base }}"
      steps:
        - label: install
          args: [pnpm, install, "--frozen-lockfile"]
          timeoutSeconds: 1800
          network: registries
        - label: validate
          args: [pnpm, verify, "--keep-going"]
          timeoutSeconds: 5400
          network: none
    expect:
      success: true
      data:
        run:
          state: running
          head: 6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d
  - description: And passes, so the branch is worth queueing again
    command: run-wait
    input: { id: "${{ steps[5].data.run.id }}", timeoutMs: 300000 }
    expect:
      success: true
      data:
        run:
          state: passed
  - description: The cell gives the machine back before it queues its branch
    command: machine-destroy
    input: { id: "${{ steps[1].data.machine.id }}", reason: Reproduced and repaired }
    expect:
      success: true
      data:
        destroyed: true
        changed: true
  - description: The seat it took is free again
    command: host-status
    expect:
      success: true
      data:
        capacity:
          machines: { active: 0 }
