# Draft JTBD scenario for the Patterns proposal. The commands and their shapes are proposals.
# The data is invented, on the pack format's `example` library. Canonical `example/select` keep
# order across scenarios: 0=named, 1=escape-closes, 2=shows-choice, 3=fits-narrow.
# `example-select` passes its pattern's gates. `example-dropdown` has been changed so that Escape
# closes its popup and leaves focus on the page.
# Lists are asserted with dotted index paths where only part of an item or a variable length
# matters, because `afd-testing` requires exact length matches on object arrays and compares
# plain arrays whole.

name: Hold a component to its pattern
description: >-
  When I change a component, I want its patterns' gates run against it, so that a broken
  requirement fails before anyone reviews it.
job: hold-to-its-pattern
tags: [slice, verify]

steps:
  - description: Gate cases for a pattern can be listed selectively without dumping every story
    command: specimen-list
    input:
      pattern: select
      kind: gate
    expect:
      success: true
      data:
        specimens.0.id: example-select-three-options--gate--escape-closes

  - description: A gate runs as a native gate case without flooding context with a full observation
    command: specimen-run
    input:
      id: example-select-three-options--gate--escape-closes
      capture: none
    expect:
      success: true
      data:
        id: example-select-three-options--gate--escape-closes
        outcome.status: passed

  - description: Coverage reports pattern statements in patterns@1 without altering schema-partitions@1 or guides@1
    command: specimen-coverage
    input:
      component: example-select
    expect:
      success: true
      data:
        obligations: schema-partitions@1
        guides.obligations: guides@1
        patterns.obligations: patterns@1
        patterns.complete: true
        patterns.implementations.0.library: example
        patterns.implementations.0.pattern: select
        patterns.implementations.0.tag: example-select
        patterns.implementations.0.keep.0.id: select.keep.named
        patterns.implementations.0.keep.0.level: verified
        patterns.implementations.0.keep.1.id: select.keep.escape-closes
        patterns.implementations.0.keep.1.level: verified

  - description: The same gate on the changed component fails its case and names the failing step
    command: specimen-run
    input:
      id: example-dropdown-three-options--gate--escape-closes
      capture: none
    expect:
      success: true
      data:
        outcome.status: failed
        outcome.failures.0.stepId: back

  - description: The committed pack no longer matches, so the regression cannot land unnoticed
    command: specimen-pack-check
    input: {}
    expect:
      success: true
      data:
        valid: false
