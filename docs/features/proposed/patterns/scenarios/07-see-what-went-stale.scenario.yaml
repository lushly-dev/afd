# Draft JTBD scenario for the Patterns proposal. The commands and their shapes are proposals.
# The data is invented, on the pack format's `example` library. The saved copy
# `collection-empty` uses `example-field`. The copy `fruit-picker` uses `example-select` and
# `example-option`. Since the pack was last built, the manifest's declaration of `example-field`
# has changed: its `label` attribute was renamed, and `orders-empty` has been updated to match.
# Lists are asserted with dotted index paths where only part of an item or a variable length
# matters, because `afd-testing` requires exact length matches on object arrays and compares
# plain arrays whole.

name: See which saved references a change has made stale
description: >-
  When a component's API changes, I want the saved references that depend on it named and a way
  to refresh them, so that I re-check those and no others until the pack is clean again.
job: see-what-went-stale
tags: [maintain]

steps:
  - description: A fast browserless fingerprint check names only the stale copy and the changed manifest tag
    command: specimen-pack-check
    input:
      fingerprintsOnly: true
    expect:
      success: true
      data:
        valid: false
        stale: { length: 1 }
        stale.0.file: data/example/patterns/empty-collection/collection-empty.json
        stale.0.pattern: empty-collection
        stale.0.name: collection-empty
        stale.0.reason: fingerprint
        stale.0.tags.0: example-field
        stale.0.origin.id: orders-empty
        changedTags: { includes: example-field }

  - description: Re-saving the updated region replaces the copy and records the new fingerprint
    command: specimen-pattern-save
    input:
      id: orders-empty
      target: { role: region, name: Orders }
      pattern: empty-collection
      name: collection-empty
      replace: true
    expect:
      success: true
      data:
        pattern: empty-collection
        implementation: collection-empty
        status: complete
        fingerprint: { matches: '^sha256:[0-9a-f]{64}$' }

  - description: Rebuilding the pack updates the component record and the refreshed copy record
    command: specimen-pack
    input: {}
    expect:
      success: true
      data:
        written: { exists: true }

  - description: The fingerprint check passes with no stale copies remaining
    command: specimen-pack-check
    input:
      fingerprintsOnly: true
    expect:
      success: true
      data:
        valid: true
        stale: { length: 0 }
