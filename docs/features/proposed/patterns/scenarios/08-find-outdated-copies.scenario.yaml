# Draft JTBD scenario for the Patterns proposal. The commands and their shapes are proposals.
# The data is invented. The page's source holds three copied regions. One carries the revision
# the pack holds for `collection-empty`, one carries an earlier revision of it, and one names a
# copy the pack does not have. The digests below stand in for real ones.
# Lists are asserted with dotted index paths where only part of an item or a variable length
# matters, because `afd-testing` requires exact length matches on object arrays and compares
# plain arrays whole.
#
# What this cannot show: the answer also carries a warning with the count of copies that
# differ, and `expect` cannot reach `warnings`.

name: Find copies whose source has changed
description: >-
  When a page holds regions copied from references, I want each copy's source named and
  whether it still matches, so that a fixed defect can be repaired where it was copied.
job: find-outdated-copies
tags: [maintain]

steps:
  - description: Each provenance marker in the source is reported under content with line and revision
    command: components-brief
    input:
      source: >-
        <section data-pattern-copy="example/empty-collection/collection-empty
        sha256:1111111111111111111111111111111111111111111111111111111111111111">…</section>
        <section data-pattern-copy="example/empty-collection/collection-empty
        sha256:2222222222222222222222222222222222222222222222222222222222222222">…</section>
        <section data-pattern-copy="example/saved-search/search-saved
        sha256:3333333333333333333333333333333333333333333333333333333333333333">…</section>
    expect:
      success: true
      data:
        content.trust: content
        content.copies: { length: 3 }
        content.copies.0.library: example
        content.copies.0.pattern: empty-collection
        content.copies.0.implementation: collection-empty
        content.copies.0.state: current
        content.copies.0.line: { gte: 1 }
        content.copies.0.revision: sha256:1111111111111111111111111111111111111111111111111111111111111111
        content.copies.1.library: example
        content.copies.1.pattern: empty-collection
        content.copies.1.implementation: collection-empty
        content.copies.1.state: differs
        content.copies.1.line: { gte: 1 }
        content.copies.1.currentRevision: sha256:1111111111111111111111111111111111111111111111111111111111111111
        content.copies.2.library: example
        content.copies.2.pattern: saved-search
        content.copies.2.implementation: search-saved
        content.copies.2.state: unknown

  - description: The current copy's markup, styles and keep statements are read to repair the one that differs
    command: components-pattern-open
    input:
      library: example
      pattern: empty-collection
      implementation: collection-empty
      sections: [keep, source]
    expect:
      success: true
      data:
        content.pattern.library: example
        content.pattern.pattern: empty-collection
        content.pattern.keep.0.id: { exists: true }
        content.pattern.implementations.0.library: example
        content.pattern.implementations.0.kind: copy
        content.pattern.implementations.0.name: collection-empty
        content.pattern.implementations.0.revision: sha256:1111111111111111111111111111111111111111111111111111111111111111
        content.pattern.implementations.0.html: { exists: true }
        content.pattern.implementations.0.css: { exists: true }

  - description: A pattern the pack does not hold is refused, with the way to find one
    command: components-pattern-open
    input:
      pattern: saved-search
    expect:
      success: false
      error:
        code: PATTERN_NOT_FOUND
        suggestion: { contains: components-pattern-list }
