# Draft JTBD scenario for the Patterns proposal. The commands and their shapes are proposals.
# The data is invented. `specimens/patterns/select/pattern.json` is sound.
# `specimens/patterns/listbox/pattern.json` has a gate whose target is the selector
# `example-option[selected]` and whose expectation reads the `selected` attribute.
# Lists are asserted with dotted index paths where only part of an item or a variable length
# matters, because `afd-testing` requires exact length matches on object arrays and compares
# plain arrays whole.

name: Refuse a gate only one implementation can take
description: >-
  When I write a gate that names one implementation's tag, attribute or structure, I want it
  refused, so that a gate stays a test any implementation can take.
job: refuse-an-unportable-gate
tags: [slice, refuse]

steps:
  - description: A pattern whose gates use roles and names passes, with no browser
    command: specimen-validate
    input:
      file: specimens/patterns/select/pattern.json
    expect:
      success: true
      data:
        valid: true
        scope: static
        issues: { length: 0 }

  - description: A gate that names a selector and an attribute is refused, with the way forward
    command: specimen-validate
    input:
      file: specimens/patterns/listbox/pattern.json
    expect:
      success: true
      data:
        valid: false
        issues: { length: 2 }
        issues.0.severity: error
        issues.0.code: GATE_NOT_PORTABLE
        issues.0.field: 'gates.shows-choice.scenario[0]'
        issues.0.suggestion: { contains: role }
        issues.1.severity: error
        issues.1.code: GATE_NOT_PORTABLE
        issues.1.field: 'gates.shows-choice.scenario[1]'
