# A scenario cannot assert `recovery`, or read the registry's notice, which carries no value
# for a secret either. The unit's tests do.
name: A secret stays with the person
description: >-
  When a control holds a secret, the agent must not be shown its value or its error, or be
  able to set it, so that my secrets never pass through an agent.
job: secret-stays-secret
tags: [slice]
fixture:
  file: fixtures/workshop-form.json
steps:
  - description: The control is listed, marked as a secret, without its value, the error it shows or a rev
    command: control-list
    input: {}
    expect:
      success: true
      data:
        controls.10.id: card-pin
        controls.10.label: Card PIN
        controls.10.secret: true
        controls.10.value: { notExists: true }
        controls.10.error: { notExists: true }
        controls.10.rev: { notExists: true }

  - description: Setting it is refused whatever rev is sent, and the person is the way forward
    command: control-set
    input:
      values:
        - { id: card-pin, value: "0000", rev: none }
    expect:
      success: false
      error:
        code: FORBIDDEN
        message: Card PIN is a secret
        suggestion: { contains: person }

  - description: Sent with another control, the secret stops both
    command: control-set
    input:
      values:
        - { id: attendee-name, value: Ada Okafor, rev: "${{ steps[0].data.controls[0].rev }}" }
        - { id: card-pin, value: "0000", rev: none }
    expect:
      success: false
      error:
        code: FORBIDDEN
        message: Card PIN is a secret

  - description: The other control was not changed
    command: control-list
    input: { group: Attendee }
    expect:
      success: true
      data:
        controls.0.value: ""
