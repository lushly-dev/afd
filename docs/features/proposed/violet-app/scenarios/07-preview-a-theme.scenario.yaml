# Draft JTBD scenario for the Violet app proposal. The commands and their shapes are proposals.
# The data is invented: the `example` template (proposal, section 4.2), and one hostile value.
#
# Not expressible: the preview region itself, components drawn in the theme, is page behaviour.
# The scenario shows what the region applies, which is also what an agent reads. Not shown: the
# preview's own `refused` list catching a value already in a document, since writes and imports
# refuse such a value first; it stays as a second check (proposal, 5.1).

name: Preview a theme on real components
description: >-
  When I edit a theme, I want to see the components drawn with that theme's values, in light,
  dark and high contrast, and to have a value that cannot be drawn safely refused, so that I
  judge the theme by eye and an unsafe value never reaches a stylesheet.
job: preview-a-theme
tags: [slice]

steps:
  - description: A tree document is created from the example template
    command: document-create
    input: { type: violet-tree, template: example, title: Example tree }
    expect:
      success: true
      data:
        id: { exists: true }
  - description: The high-contrast theme resolves to custom properties the preview applies
    command: violet-theme-preview
    input: { document: "${{ steps[0].data.id }}", node: example/high-contrast }
    expect:
      success: true
      data:
        node: example/high-contrast
        count: 6
        refused: { length: 0 }
  - description: A color value that would escape its declaration is refused when written
    command: violet-token-override
    input:
      document: "${{ steps[0].data.id }}"
      node: example/dark
      token: color.surface.page
      value: "#121214; background: url(https://example.invalid/x)"
    expect:
      success: false
      error:
        code: INVALID_TOKEN_VALUE
        suggestion: { contains: color }
  - description: The dark preview is unchanged
    command: violet-theme-preview
    input: { document: "${{ steps[0].data.id }}", node: example/dark }
    expect:
      success: true
      data:
        count: 6
        refused: { length: 0 }
