# Built in the to-do reference plan's phase 3 (docs/features/active/todo-reference).
# Runs against the page's own view-state commands (src/view-state.ts), which the page hosts
# through createDirectRegistry: view state is the page's, not the store's. src/view-state.test.ts
# runs it and checks the page's filter follows; frontends/fast-af/test/page.test.ts checks the list
# on screen follows an agent's view-state-set in Chromium.
name: An agent narrows the view
description: >-
  When I ask the copilot to show only my urgent open todos, I want the list on screen to change
  to them, so that I see the answer in the app instead of a copy of it in the chat.
job: narrow-the-view
tags: [view]
steps:
  - description: The view starts unfiltered
    command: view-state-get
    input: { id: todo-filter }
    expect:
      success: true
      data:
        state:
          status: all
          priority: all
  - description: The agent narrows it to open high-priority todos
    command: view-state-set
    input:
      id: todo-filter
      state: { status: pending, priority: high }
    expect:
      success: true
      data:
        state:
          status: pending
          priority: high
        previous:
          status: all
          priority: all
  - description: The view reads as narrowed
    command: view-state-get
    input: { id: todo-filter }
    expect:
      success: true
      data:
        state:
          status: pending
          priority: high
  - description: The person can have the old view back
    command: view-state-set
    input:
      id: todo-filter
      state: "${{ steps[1].data.previous }}"
      replace: true
    expect:
      success: true
      data:
        state:
          status: all
          priority: all
