[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afd-example-todo-python"
version = "1.0.0"
description = "Todo example - Python backend implementing AFD patterns"
requires-python = ">=3.10"
dependencies = [
    # The server extra brings in the MCP SDK's MCPServer, which serves the stdio transport.
    "afd[server]",
    "pydantic>=2.0.0",
]

[project.scripts]
todo-server = "todo_backend.server:main"

[dependency-groups]
dev = [
    # afd.testing: assertions and the scenario runner. It imports afd's transports, which need
    # the client extra's httpx, so both extras are listed.
    "afd[client,testing]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.17.4",
]

# Test the repository's afd package, not the release on PyPI.
[tool.uv.sources]
afd = { path = "../../../../../python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/todo_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# The repository's rules (python/pyproject.toml). CI runs `uv run --locked ruff check src tests`.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Field names are the wire contract's camelCase (spec/commands.schema.json).
"src/todo_backend/models.py" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["todo_backend"]
