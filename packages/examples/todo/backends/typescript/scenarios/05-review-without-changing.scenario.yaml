# Built in the to-do reference plan's phase 2 (docs/features/active/todo-reference).
# Runs with the context todo-reading active: src/scenarios.test.ts runs it in-process through
# createDirectRegistry's activeContext; over /mcp a client sends _meta["dev.afd/context"] on every
# request (MCP 2026-07-28 keeps no context between requests, so afd-context-enter stores nothing
# there). `afd scenario run` sends no _meta, so it cannot run this file.
# Contexts narrow what an agent is offered; they are not a security boundary. Keeping an agent
# from changing anything is phase 4's DirectClient `allow`, or authorization.
name: An agent reviewing the todos is offered only the reading commands
description: >-
  When I ask an agent only to review my todos, I want it offered just the commands that read
  them, so that it plans a review rather than edits and its tool list stays short.
job: review-with-reading-commands
tags: [contexts]
steps:
  - description: It can read
    command: todo-list
    input: {}
    expect:
      success: true
  - description: It can summarise
    command: todo-stats
    input: {}
    expect:
      success: true
  - description: Adding a todo is outside the context, and the error says which context has it
    command: todo-create
    input: { title: Buy a new water butt }
    expect:
      success: false
      error:
        code: COMMAND_NOT_IN_CONTEXT
        suggestion: { contains: context }
  - description: So is deleting one
    command: todo-delete
    input: { id: todo-any }
    expect:
      success: false
      error:
        code: COMMAND_NOT_IN_CONTEXT
