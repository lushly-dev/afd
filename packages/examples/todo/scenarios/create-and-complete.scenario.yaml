# JTBD Scenario: Create and Complete Todo
# Creates a todo, finds it in the list and completes it. It starts from whatever the server holds
# rather than clearing it first: a clear removes todos for good, so a server may hold it for
# approval (the TypeScript backend does), and a scenario should not need one.

name: Create and Complete Todo
description: As a user, I want to create a todo, see it in the list and mark it done
job: create-and-complete
tags: [smoke, basic, p0]

steps:
  # Step 0: Create a new todo
  - command: todo-create
    description: Create a new todo item
    input:
      title: Buy groceries for the allotment party
      description: Need milk, eggs, and bread
      priority: high
    expect:
      success: true
      data:
        title: Buy groceries for the allotment party
        description: Need milk, eggs, and bread
        priority: high
        completed: false
        id: { exists: true }
        createdAt: { exists: true }

  # Step 1: It appears in the list
  - command: todo-list
    description: Find the new todo in the list
    input:
      search: Buy groceries for the allotment party
    expect:
      success: true
      data:
        total: { gte: 1 }

  # Step 2: Complete it
  - command: todo-toggle
    description: Mark the todo done
    input:
      id: ${{ steps[0].data.id }}
    expect:
      success: true
      data:
        completed: true

  # Step 3: Stats count it as completed
  - command: todo-stats
    description: Statistics include a completed todo
    expect:
      success: true
      data:
        completed: { gte: 1 }
        completionRate: { gte: 0 }

  # Step 4: Clean up with a delete, which every server runs unasked
  - command: todo-delete
    description: Delete the todo this scenario created
    input:
      id: ${{ steps[0].data.id }}
    expect:
      success: true
