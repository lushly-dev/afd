[package]
name = "afd"
version = "0.1.0"
edition = "2021"
description = "Agent-First Development - Core types and utilities for Rust"
license = "MIT"
repository = "https://github.com/lushly-dev/afd"
documentation = "https://github.com/lushly-dev/afd/tree/main/packages/rust"
readme = "README.md"
keywords = ["afd", "agent", "mcp", "ai", "commands"]
categories = ["development-tools", "api-bindings"]

[features]
default = ["native"]
# Command, batch and pipeline deadlines through `tokio::time::timeout`. The
# host application provides the Tokio runtime (with its time driver enabled).
native = ["dep:tokio"]
# Browser WebAssembly (`wasm32-unknown-unknown`): measures durations with
# `web-time`, because `std::time::Instant::now()` traps on that target.
wasm = ["dep:web-time"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
futures-util = "0.3"

# Native-only: only `tokio::time::timeout` is used.
tokio = { version = "1.0", default-features = false, features = ["time"], optional = true }

# WASM-only
web-time = { version = "1.1", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
pretty_assertions = "1.4"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
