[package]
name = "afd"
version = "0.2.1"
edition = "2021"
# The minimum supported Rust version: 1.81 lacks `Option::is_none_or`. With dependencies resolved
# for it (Cargo's `incompatible-rust-versions = "fallback"`), `cargo +1.82.0 check` passes for
# every feature set except `server`, whose `rmcp` dependency needs Rust 1.88, and
# `journal-file-shared`, whose file locks (`std::fs::File::lock`) need Rust 1.89. Clippy's
# `incompatible_msrv` lint flags std APIs newer than this.
rust-version = "1.82"
description = "Agent-First Development - Core types and utilities for Rust"
license = "MIT"
repository = "https://github.com/lushly-dev/afd"
documentation = "https://github.com/lushly-dev/afd/tree/main/packages/rust"
readme = "README.md"
keywords = ["afd", "agent", "mcp", "ai", "commands"]
categories = ["development-tools", "api-bindings"]

[features]
default = ["native", "journal-file", "approval"]
# Command, batch and pipeline deadlines through `tokio::time::timeout`. The
# host application provides the Tokio runtime (with its time driver enabled).
native = ["dep:tokio"]
# Browser WebAssembly (`wasm32-unknown-unknown`): measures durations with
# `web-time`, because `std::time::Instant::now()` traps on that target.
wasm = ["dep:web-time", "getrandom?/wasm_js"]
# `FileJournalSink`: a command journal in a JSON Lines file, through blocking `std::fs`.
journal-file = []
# `FileJournalSink::shared`: several sinks and processes append to one journal file under an
# exclusive OS file lock (`std::fs::File::lock` and `try_lock`). Needs Rust 1.89.
journal-file-shared = ["journal-file"]
# The approval middleware (`create_approval_middleware`): HMAC-SHA256 tokens and OS-random nonces.
approval = ["dep:hmac", "dep:subtle", "dep:getrandom"]
# MCP server over Streamable HTTP and stdio, built on the official Rust SDK (`rmcp`). Serves MCP
# 2026-07-28 (stateless, per-request `_meta`) and 2025 `initialize` clients. Needs Rust 1.88.
server = ["native", "frontmatter", "dep:rmcp", "dep:http", "dep:getrandom", "tokio/rt", "tokio/io-std"]
# The YAML frontmatter reader (`afd::frontmatter`): a line `---`, one YAML 1.2 core-schema mapping,
# a line `---`, with no tags, anchors or aliases. `server` enables it for a skill's frontmatter;
# turn it on alone to read frontmatter without the MCP server.
frontmatter = ["dep:saphyr-parser"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip` parses floats exactly as JavaScript does, so canonical JSON (an approval
# token's input digest, the journal's context cap) matches TypeScript's.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
futures-util = "0.3"
# The command journal's context digest (`sha256:` hashes).
sha2 = "0.11"
# Numbers in canonical JSON (approval input digests, the journal's context cap), spelled as
# ECMAScript `Number::toString`.
ryu-js = "1.0"

# `approval` feature: the approval token's MAC and constant-time comparisons.
hmac = { version = "0.13", optional = true }
subtle = { version = "2.5", optional = true }

# Native-only: only `tokio::time::timeout` is used.
tokio = { version = "1.0", default-features = false, features = ["time"], optional = true }

# WASM-only
web-time = { version = "1.1", optional = true }

# `server` feature: the MCP Rust SDK (stateless Streamable HTTP, stdio).
rmcp = { version = "3.7", default-features = false, features = [
    "server",
    "transport-streamable-http-server",
    "transport-io",
    "request-state",
    "elicitation",
], optional = true }
# `frontmatter` feature (and so `server`): the YAML 1.2 event parser that reads frontmatter
# (`spec/mcp-resources.md`, S2); the crate builds the JSON value itself, so it can refuse tags,
# anchors and aliases and resolve plain scalars by the core schema.
saphyr-parser = { version = "0.3", optional = true }
# `server` feature: the request type the context hook reads (`http::request::Parts`); the
# version `rmcp` uses.
http = { version = "1", optional = true }
# `server` feature: the per-process key that signs confirmation `requestState`; `approval`
# feature: the approval token's nonce.
# 0.3 and 0.4 share `getrandom::fill`; 0.4 needs Rust 1.85, so the MSRV resolver falls back to
# 0.3 (the `server` feature needs 1.88 and gets 0.4).
getrandom = { version = ">=0.3, <0.5", optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["full", "test-util"] }
pretty_assertions = "1.4"
# `server` feature tests drive the HTTP service in process.
http = "1"
http-body-util = "0.1"
bytes = "1"
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
