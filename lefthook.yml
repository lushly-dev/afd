# Lefthook — Git Hooks for AFD
# https://github.com/evilmartians/lefthook
#
# Setup:  pnpm install  (auto-installs hooks via prepare script)
# Skip:   git commit --no-verify
# Docs:   https://lefthook.dev/configuration/
#
# WARNING: parallel: true causes terminal buffer deadlocks on Windows when
# multiple commands produce large stdout (Biome diffs, TS errors, sourcemap
# warnings). Always use parallel: false for hooks that run in VS Code terminals.

output:
  - summary
  - failure

pre-commit:
  # Sequential to prevent stdout interleaving deadlock on Windows.
  # Biome --write can produce 100+ line diffs; typecheck dumps errors;
  # both flood parallel terminal buffers and lock the VS Code terminal.
  parallel: false
  commands:
    lint:
      glob: "*.{ts,tsx,js,mjs,cjs,json}"
      # foundations/fast-af and the Violet units keep upstream formatting under their own Biome
      # configs (provenance-bound).
      exclude: "{.claude/**,alfred/**,site/**,foundations/fast-af/**,foundations/violet/**,integrations/violet-afd/**,endpoints/violet-cli/**,endpoints/violet-server/**}"
      # Provenance-only changes may contain no files admitted by Biome's config.
      run: npx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    portability:
      glob: "*.{ts,js,json,md,yml,yaml}"
      run: node scripts/check-portability.mjs {staged_files}

    file-size:
      glob: "*.ts"
      run: node scripts/check-file-size.mjs {staged_files}

    typecheck:
      glob: "*.ts"
      # Only the packages owning the staged files, and their dependents (scripts/affected.mjs).
      run: node scripts/affected.mjs run typecheck --files {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  # Sequential to prevent stdout interleaving deadlock on Windows
  # (Biome diffs + TS errors flood parallel output buffers)
  parallel: false
  # Package tests and typechecks cover only the packages affected since the merge base with
  # origin/main (scripts/affected.mjs). Repository-wide checks stay whole: they take seconds.
  commands:
    lint-all:
      run: pnpm lint

    test:
      run: node scripts/affected.mjs run test

    typecheck:
      run: node scripts/affected.mjs run typecheck

    portability:
      run: node scripts/check-portability.mjs

    file-size:
      run: node scripts/check-file-size.mjs

    orphan-files:
      run: node scripts/check-orphan-files.mjs

    versions:
      run: node scripts/check-versions.mjs

    boundaries:
      run: pnpm check:boundaries

    skills:
      run: pnpm check:skills

    tooling-tests:
      run: pnpm test:tooling

# On-demand quality gate — run with: pnpm check (affected packages) or pnpm check:all (all).
# Mirrors the TypeScript CI workflow (ci.yml) exactly so local `pnpm check` = remote CI.
# Build, typecheck and test cover the packages affected since the merge base with origin/main
# (AFD_BASE overrides the base, AFD_SCOPE=all selects everything; see scripts/affected.mjs).
# Python, Rust and alfred are not covered here; see python.yml, rust.yml and alfred.yml.
check:
  # Sequential for same Windows terminal deadlock prevention.
  parallel: false
  commands:
    lint:
      run: pnpm lint

    build:
      run: node scripts/affected.mjs run build

    typecheck:
      run: node scripts/affected.mjs run typecheck

    test:
      run: node scripts/affected.mjs run test --no-bail -- --coverage

    portability:
      run: node scripts/check-portability.mjs

    file-size:
      run: node scripts/check-file-size.mjs

    orphan-files:
      run: node scripts/check-orphan-files.mjs

    versions:
      run: node scripts/check-versions.mjs

    boundaries:
      run: pnpm check:boundaries

    skills:
      run: pnpm check:skills

    tooling-tests:
      run: pnpm test:tooling
