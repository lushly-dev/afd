<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<!-- Alfred in one colour, for use as an icon mask: a disc with the needle cut out. -->
	<defs>
		<clipPath id="window"><circle cx="50" cy="50" r="39"/></clipPath>
		<mask id="needle">
			<rect width="100" height="100" fill="#fff"/>
			<polygon clip-path="url(#window)" points="55.95,0 80.45,0 44.05,100 19.55,100" fill="#000"/>
		</mask>
	</defs>
	<circle cx="50" cy="50" r="50" mask="url(#needle)"/>
</svg>
