[project]
name = "lushly-botcore"
version = "0.11.0"
description = "Shared bot infrastructure — config, plugin contract, and extracted commands"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Falkicon" }]
keywords = ["botcore", "cli", "mcp", "plugins", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "afd>=0.14.0",
    "pydantic>=2.5.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "vulture>=2.11",
]
cdp = [
    "playwright>=1.40.0",
    "httpx>=0.24.0",
    "perfetto>=0.16.0",
]
research = [
    "openai>=3.37.0",
]
quality = [
    "httpx>=0.24.0",
]
mcp = [
    "afd[server]>=0.14.0",
    "mcp>=2.3,<3",
]
all = [
    "lushly-botcore[cdp,research,quality,mcp]",
]

[project.scripts]
botcore = "botcore.cli:cli"

[project.entry-points."botcore.plugins"]
# Plugins register here, e.g.:
# lushbot = "lushbot_plugin:LushbotPlugin"

[project.urls]
Homepage = "https://github.com/lushly-dev/afd/tree/main/endpoints/botcore"
Repository = "https://github.com/lushly-dev/afd"
Changelog = "https://github.com/lushly-dev/afd/blob/main/endpoints/botcore/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botcore"]

# hatch_build.py stamps adaptations.json's digest into the packaged provenance.json.
[tool.hatch.build.hooks.custom]

[tool.hatch.build]
include = ["src/botcore/**/*.py", "src/botcore/py.typed", "src/botcore/skills/**/*.md", "src/botcore/skills/**/scripts/*.mjs", "src/botcore/provenance/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Skill markdown files are mirrored into .claude/skills/ via pnpm skills:sync.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP",
    "C901",
    "PLR0912", "PLR0915", "PLR0913",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 80

[tool.mypy]
python_version = "3.11"
# Basic mode by default with explicit strict overrides on host* and disk commands (#1757).
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "botcore.host",
    "botcore.host_client",
    "botcore.host_http",
    "botcore.host_inputs",
    "botcore.host_skills",
    "botcore.host_surfaces",
    "botcore.host_tokens",
    "botcore.commands.disk",
    "botcore.commands.disk.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/botcore"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# Development bootstrap only; built distributions require afd>=0.14.0.
[tool.uv.sources]
afd = { path = "../../python", editable = true }

# The sibling packages' tests (scripts/package_tests.py): botcore-llm needs the Copilot SDK,
# botcore-connectors' tests mock HTTP with respx, and botcore-teams runs on the Bot Framework
# and aiohttp, with pytest-aiohttp's client fixture.
[dependency-groups]
packages = [
    "github-copilot-sdk>=1.0.26",
    "respx>=0.22.0",
    "botbuilder-core>=4.16.0",
    "botbuilder-integration-aiohttp>=4.16.0",
    "aiohttp>=3.9.0",
    "pytest-aiohttp>=1.0.0",
]
