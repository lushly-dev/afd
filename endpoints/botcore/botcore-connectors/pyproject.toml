[project]
name = "botcore-connectors"
version = "0.1.0"
description = "Typed HTTP connectors for botcore — GitHub, Azure, Microsoft Graph"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Falkicon" }]
keywords = ["botcore", "connectors", "github", "azure", "graph"]

dependencies = [
    "lushly-botcore>=0.2.0",
    "httpx>=0.24.0",
    "afd>=0.9.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.22.0",
    "ruff>=0.4.0",
]
github = []
azure = [
    "azure-identity>=1.15.0",
    "azure-storage-blob>=12.19.0",
    "azure-servicebus>=7.11.0",
]
graph = [
    "msgraph-sdk>=1.2.0",
]

[project.entry-points."botcore.plugins"]
connectors = "botcore_connectors:ConnectorsPlugin"

[project.urls]
Homepage = "https://github.com/lushly-dev/botcore"
Repository = "https://github.com/lushly-dev/botcore"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botcore_connectors"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP",
    "C901",
    "PLR0912", "PLR0915", "PLR0913",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 80

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
