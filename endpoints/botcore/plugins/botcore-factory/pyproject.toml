[project]
name = "botcore-factory"
version = "0.1.0"
description = "The software factory's merge lane as a botcore plugin: intake, cells, dials and lane state"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Falkicon" }]
keywords = ["botcore", "factory", "merge-lane", "afd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# PluginRegistry.add_policy, catalog input schemas and named refusals land after botcore 0.7.0;
# the floor rises with the release that ships them.
dependencies = [
    "lushly-botcore>=0.7.0",
    "afd>=0.9.0",
    "pydantic>=2.5.0",
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.entry-points."botcore.plugins"]
factory = "botcore_factory:FactoryPlugin"

[project.urls]
Homepage = "https://github.com/lushly-dev/afd/tree/main/endpoints/botcore/plugins/botcore-factory"
Repository = "https://github.com/lushly-dev/afd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botcore_factory"]

# Develop against the in-repository AFD package and Botcore endpoint. uv-only: built artifacts
# keep the plain requirements above.
[tool.uv.sources]
afd = { path = "../../../../python", editable = true }
lushly-botcore = { path = "../..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM",
    "C901",
    "PLR0912", "PLR0915", "PLR0913",
]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 80

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
