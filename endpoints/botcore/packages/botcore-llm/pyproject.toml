[project]
name = "botcore-llm"
version = "0.1.0"
description = "LLM runtime plugin for botcore — Copilot SDK integration"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Falkicon" }]
keywords = ["botcore", "llm", "copilot", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "lushly-botcore",
    "github-copilot-sdk>=1.0.26",
    "afd>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.entry-points."botcore.plugins"]
llm = "botcore_llm:LlmPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botcore_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
