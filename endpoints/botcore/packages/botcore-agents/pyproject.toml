[project]
name = "botcore-agents"
version = "0.1.0"
description = "Agent orchestration plugin for botcore — single-agent lifecycle (Phase 1)"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Falkicon" }]
keywords = ["botcore", "agents", "orchestration", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "lushly-botcore>=0.2.0",
    "botcore-llm>=0.1.0",
    "afd>=0.9.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
# Wildcard connector discovery is optional; custom named namespaces remain independent.
connectors = ["botcore-connectors>=0.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
]

[project.entry-points."botcore.plugins"]
agents = "botcore_agents:AgentsPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botcore_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
