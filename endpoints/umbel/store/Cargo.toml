[package]
name = "umbel-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel store traits, version 1: shared types, the document, search and graph traits, and the conformance suite"
repository = "https://github.com/lushly-dev/afd"

[features]
# `umbel_store::conformance`: the suite every backend runs (specification section 3.1). It needs
# `tempfile` for a directory per case; the types and traits build without it.
conformance = ["dep:tempfile"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = { version = "3", optional = true }
# The identical digest of a record lane (records host specification, section 8.1): NFKC and
# Unicode default case folding. Pinned exactly, because a change of either crate's tables would
# change stored digests; a new version is a new `lane::NORMALISATION_VERSION`. Both build for
# `wasm32-wasip2`, as this crate must.
caseless = "=0.2.2"
unicode-normalization = "=0.1.26"

[dev-dependencies]
# `tests/suite_detects.rs` runs the suite against a deliberately broken fake.
umbel-store = { path = ".", features = ["conformance"] }
# `tests/memory_tokenizer.rs` reads FTS5's own tokens (`fts5vocab`) to hold the memory tokenizer
# to them (phase 5 section 9.2). Already in the lock, with the embedded backend's features.
rusqlite = { version = "0.41", features = ["bundled"] }

[lints]
workspace = true
