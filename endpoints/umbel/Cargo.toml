[package]
name = "umbel"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel: an empty host for capability plugins over MCP and CLI"
repository = "https://github.com/lushly-dev/afd"

[workspace]
members = [".", "sdk", "store", "store-embedded", "scan", "okf", "plugins/hello", "plugins/todo", "plugins/sources-filesystem", "plugins/knowledge", "plugins/memory", "plugins/context", "plugins/curator", "first-party", "adapters/hook", "testkit-idp", "tests/fixtures/components/*"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[features]
default = ["auth", "cli", "component", "mounted", "store-embedded"]
# The hosted HTTP surface (phase 5 specification, sections 3 and 6): in-process TLS with
# `tokio-rustls` (TLS 1.2 and 1.3 on the `aws-lc-rs` provider) and the client certificate per
# `client_auth`, the layers of section 6.3, the protected-resource metadata, AFD's bearer layer
# (`afd/server-auth`) and the shared limit counters in `state/shared/limits.sqlite3`. Without it the
# HTTP surface serves phase 0's loopback token only, and refuses `[http.tls]` and the hosted modes.
# Token verification (step 2b) fetches each issuer's metadata and keys, and calls the one
# introspection endpoint, with `reqwest` (HTTPS only, no redirects, capped and timed out), and
# reads a verified JWT's claims with `base64`.
# The `umbel` binary's argument parser. Embedders use default-features = false.
cli = ["dep:clap"]
# The WebAssembly component loader (specification section 6.2): wasmtime 48 and its WASI 0.2
# implementation, which is `wasmtime-wasi`'s `p2` feature and nothing else.
component = ["dep:bytes", "dep:rand", "dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-io"]
# `umbel::testkit`: `TestHost` and its MCP drivers, for plugin crates' tests and the host's own
# (specification section 10.1). The specification names `tempfile` and `rmcp`; the drivers also
# need `http` and `http-body-util` to speak to the router in process.
testkit = ["dep:tempfile", "dep:rmcp", "dep:http", "dep:http-body-util"]
# The doctor's hosted profile (step 2c) reads certificate validity with `x509-parser` and, on
# Linux and macOS, the file system type of `state/shared/` with `rustix`'s `statfs`; both were
# already in the lock.
auth = ["afd/server-auth", "dep:base64", "dep:reqwest", "dep:rusqlite", "dep:rustix", "dep:rustls-platform-verifier", "dep:rustls-pki-types", "dep:tokio-rustls", "dep:x509-parser"]
# The mounted MCP server loader (specification section 6.3): rmcp's client over a child process's
# stdio and Streamable HTTP, with rustls (rmcp's `reqwest` feature is what enables it). The child
# process is spawned here rather than by rmcp's `TokioChildProcess`, which has neither
# `kill_on_drop` nor a hook for the bounded stdio reader the result limit needs.
mounted = [
	"dep:rmcp", "dep:http", "dep:futures", "dep:umbel-scan", "dep:reqwest", "dep:sse-stream",
	"rmcp/client", "rmcp/transport-streamable-http-client-reqwest", "rmcp/reqwest",
]

# The embedded reference store (specification section 3.2): SQLite in WAL mode and tantivy. Without
# it the host links neither, and every store grant answers `PLUGIN_GRANT_UNAVAILABLE`.
# The host's write scan of memory records (phase 3 section 6.2) uses `umbel-scan` too.
store-embedded = ["dep:umbel-store-embedded", "dep:umbel-scan"]

[[bin]]
name = "umbel"
path = "src/main.rs"
required-features = ["cli"]

# A scriptable stdio MCP server for tests/plugin_mounted.rs. `cargo test` enables `testkit`
# through the dev-dependency on this crate, so the integration tests get `CARGO_BIN_EXE_*` for it
# with no build step of their own; the stock `umbel` binary and `cargo build` never build it.
[[bin]]
name = "umbel-mount-fixture"
path = "src/bin/umbel-mount-fixture.rs"
required-features = ["testkit"]

[dependencies]
afd = { path = "../../packages/rust", features = ["server", "journal-file-shared"] }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"], optional = true }
getrandom = ">=0.3, <0.5"
# Offline only (no resolve-http/tls features): configuration schemas of plugins, and the schema
# files' own checks. reqwest and rustls stay out of the lock until the mounted loader.
jsonschema = { version = "0.60", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# preserve_order keeps [spaces.*] in the file's order, which space-list reports.
toml = { version = "1", features = ["preserve_order"] }
# The exact-path MCP service behind the bearer layer (`service_fn`).
tower = { version = "0.5", features = ["util"] }
# The HTTP listener serves HTTP/1.1 on hyper itself, as `axum::serve` does, so that it puts the
# peer address (and, with the `auth` feature, the TLS client certificate) in each request's
# extensions; `http-body` for the body size limit's capped body. All three come with axum.
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1", "service"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Optional: the `component` feature, the WebAssembly component loader (specification section 6.2).
# wasmtime stays on its 48 long-term line (D39). The WASI 0.2 implementation is `wasmtime-wasi`'s
# `p2` feature and nothing else (no `p1`, no `p3`); `p2` enables `wasmtime/async`. `rand` is only
# for the `TryRng` trait the virtualized random source implements.
bytes = { version = "1", optional = true }
rand = { version = "0.10", default-features = false, optional = true }
wasmtime = { version = "48.0.8", optional = true, default-features = false, features = ["runtime", "cranelift", "component-model", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "48.0.8", optional = true, default-features = false, features = ["p2"] }
# The `wasi:io` interfaces, which `wasmtime-wasi` builds on and links through this crate.
wasmtime-wasi-io = { version = "48.0.8", optional = true, default-features = false, features = ["std"] }

# Optional: the `mounted` feature. `reqwest` is named for its client builder (a private root
# certificate, no redirects) and `sse-stream` for the SSE types the bounded HTTP client returns.
futures = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"], optional = true }
sse-stream = { version = "0.2", optional = true }

# Optional: the `auth` feature, the hosted HTTP surface. `rustls-pki-types`' `PemObject` reads the
# PEM files; SQLite holds the limit counters every process behind one URL shares (section 10.2).
# `base64` decodes a verified access token's claims for the mapping of section 4.1.
base64 = { version = "0.22", optional = true }
# The outbound client's TLS: the platform's roots, on the `aws-lc-rs` provider passed explicitly.
rustls-platform-verifier = { version = "0.7", optional = true }
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
# The doctor's `auth.shared` (step 2c): whether `state/shared/` is on a local file system (D29),
# from `statfs`, and the effective user that must own the hosted profile's files, without unsafe
# code.
rustix = { version = "1", default-features = false, features = ["fs", "process", "std"], optional = true }
rustls-pki-types = { version = "1.15", features = ["std"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"], optional = true }
# The doctor's `auth.tls` and `auth.ca_files` (step 2c): each certificate's validity, read from its
# DER without verifying it (rustls verifies, at the handshake). No feature: nothing it verifies.
x509-parser = { version = "0.18", default-features = false, optional = true }

# Optional: the `testkit` feature's drivers (the same crates are dev-dependencies below, for the
# integration tests' own use).
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
# The in-memory stdio driver serves the McpServer over a pipe; same requirement as the afd crate.
rmcp = { version = "3.9", optional = true, default-features = false, features = ["server", "transport-io"] }
tempfile = { version = "3", optional = true }
umbel-sdk = { path = "sdk" }
# The store traits and shared types, and (feature `store-embedded`) the embedded backend.
umbel-store = { path = "store" }
umbel-store-embedded = { path = "store-embedded", optional = true }
# Optional: the `mounted` feature scans tool descriptions with the patterns the OKF reader shares.
umbel-scan = { path = "scan", optional = true }

[dev-dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
# The mounted-loader tests serve a plugin over HTTPS with a certificate made on the spot.
# `auth_layers.rs` speaks HTTP/1.1 to the hosted listener, over TLS with and without a client
# certificate, through hyper's client connection.
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "server", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rmcp = { version = "3.9", default-features = false, features = ["server", "transport-io"] }
tempfile = "3"
# The body deadline's unit test runs on paused time.
tokio = { version = "1", features = ["test-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
# The integration tests drive the test kit, and the hello plugin as a second compiled plugin.
umbel = { path = ".", features = ["testkit"] }
umbel-plugin-hello = { path = "plugins/hello" }
umbel-sdk = { path = "sdk", features = ["mounted"] }
# The auth tests' certificate authority, access tokens and assertions (phase 5 step 1b). Only ever
# a dev-dependency: `tests/no_auth_server.rs` fails otherwise.
umbel-testkit-idp = { path = "testkit-idp" }
# `doctor_stores.rs` damages a store's tables, and `store_commands.rs` opens a backup.
rusqlite = { version = "0.41", features = ["bundled"] }
# The store tests build documents and chunks with the conformance suite's own samples.
umbel-store = { path = "store", features = ["conformance"] }

# Cranelift and wasmtime dominate test time when unoptimized, and the tests compile components.
# The test profile inherits these from dev. (The component loader, specification section 1.)
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.regalloc2]
opt-level = 2
[profile.dev.package.wasmparser]
opt-level = 2
[profile.dev.package.wasmtime]
opt-level = 2
[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 2
[profile.dev.package.wasmtime-environ]
opt-level = 2
# SQLite's C code is slow unoptimised, and the store tests write thousands of rows (the
# embedded store, specification section 1). The test profile inherits this from dev.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
# tantivy's indexing and query code is slow unoptimised, and the thousand-document tests run it
# (specification section 1). The test profile inherits these from dev.
[profile.dev.package.tantivy]
opt-level = 2
[profile.dev.package.tantivy-bitpacker]
opt-level = 2
[profile.dev.package.tantivy-columnar]
opt-level = 2
[profile.dev.package.tantivy-common]
opt-level = 2
[profile.dev.package.tantivy-fst]
opt-level = 2
[profile.dev.package.tantivy-query-grammar]
opt-level = 2
[profile.dev.package.tantivy-sstable]
opt-level = 2
[profile.dev.package.tantivy-stacker]
opt-level = 2
[profile.dev.package.tantivy-tokenizer-api]
opt-level = 2
[profile.dev.package.lz4_flex]
opt-level = 2
[profile.dev.package.frostem]
opt-level = 2
# tree-sitter's parser and the grammars' generated C are slow unoptimised, and the code-symbol
# tests parse hostile files against wall-time budgets (specification section 7.4). The test
# profile inherits these from dev.
[profile.dev.package.tree-sitter]
opt-level = 2
[profile.dev.package.tree-sitter-rust]
opt-level = 2
[profile.dev.package.tree-sitter-python]
opt-level = 2
[profile.dev.package.tree-sitter-typescript]
opt-level = 2

[lints]
workspace = true
