[package]
name = "umbel-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel plugin SDK: the portable plugin API, one source for every plugin kind"
repository = "https://github.com/lushly-dev/afd"

# The features of later steps (`component`, `mounted`) are not declared before they exist.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The wire-format tests compare `Outcome` with `afd::CommandResult` round trips.
afd = { path = "../../../packages/rust", default-features = false }

[lints]
workspace = true
