[package]
name = "umbel-fixture-budget"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "Test component built with umbel-sdk: answers its call's output budget, which WIT world 1.1.0 carries"
repository = "https://github.com/lushly-dev/afd"

[lib]
crate-type = ["cdylib"]

[features]
# Built as a component with `--features umbel-fixture-budget/component`, as hello is: enabling the
# SDK's `component` feature for every workspace build would unify it into the host's.
component = ["umbel-sdk/component"]

[dependencies]
serde_json = "1"
umbel-sdk = { path = "../../../../sdk" }

# The workspace lints, with one scoped exception: `export_component!` expands wit-bindgen's glue,
# which uses `unsafe`, so `unsafe_code` is `deny` here, not `forbid`, and the glue is wrapped in
# `#[allow(unsafe_code)]`. Hand-written `unsafe` stays refused.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
