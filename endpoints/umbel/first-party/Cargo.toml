[package]
name = "umbel-first-party"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel first-party binary: the umbel command line with the sources, knowledge, memory, context, components, curator and ideas plugins compiled in"
repository = "https://github.com/lushly-dev/afd"

# The only crate that depends on the memory and context plugins together (D80), and the curator
# beside the knowledge plugin (D3): each plugin reads the others' stores only through the host's
# grants (D78), and this binary links them all (phase 4 step 7).
[[bin]]
name = "umbel-first-party"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
# The command line, the embedded stores and the hosted HTTP surface (`auth`, phase 5), and no
# loader (so no wasmtime), as `umbel-knowledge` and `umbel-memory` do.
umbel = { path = "..", default-features = false, features = ["auth", "cli", "store-embedded"] }
umbel-plugin-components = { path = "../plugins/components" }
umbel-plugin-context = { path = "../plugins/context" }
umbel-plugin-curator = { path = "../plugins/curator" }
umbel-plugin-ideas = { path = "../plugins/ideas" }
umbel-plugin-knowledge = { path = "../plugins/knowledge" }
umbel-plugin-memory = { path = "../plugins/memory" }
umbel-plugin-sources-filesystem = { path = "../plugins/sources-filesystem" }

[dev-dependencies]
# The leak and poisoning probes call the commands as library actors (section 12).
afd = { path = "../../../packages/rust", default-features = false }
# `context-bundle` is validated against `context-bundle.v1.json`.
jsonschema = { version = "0.60", default-features = false }
# `forget_bytes.rs` holds a reader open across a forget and reads the key file's markers.
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
tempfile = "3"
# `cargo test` builds the binary with `testkit`, so the exit test has the frozen clock
# (`UMBEL_TEST_CLOCK`) and the person at a terminal (`UMBEL_TEST_HUMAN_PRESENT`) of section 12;
# a normal build has neither.
umbel = { path = "..", default-features = false, features = ["cli", "store-embedded", "testkit"] }
# `umbel_hook::run` drives this binary as the `umbel-hook` binary does (section 12).
umbel-hook = { path = "../adapters/hook" }
# `curator_drafts.rs` (phase 4 step 4) drafts with the curator's own code and submits the drafts
# to the knowledge plugin; the curator itself is a dependency of the binary above.
umbel-okf = { path = "../okf" }
umbel-sdk = { path = "../sdk" }
# The digest across write orders (section 9.6): two stores written through the store API with
# fixed ids and a fixed clock.
umbel-store = { path = "../store", features = ["conformance"] }
umbel-store-embedded = { path = "../store-embedded" }

[lints]
workspace = true
