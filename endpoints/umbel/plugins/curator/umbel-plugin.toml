manifest_version = 4
protocol = 1

[plugin]
id = "curator"
title = "Curator"
version = "0.1.0"
description = "Finds the memory records that have settled into candidates for the knowledge base: semantic and procedural records that stood unchanged for the settling window, in enough sessions, with an authority the space admits, read under the caller's reader filter. It drafts them through the shared fixed rendering, never writes memory or knowledge, and lets a person widen their own records at a terminal."
kind = "compiled"
domains = ["curator"]

[[grants]]
name = "config"
reason = "Reads each space's target (the collection, and an optional prefix, drafted documents go to) and refuses a configured model."

[[grants]]
name = "packs"
reason = "Reads the settle pack a space may override: the settling windows, sessions, authorities and the per-call bounds."

[[grants]]
name = "clock"
reason = "Measures how long a record has stood unchanged, its validity and its expiry against the command context's clock."

[[grants]]
name = "memory"
reason = "Lists and reads, never writes, the memory records the caller can read, under the caller's reader filter only: never a derivation read, never another person's records the caller cannot read."

[[grants]]
name = "documents"
reason = "Reads, under the caller's reader filter, whether a candidate's target document already exists, the target collection's kind, readers and sensitivity (collection metadata only, for the access rule; no file is listed or read), and, for re-verification, the documents' stale_after, status, successor, flags and cited hashes."

[[grants]]
name = "records"
reason = "Reads the caller's own curator records: candidates, promotions, reviews, runs and the run state, kept per space and principal."

[[grants]]
name = "records_write"
reason = "Writes the caller's own curator records: a promotion's consent, candidates, reviews, run reports and the run state with its lock. They hold record ids, versions and content hashes, never memory text; when memory is forgotten their earlier hashes are forgotten too."

[[commands]]
name = "curator-candidates"
description = "List your curator candidates in a space by status (settling, ready, needs-promotion, skipped, and after runs drafted, rejected, applied, erased), with counts, authority, access and where each would be drafted. Only what you can read is counted; no memory text is shown, and the content hash only for candidates whose records are all your own."
effects = ["inspect"]
input_schema = "schemas/curator-candidates.input.json"
category = "curator"
tags = ["curator", "memory", "knowledge"]
version = "1.0.0"
expose = { mcp = false, agent = false, cli = true }
journal = { mode = "digest", keep = ["space"] }

[[commands]]
name = "curator-promote"
description = "As a person at a terminal, consent to have one of your candidates drafted for the target collection's readers, which are wider than the readers of your records. Only your own records, and only with the contentHash curator-candidates or memory-show printed for them. Sensitivity is never overridden."
effects = ["store-write"]
input_schema = "schemas/curator-promote.input.json"
category = "curator"
tags = ["curator", "memory", "write"]
version = "1.0.0"
confirm = "require-human"
confirm_prompt = "You are consenting to propose your own memory records for wider readers: once the next curator run drafts them, their text becomes readable by everyone who can read the target collection, before anyone approves it. Read the records with memory-show first."
expose = { mcp = false, agent = false, cli = true }
journal = { mode = "digest", keep = ["space"] }

[[commands]]
name = "curator-status"
description = "Your last curator run's report (ids and counts, never memory text), whether your runs are overdue (none, or the last older than twice every_hours), whether your lock is held, the candidates you may promote, and the memory records of yours a person applied as knowledge, which you may close with memory-invalidate (reason outdated)."
effects = ["inspect"]
input_schema = "schemas/curator-status.input.json"
category = "curator"
tags = ["curator", "memory", "knowledge"]
version = "1.0.0"
expose = { mcp = false, agent = false, cli = true }
journal = { mode = "digest", keep = ["space"] }

[[commands]]
name = "curator-plan"
description = "The first step of curator-run, refused anywhere else: takes your lock, erases what your curator records keep of forgotten memory, re-checks every draft of yours that may be open, and plans the batch of drafts and withdrawals under your reader filter. Its output holds memory text and is digest-journaled."
effects = ["store-write"]
input_schema = "schemas/curator-plan.input.json"
category = "curator"
tags = ["curator", "memory", "knowledge"]
version = "1.0.0"
expose = { mcp = false, agent = false, cli = true }
journal = { mode = "digest", keep = ["space"] }

[[commands]]
name = "curator-finish"
description = "The last step of curator-run, refused anywhere else: records what the knowledge plugin did with each draft and withdrawal and the decisions on your drafts, writes and returns the run's report (ids and counts only), and releases your lock if it is still this run's."
effects = ["store-write"]
input_schema = "schemas/curator-finish.input.json"
category = "curator"
tags = ["curator", "memory", "knowledge"]
version = "1.0.0"
expose = { mcp = false, agent = false, cli = true }
journal = { mode = "digest", keep = ["space"] }

# The curator's run (phase 4 section 3.1): its own commands around the knowledge plugin's batch
# and feed, which the host attests to this instance step by step. Command line only, so it is
# never listed, discovered or callable over MCP or by an in-process agent; the host refuses to
# seal it wider than its narrowest step. It returns only finish's report, ids and counts, and
# every step is digest-journaled.
[[pipelines]]
name = "curator-run"
description = "Run the curator for your memory in a space: plan under your reader filter, submit drafts and withdrawals to the knowledge plugin, read the decisions on your drafts, and finish with a report of ids and counts. Schedule it from cron, CI or a session hook; a person still approves every proposal."
effects = ["store-write"]
input_schema = { type = "object", properties = { space = { type = "string", description = "The space; default: the workspace's default space" } }, additionalProperties = false }
expose = { mcp = false, agent = false, cli = true }
result = "last"
journal = { mode = "digest" }
steps = [
  { command = "curator-plan", input = { space = "$input.space" }, as = "plan" },
  { command = "knowledge-propose-batch", input = { space = "$input.space", proposals = "$steps.plan.submit", withdraw = "$steps.plan.withdraw", erased = "$steps.plan.erased" }, as = "submit" },
  { command = "knowledge-proposal-feed", input = { space = "$input.space", after = "$steps.plan.feedAfter" }, as = "feed" },
  { command = "curator-finish", input = { space = "$input.space", run = "$steps.plan.run", plan = "$steps.plan.plan", results = "$steps.submit.results", withdrawals = "$steps.submit.withdrawals", erased = "$steps.submit.erased", checkpoint = "$steps.submit.checkpoint", feed = "$steps.feed" }, as = "finish" },
]

[[packs]]
id = "settle"
path = "packs/settle"

[[skills]]
name = "curator-guide"
path = "skills/curator-guide"

[config]
schema = "schemas/config.schema.json"
