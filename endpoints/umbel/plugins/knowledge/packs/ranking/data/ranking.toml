# Ranking parameters of the knowledge plugin (specification sections 8.1 and 8.2). A space may
# override this whole file under spaces/<space>/packs/knowledge/ranking/data/ranking.toml.

[aggregation]
# A document's score is its best chunk's score plus this weight times the sum of its next best
# chunks (as many as secondary_count).
secondary_weight = 0.1
secondary_count = 2

[status]
# A draft document's score is multiplied by this.
draft_factor = 0.8

[fusion]
# A multi-space search fuses the per-space rankings by reciprocal rank: 1 / (rrf_k + rank).
rrf_k = 60

[index]
# Frontmatter keys the index makes searchable as meta.<key> (scalars only).
filterable = []

[expansion]
# Graph expansion of a search: for each of the top documents, its readable neighbours receive
# expansion_weight x the document's score x the edge factor below. A neighbour already in the
# results adds it; one that is not enters with it and is marked matched: false.
expansion_weight = 0.3
# Edge factors: links_to (either direction), co_cited and supersedes (to the deprecated document).
links = 1.0
co_cited = 0.5
supersedes = 0.8
# A co_cited pair expands only when the citers the reader can read sum to at least this weight.
co_cited_min_weight = 2
# The most neighbours one document expands to, by weight and then id.
max_per_document = 20
