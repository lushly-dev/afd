[package]
name = "umbel-plugin-knowledge"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel knowledge plugin: structure-aware chunking, lexical search, open and find over the document store, and the umbel-knowledge binary"
repository = "https://github.com/lushly-dev/afd"

[features]
default = ["code"]
# Code symbols (specification section 7.4): tree-sitter and the grammars of Rust, Python and
# TypeScript (JavaScript and JSX are parsed by the TSX grammar). Without it code collections are
# indexed as plain text.
code = [
	"dep:streaming-iterator", "dep:tree-sitter", "dep:tree-sitter-python", "dep:tree-sitter-rust",
	"dep:tree-sitter-typescript",
]

[[bin]]
name = "umbel-knowledge"
path = "src/bin/umbel-knowledge.rs"

[dependencies]
# RFC 3339 dates for the index's date fields; the same crate the host reads timestamps with.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# `knowledge-find`'s patterns: linear time, no backreferences, a compiled-size limit.
regex = "1"
# The unified diff a proposal shows its approver.
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Iterating a query cursor's matches (tree-sitter 0.27 lends them).
streaming-iterator = { version = "0.1", optional = true }
tree-sitter = { version = "0.27", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
# The eval fixture's digest and the report's corpus and ranking digests.
sha2 = "0.11"
# The ranking pack is a TOML file.
toml = "1"
# The binary is the `umbel` command line with the knowledge plugins compiled in: the command line
# and the embedded stores, and no loader (so no wasmtime), as `umbel-todo` does.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
umbel = { path = "../..", default-features = false, features = ["cli", "store-embedded"] }
umbel-okf = { path = "../../okf" }
umbel-plugin-sources-filesystem = { path = "../sources-filesystem" }
umbel-scan = { path = "../../scan" }
umbel-sdk = { path = "../../sdk" }
umbel-store = { path = "../../store" }

[build-dependencies]
umbel-sdk = { path = "../../sdk" }

[dev-dependencies]
# `server-auth` for the hosted test kit `tests/relay.rs` shares with the host's tests
# (`tests/support/hosted.rs`, included by path): its token verifier types.
afd = { path = "../../../../packages/rust", default-features = false, features = ["server-auth"] }
# `tests/relay.rs` (phase 5 step 6): knowledge-approve and knowledge-reject over MCP through the
# person page, end to end over real sockets with the kit's identity provider, as the host's
# `person_page.rs` drives the page. Every crate below was already in the workspace's lock.
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
umbel-testkit-idp = { path = "../../testkit-idp" }
url = "2"
# The query set and the report are validated against their schemas.
jsonschema = { version = "0.60", default-features = false }
# `en_stem`, the index's tokenizer, to check the fixture's vocabulary under it (the stemmer
# feature is the one the embedded backend enables).
tantivy = { version = "0.27", default-features = false, features = ["stemmer"] }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The tests boot a host with collections, readers and allow lists, and seed the graph the way
# step 7a's indexer will. `auth` serves the hosted workspace `tests/relay.rs` approves in.
umbel = { path = "../..", default-features = false, features = ["auth", "store-embedded", "testkit"] }
# `conformance` for the store suite's memory samples: the verification tests write memory records
# through the store, as phase 3's tests do (no crate is added; `tempfile` is already here).
umbel-store = { path = "../../store", features = ["conformance"] }
# `testkit` for `SqliteStore::hold_reader`: a reader holding the write-ahead log, so the redaction
# tests see the checkpoint's `pending` answer without linking SQLite here.
umbel-store-embedded = { path = "../../store-embedded", features = ["testkit"] }

[lints]
workspace = true
