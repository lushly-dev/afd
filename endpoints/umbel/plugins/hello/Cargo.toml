[package]
name = "umbel-plugin-hello"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel hello plugin: one command, one pack and one skill, the reference plugin"
repository = "https://github.com/lushly-dev/afd"

[lib]
# A component is a cdylib; everything else links the rlib.
crate-type = ["cdylib", "rlib"]

[features]
# hello as a WebAssembly component: `cargo build --locked --release --target wasm32-wasip2
# -p umbel-plugin-hello --features component` (specification section 10.5).
component = ["umbel-sdk/component"]
# The `hello-mcp` binary: hello served as a stdio MCP server (specification section 10.5).
mounted = ["umbel-sdk/mounted", "dep:tokio"]

[[bin]]
name = "hello-mcp"
path = "src/bin/hello-mcp.rs"
required-features = ["mounted"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
umbel-sdk = { path = "../../sdk" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"], optional = true }

[build-dependencies]
umbel-sdk = { path = "../../sdk" }

[dev-dependencies]
afd = { path = "../../../../packages/rust", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1"
umbel = { path = "../..", default-features = false, features = ["testkit"] }

# The workspace lints, with one scoped exception (specification section 1): under `component`
# `export_component!` expands wit-bindgen's glue in this crate, and it uses `unsafe`, so
# `unsafe_code` is `deny`, not `forbid`; the glue is wrapped in `#[allow(unsafe_code)]`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
