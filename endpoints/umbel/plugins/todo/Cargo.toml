[package]
name = "umbel-plugin-todo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel todo plugin: the todo example as a compiled plugin, the conformance fixture"
repository = "https://github.com/lushly-dev/afd"

[dependencies]
afd = { path = "../../../../packages/rust", default-features = false }
# The todo example's library (specification section 10.5): the thirteen commands and the store,
# without the backend's axum server.
todo-backend-rust = { path = "../../../../packages/examples/todo/backends/rust", default-features = false }
umbel-sdk = { path = "../../sdk" }
serde_json = "1"

[build-dependencies]
umbel-sdk = { path = "../../sdk" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "1"
umbel = { path = "../..", default-features = false, features = ["cli", "testkit"] }

[lints]
workspace = true
