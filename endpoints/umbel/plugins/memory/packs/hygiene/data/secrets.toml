# The secret patterns of the memory plugin (phase 3 specification, section 8.2). Each match
# becomes `[REDACTED:<kind>]`, in this order, and the counts go to the record's `redactions`.
# A space overrides this file whole; an override that does not compile fails every write with
# MEMORY_PACK_INVALID rather than storing unmasked text. Patterns use the `regex` crate's
# syntax: linear time, no look-around, no backreferences. This is a net, not a guarantee, and
# over-masking is accepted.

# A PEM private key block.
[[pattern]]
kind = "private-key"
regex = '(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----'

# An unterminated private key header, through the end of the field: a split can separate the
# header from its end line.
[[pattern]]
kind = "private-key"
regex = '(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*\z'

[[pattern]]
kind = "aws-access-key"
regex = '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|ANPA|ANVA|AIPA)[0-9A-Z]{16}\b'

[[pattern]]
kind = "github-token"
regex = '\b(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{22,255})\b'

[[pattern]]
kind = "slack-token"
regex = '\bxox[abposr]-[A-Za-z0-9-]{10,}'

[[pattern]]
kind = "bearer-token"
regex = '(?i)\bbearer\s+[A-Za-z0-9._~+/=-]{16,}'

[[pattern]]
kind = "jwt"
regex = '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}'

[[pattern]]
kind = "api-key-prefix"
regex = '\b(?:sk|rk)-[A-Za-z0-9][A-Za-z0-9_-]{19,}'

# `password`, `passwd`, `secret`, `token` or `api_key`, then `:` or `=` and at least eight
# characters that are not spaces.
[[pattern]]
kind = "credential-assignment"
regex = '(?i)(?:password|passwd|secret|token|api[_-]?key)[\x22\x27]?\s*[:=]\s*\S{8,}'
