[package]
name = "umbel-plugin-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel memory plugin: remember, capture and show memory records through the host's memory grants, with secret masking, the injection scan and expiry, and the umbel-memory binary"
repository = "https://github.com/lushly-dev/afd"

[[bin]]
name = "umbel-memory"
path = "src/bin/umbel-memory.rs"

[dependencies]
# RFC 3339 instants with an offset (a capture's `startedAt`); the same crate the host reads them with.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The hygiene pack's secret patterns: linear time, a compiled-size limit (section 8.2).
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A capture's id, derived from its first record's id so a replay returns the same one.
sha2 = "0.10"
# The policy and hygiene packs are TOML files.
toml = "1"
# The binary is the `umbel` command line with the memory plugin compiled in: the command line and
# the embedded stores, and no loader (so no wasmtime), as `umbel-knowledge` does.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
umbel = { path = "../..", default-features = false, features = ["cli", "store-embedded"] }
# The injection and hidden-text scan the host also runs over every memory write (section 6.2).
umbel-scan = { path = "../../scan" }
umbel-sdk = { path = "../../sdk" }
umbel-store = { path = "../../store" }

[build-dependencies]
umbel-sdk = { path = "../../sdk" }

[dev-dependencies]
afd = { path = "../../../../packages/rust", default-features = false }
# `memory-show`'s record is validated against `memory-record.v1.json`.
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The tests boot a host with the plugin and its grants, with no loader (so no wasmtime).
umbel = { path = "../..", default-features = false, features = ["cli", "store-embedded", "testkit"] }

[lints]
workspace = true
