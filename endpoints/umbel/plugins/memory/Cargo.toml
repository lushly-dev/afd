[package]
name = "umbel-plugin-memory"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel memory plugin: remember, capture and show memory records through the host's memory grants, with secret masking, the injection scan and expiry, and the umbel-memory binary"
repository = "https://github.com/lushly-dev/afd"

[[bin]]
name = "umbel-memory"
path = "src/bin/umbel-memory.rs"

[dependencies]
# RFC 3339 instants with an offset (a capture's `startedAt`); the same crate the host reads them with.
chrono = { version = "0.4", default-features = false, features = ["std"] }
# The hygiene pack's secret patterns: linear time, a compiled-size limit (section 8.2).
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A capture's id, derived from its first record's id so a replay returns the same one.
sha2 = "0.11"
# The policy and hygiene packs are TOML files.
toml = "1"
# The binary is the `umbel` command line with the memory plugin compiled in: the command line and
# the embedded stores, and no loader (so no wasmtime), as `umbel-knowledge` does.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
umbel = { path = "../..", default-features = false, features = ["cli", "store-embedded"] }
# The injection and hidden-text scan the host also runs over every memory write (section 6.2).
umbel-scan = { path = "../../scan" }
umbel-sdk = { path = "../../sdk" }
umbel-store = { path = "../../store" }

[build-dependencies]
umbel-sdk = { path = "../../sdk" }

[dev-dependencies]
# `server-auth` for the hosted kit `tests/hosted_kit/` shares with the host's tests
# (`tests/support/hosted.rs`, included by path): its token verifier types.
afd = { path = "../../../../packages/rust", default-features = false, features = ["server-auth"] }
# `tests/erase.rs`, `editors.rs` and `confirm_preview.rs` (phase 5 step 10): memory-confirm and
# memory-erase over MCP through the person page, end to end over real sockets with the kit's
# identity provider, as the knowledge plugin's `relay.rs` does. Every crate below was already in
# the workspace's lock.
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
umbel-testkit-idp = { path = "../../testkit-idp" }
url = "2"
# `memory-show`'s record is validated against `memory-record.v1.json`.
jsonschema = { version = "0.60", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The tests boot a host with the plugin and its grants, with no loader (so no wasmtime). `auth`
# serves the hosted workspaces the step 10 tests confirm and erase in.
umbel = { path = "../..", default-features = false, features = ["auth", "cli", "store-embedded", "testkit"] }
# The erase tests open the memory store's files to see that the keys are gone.
umbel-store-embedded = { path = "../../store-embedded" }

[lints]
workspace = true
