[package]
name = "umbel-plugin-ideas"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel ideas plugin: a person's ideas, each a few sentences, typed, kept for good as standing records, matched against what is held, and affirmed only by the person"
repository = "https://github.com/lushly-dev/afd"

# No dependency on another plugin crate, of any kind (D3): `tests/no_plugin_dependency.rs` holds
# that. The source uses no filesystem, clock, thread or network: the clock and ids come from the
# host's grants (specification, section 2).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ids derived from an idempotency key, the key's digest and a review part's digest (4.5, 8.3).
sha2 = "0.11"
# The vocabulary pack's data files are TOML (section 5).
toml = "1"
umbel-sdk = { path = "../../sdk" }
# The scan of a proposal's reason and reworded statement (section 4.3), as the host scans a
# wording.
umbel-scan = { path = "../../scan" }
# The lane's types, `normalise`'s match digest and the canonical JSON the digests are taken over.
umbel-store = { path = "../../store" }

[build-dependencies]
umbel-sdk = { path = "../../sdk" }

[dev-dependencies]
# `server-auth` for the host's hosted test support that `tests/hosted.rs` includes by path
# (`tests/support/hosted.rs`): its token verifier types.
afd = { path = "../../../../packages/rust", default-features = false, features = ["server-auth"] }
# `tests/hosted.rs`: an instance in mode `oauth` over real sockets, with the kit as its
# authorization server and identity provider, as the memory plugin's hosted tests do (the plan's
# measures 11, 13 and 14, #2007). Every crate below was already in the workspace's lock.
async-trait = "0.1"
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "http1"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
umbel-testkit-idp = { path = "../../testkit-idp" }
url = "2"
tempfile = "3"
# `net` and `io-util` for `tests/review_page.rs`, which speaks HTTP to the local person page;
# `sync` and `time` for the hosted test support.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
# The tests boot a host with the plugin and its grants, with no loader (so no wasmtime), and run
# the command line in process for the person-gated import. `auth` serves the local person page
# `tests/review_page.rs` confirms on (the review host specification, step H3).
umbel = { path = "../..", default-features = false, features = ["auth", "cli", "store-embedded", "testkit"] }
# `tests/scenarios.rs` reads the scenario files as written (14.3): a pure Rust YAML 1.2 reader,
# without its legacy text encodings.
yaml-rust2 = { version = "0.13", default-features = false }

[lints]
workspace = true
