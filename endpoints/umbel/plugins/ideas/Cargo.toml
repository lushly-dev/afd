[package]
name = "umbel-plugin-ideas"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel ideas plugin: a person's ideas, each a few sentences, typed, kept for good as standing records, matched against what is held, and affirmed only by the person"
repository = "https://github.com/lushly-dev/afd"

# No dependency on another plugin crate, of any kind (D3): `tests/no_plugin_dependency.rs` holds
# that. The source uses no filesystem, clock, thread or network: the clock and ids come from the
# host's grants (specification, section 2).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ids derived from an idempotency key, the key's digest and a review part's digest (4.5, 8.3).
sha2 = "0.11"
# The vocabulary pack's data files are TOML (section 5).
toml = "1"
umbel-sdk = { path = "../../sdk" }
# The lane's types, `normalise`'s match digest and the canonical JSON the digests are taken over.
umbel-store = { path = "../../store" }

[build-dependencies]
umbel-sdk = { path = "../../sdk" }

[dev-dependencies]
afd = { path = "../../../../packages/rust", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The tests boot a host with the plugin and its grants, with no loader (so no wasmtime), and run
# the command line in process for the person-gated import.
umbel = { path = "../..", default-features = false, features = ["cli", "store-embedded", "testkit"] }
# `tests/scenarios.rs` reads the scenario files as written (14.3): a pure Rust YAML 1.2 reader,
# without its legacy text encodings.
yaml-rust2 = { version = "0.13", default-features = false }

[lints]
workspace = true
