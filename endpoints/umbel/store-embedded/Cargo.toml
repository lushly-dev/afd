[package]
name = "umbel-store-embedded"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false
license = "MIT"
description = "AFD Umbel embedded reference store backend: SQLite (WAL) documents, records, changes and graph, and the tantivy search index"
repository = "https://github.com/lushly-dev/afd"

[dependencies]
umbel-store = { path = "../store" }
# Bundled SQLite: no system library is needed (specification section 1). The backend is the only
# crate that links it.
rusqlite = { version = "0.41", features = ["bundled"] }
# The lexical lane (specification section 1): the features are fixed. `stemmer` is `en_stem`;
# `lz4-compression` is the doc store's compressor, which an index written with it cannot be opened
# without; `mmap` is the directory; `stopwords` is part of the specification's set.
tantivy = { version = "0.27", default-features = false, features = ["mmap", "stopwords", "stemmer", "lz4-compression"] }
# Query syntax: the AST the backend walks to build the query itself (section 8.1).
tantivy-query-grammar = "0.27"
# RFC 3339 for the date fields: ranges in the query, and the document builder. tantivy's own
# dependency, named so its features are ours.
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
# In-memory traversal of the readable graph (section 3.2).
petgraph = { version = "0.8", default-features = false, features = ["stable_graph"] }
serde = "1"
serde_json = "1"
# Per-record keys for memory (phase 3 section 5.4, D82): XChaCha20-Poly1305, with keys, nonces and
# the store id from the operating system through `getrandom`; the cipher zeroizes its key copy.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "getrandom", "zeroize"] }

# The Time Machine exclusion of memory's files (section 5.4, D87): `setxattr` and its kin, in one
# macOS-only module.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.191"

[features]
# `UMBEL_TEST_CRASH_AT` and `UMBEL_TEST_FAIL_AT` (section 7.4): a process aborts, or a step answers
# an I/O error, at a named point of provisioning, writing, forgetting, purging, backing up or the
# rebuild. `cargo test` enables it through the dev-dependency on this crate; a build without it
# has no such points.
testkit = []

[dev-dependencies]
# The conformance suite, and a directory per test.
umbel-store = { path = "../store", features = ["conformance"] }
tempfile = "3"
# The crash tests drive the `testkit` points.
umbel-store-embedded = { path = ".", features = ["testkit"] }
# `memory_erasure_bytes.rs` and `memory_backup.rs` read sealed blobs and destroyed keys back.
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }

# The workspace lints, with one scoped exception (phase 3 section 5.4, D87): the macOS exclusion
# calls `setxattr`, `getxattr` and `removexattr` through `libc`, which is `unsafe`, so
# `unsafe_code` is `deny`, not `forbid`, and only `memory/exclusion.rs` allows it. Hand-written
# `unsafe` anywhere else stays refused.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
