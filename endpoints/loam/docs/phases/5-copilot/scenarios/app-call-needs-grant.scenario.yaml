# JTBD scenario for Loam's phase 5 specification, milestone B (P5-B4). Needs Loam's runner (tag
# loam-runner) on the seed p5-base, whose overlay (p5-base.overlay.json) gives checklist a calls
# grant for tally-get and sets expose.apps on tally's tally-get; hello holds no calls grant. The
# step directives are phase 4's. The data is invented.
name: Keep apps out of each other unless allowed
description: >-
  When an app tries to call another app's command it was not granted, I want the call refused
  and recorded, so that installing an app never widens another.
job: app-call-needs-grant
tags: [loam-runner]
steps:
  - description: "[caller: hello] hello calls tally's command without a grant"
    command: tally-add
    input: {}
    expect:
      success: false
      error:
        code: CALL_NOT_GRANTED
        suggestion: { contains: calls }
  - description: The count is unchanged
    command: tally-get
    input: {}
    expect:
      success: true
      data: { total: 3 }
  - description: The refusal is recorded, naming who called
    command: event-list
    input: { kinds: [call-refused], limit: 1 }
    expect:
      success: true
      data:
        events:
          '0': { kind: call-refused, actor: { contains: hello } }
          '1': { notExists: true }
  - description: "[caller: checklist] checklist, granted it, reads the count"
    command: tally-get
    input: {}
    expect:
      success: true
      data: { total: 3 }
