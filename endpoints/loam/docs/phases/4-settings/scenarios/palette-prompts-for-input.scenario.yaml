# Draft JTBD scenario for Loam's phase 4 specification. The commands and shapes are the
# specification's drafts; the data is invented. A step's description may open with
# directives Loam's runner reads (the specification's "Jobs and scenarios"): [scope: <project>],
# [caller: <instance>] (through that app's port; add "inactive" for a background app) and
# [agent] (the agent interface, as shell-agent). With none, the step is the person at the
# palette, a human gesture (R7).
name: Run a command that needs input from the palette
description: >-
  When a command needs input, I want the palette to ask me for it, so that I can run any command
  without opening its app.
job: palette-prompts-for-input
steps:
  - description: A command that needs input is listed, with its app
    command: palette-search
    input: { query: add item }
    expect:
      success: true
      data:
        items:
          - { name: checklist-item-add, app: Checklist }
  - description: Choosing it opens a prompt for its input
    command: palette-run
    input: { command: checklist-item-add }
    expect:
      success: true
      data: { prompt: { kind: prompt, owner: shell } }
  - description: Input the schema refuses keeps the prompt open, with the reason
    command: palette-run
    input: { command: checklist-item-add, input: { document: doc_checklist0000001 } }
    expect:
      success: false
      error: { code: VALIDATION_ERROR }
  - description: Run with the input the prompt collected
    command: palette-run
    input: { command: checklist-item-add, input: { document: doc_checklist0000001, text: Water the beds } }
    expect:
      success: true
