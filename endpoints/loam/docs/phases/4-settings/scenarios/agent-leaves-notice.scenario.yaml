# Draft JTBD scenario for Loam's phase 4 specification. Needs Loam's runner (tag loam-runner):
# it runs on the seed p4-base and reads the step directives in descriptions, which AFD's
# `afd scenario run --server` ignores (the specification's "Jobs and scenarios"). The data is
# invented. Lists are asserted by index ('0'), and a single item by `'1': { notExists: true }`,
# since AFD compares a YAML list whole.
name: Leave my person a notice
description: >-
  When I am an agent and finish something my person should look at, I want to leave them a
  notice that says it came from me and links to the thing, so that they find it when they're
  back.
job: agent-leaves-notice
tags: [loam-runner]
steps:
  - description: "[agent] A notice may not carry an action from an agent"
    command: notification-push
    input:
      title: Reset the tally?
      action: { command: tally-reset, label: Reset }
    expect:
      success: false
      error:
        code: NOTIFICATION_ACTION_UNAVAILABLE
        suggestion: { contains: link }
  - description: "[agent] A notice with a link"
    command: notification-push
    input:
      title: I filed the guest book summary
      link: { uri: 'loam://app/hello/guests' }
    expect:
      success: true
      data:
        notification: { source: 'agent:shell-agent' }
  - description: My person sees who left it
    command: notification-list
    input: { unread: true, limit: 1 }
    expect:
      success: true
      data:
        notifications:
          '0': { source: 'agent:shell-agent', title: I filed the guest book summary }
          '1': { notExists: true }
