# Draft JTBD scenario for Loam's phase 4 specification. The close prompt's Save, Discard and
# Cancel are a person's gestures in the chrome, which opens the prompt on phase 2's
# EDITOR_TAB_DIRTY; this file shows the command half. P4-E8 shows the three buttons, and that
# an agent's `discard` answer to the prompt is refused.
name: Close an unsaved tab
description: >-
  When I close a tab with unsaved work, I want to save, discard or keep editing, so that I never
  lose work by one keystroke.
job: close-unsaved-tab
steps:
  - description: Closing a dirty tab is refused, naming the ways forward
    command: editor-close
    input: { tab: tab_notes000000001 }
    expect:
      success: false
      error:
        code: EDITOR_TAB_DIRTY
        suggestion: { contains: save }
  - description: The tab is still open and still dirty
    command: editor-get
    input: {}
    expect:
      success: true
