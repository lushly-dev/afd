# Draft JTBD scenario for Loam's phase 4 specification. Hello pushes a notification whose
# action is its own palette command `hello-greet`.
name: Act from the inbox
description: >-
  When an app tells me something I need to act on, I want the notice to wait in my inbox with
  the action, so that I act when I'm ready.
job: inbox-action
steps:
  - description: Hello leaves a notice with an action
    command: notification-push
    input:
      title: A new visitor signed the guest book
      action: { command: hello-greet, label: Greet them, input: { name: Ada } }
    expect:
      success: true
  - description: It waits, unread
    command: notification-list
    input: { unread: true }
    expect:
      success: true
      data: { unread: 1 }
  - description: I run the action, as myself
    command: notification-act
    input: { notification: "${{ steps[0].data.notification.id }}" }
    expect:
      success: true
  - description: An action that is a person's own command is refused at push
    command: notification-push
    input:
      title: Change your persona
      action: { command: persona-set, label: Switch, input: { persona: per_0000000000000000 } }
    expect:
      success: false
      error:
        code: OVERLAY_ITEM_RESERVED
        suggestion: { contains: palette }
