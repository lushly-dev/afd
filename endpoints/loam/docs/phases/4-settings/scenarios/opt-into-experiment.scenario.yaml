# Draft JTBD scenario for Loam's phase 4 specification. Hello declares `inspector-v2`,
# stage `visible`, gating its inspector.
name: Try an experiment
description: >-
  When an app offers something new, I want to turn it on for myself and see what may change and
  when it ends, so that I opt in knowingly.
job: opt-into-experiment
tags: [slice]
steps:
  - description: Listed with what may change and when it ends, off
    command: experiment-list
    input: {}
    expect:
      success: true
      data:
        experiments:
          - { fullId: hello.inspector-v2, on: false, ends: '2027-03-01' }
  - description: Turned on for me
    command: experiment-enable
    input: { experiment: hello.inspector-v2, audience: person }
    expect:
      success: true
      data: { on: true, by: person }
  - description: Hello's code sees it on
    command: experiment-check
    input: { experiment: hello.inspector-v2 }
    expect:
      success: true
      data: { on: true }
  - description: An unknown experiment answers as off, the same as a hidden one
    command: experiment-check
    input: { experiment: hello.not-a-thing }
    expect:
      success: true
      data: { on: false, by: null }
  - description: Turned off again
    command: experiment-disable
    input: { experiment: hello.inspector-v2, audience: person }
    expect:
      success: true
      data: { on: false }
