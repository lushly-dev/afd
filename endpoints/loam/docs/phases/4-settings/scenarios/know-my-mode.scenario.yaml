# Draft JTBD scenario for Loam's phase 4 specification. Needs Loam's runner (tag loam-runner):
# it runs on the seed p4-base and reads the step directives in descriptions, which AFD's
# `afd scenario run --server` ignores (the specification's "Jobs and scenarios"). The data is
# invented. Lists are asserted by index ('0'), and a single item by `'1': { notExists: true }`,
# since AFD compares a YAML list whole.
# Phase 4 serves this to the in-process agent interface only; connected agents read it over
# MCP from phase 5 (section 13).
name: Know my mode before I act
description: >-
  When I am an agent about to act for my person, I want to know whether to act, ask or only
  suggest, and why, so that I don't surprise them.
job: know-my-mode
tags: [slice, loam-runner]
steps:
  - description: An owner's workspace mode
    command: autonomy-set
    input: { level: workspace, mode: ask, ceiling: act }
    expect:
      success: true
  - description: "[agent] [scope: prj_atlas] I read the mode for two commands at once, each with where it came from"
    command: autonomy-get
    input: { commands: [{ command: tally-add, instance: tally }, { command: tally-get, instance: tally }] }
    expect:
      success: true
      data:
        results:
          '0':
            mode: ask
            chain: { '0': { as: mode } }
          '1': { mode: ask }
          '2': { notExists: true }
  - description: "[agent] I cannot raise it myself; the refusal hands the person the way"
    command: autonomy-set
    input: { level: workspace, mode: act }
    expect:
      success: false
      error:
        code: HUMAN_REQUIRED
        suggestion: { contains: settings }
  - description: "[agent] [scope: prj_atlas] A project my person cannot enter reads as missing"
    command: autonomy-get
    input: { command: tally-add, instance: tally, project: prj_nowhere }
    expect:
      success: false
      error: { code: PROJECT_NOT_FOUND }
  - description: "[agent] [scope: prj_atlas] My mode is unchanged"
    command: autonomy-get
    input: { command: tally-add, instance: tally }
    expect:
      success: true
      data: { mode: ask }
