# Draft JTBD scenario for Loam's phase 4 specification. Steps run as `kind: 'test'`, so the
# agent's refusal (`autonomy-set` through the agent interface is HUMAN_REQUIRED) cannot be
# shown here; P4-E4 shows it. This file shows what an agent reads, and that a raise past an
# owner's rule is refused whoever asks.
name: Read my autonomy, and not raise it
description: >-
  When an agent acts for me, it wants to know whether it may act, ask or only suggest, and it
  must not be able to raise that itself, so that only people decide what agents do.
job: agent-reads-autonomy
tags: [slice]
steps:
  - description: An owner's rule for one command, workspace-wide
    command: autonomy-set
    input: { level: workspace, instance: tally, command: tally-reset, mode: suggest }
    expect:
      success: true
  - description: "The resolved mode, with where it came from (scope: atlas)"
    command: autonomy-get
    input: { command: tally-reset, instance: tally }
    expect:
      success: true
      data: { mode: suggest }
  - description: A project row cannot go past the owner's rule
    command: autonomy-set
    input: { level: project, project: atlas, instance: tally, command: tally-reset, mode: act }
    expect:
      success: false
      error:
        code: AUTONOMY_ABOVE_CEILING
        suggestion: { contains: owner }
  - description: A project the caller cannot enter reads as missing
    command: autonomy-get
    input: { command: tally-reset, instance: tally, project: prj_unknown00000000 }
    expect:
      success: false
      error: { code: PROJECT_NOT_FOUND }
