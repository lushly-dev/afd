# Draft JTBD scenario for Loam's phase 4 specification. The commands and shapes are the
# specification's drafts; the data is invented. A step's description may open with
# directives Loam's runner reads (the specification's "Jobs and scenarios"): [scope: <project>],
# [caller: <instance>] (through that app's port; add "inactive" for a background app) and
# [agent] (the agent interface, as shell-agent). With none, the step is the person at the
# palette, a human gesture (R7).
# Pressing keys is the chrome's; P4-E9 presses them on German and Cyrillic layouts.
name: Open the project switcher from the keyboard, and make it mine
description: >-
  When I switch projects many times a day, I want a chord for the switcher that works on my
  keyboard layout, and to change it if it clashes, so that I never reach for the mouse.
job: rebind-a-chord
steps:
  - description: The switcher has a chord, from the shell
    command: keybinding-list
    input: {}
    expect:
      success: true
      data:
        bindings:
          - { keys: Mod+Alt+P, command: section-open, source: shell }
  - description: I move it to a chord of my own
    command: setting-set
    input:
      section: loam.keybindings
      key: overrides
      value: [{ command: section-open, target: switcher, keys: Mod+Shift+O }]
      level: person
    expect:
      success: true
  - description: Mine is listed as mine
    command: keybinding-list
    input: {}
    expect:
      success: true
      data:
        bindings:
          - { keys: Mod+Shift+O, command: section-open, source: you }
