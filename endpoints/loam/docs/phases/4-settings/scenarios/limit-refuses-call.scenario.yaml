# Draft JTBD scenario for Loam's phase 4 specification. The commands and shapes are the
# specification's drafts; the data is invented. A step's description may open with
# directives Loam's runner reads (the specification's "Jobs and scenarios"): [scope: <project>],
# [caller: <instance>] (through that app's port; add "inactive" for a background app) and
# [agent] (the agent interface, as shell-agent). With none, the step is the person at the
# palette, a human gesture (R7).
# The figures are in each error's details ({ limit, retryAfterMs }), which P4-E10 asserts. An
# input over inputBytes needs 64 KiB, which a scenario cannot carry; P4-E10 shows it.
name: Learn which limit my app hit, and what to change
description: >-
  When my app hits one of the shell's limits, I want to learn which one and what to change, so
  that I fix my app instead of guessing.
job: limit-refuses-call
steps:
  - description: An owner lowers the input limit first, as the bounds require
    command: setting-set
    input: { section: loam.limits, key: inputBytes, value: 65536, level: workspace }
    expect:
      success: true
  - description: An entry limit under four times the input limit is refused, naming the order
    command: setting-set
    input: { section: loam.limits, key: journalEntryBytes, value: 131072, level: workspace }
    expect:
      success: false
      error:
        code: VALIDATION_ERROR
        suggestion: { contains: inputBytes }
  - description: "[caller: hello] Push 1 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 1 }
    expect:
      success: true
  - description: "[caller: hello] Push 2 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 2 }
    expect:
      success: true
  - description: "[caller: hello] Push 3 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 3 }
    expect:
      success: true
  - description: "[caller: hello] Push 4 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 4 }
    expect:
      success: true
  - description: "[caller: hello] Push 5 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 5 }
    expect:
      success: true
  - description: "[caller: hello] Push 6 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 6 }
    expect:
      success: true
  - description: "[caller: hello] Push 7 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 7 }
    expect:
      success: true
  - description: "[caller: hello] Push 8 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 8 }
    expect:
      success: true
  - description: "[caller: hello] Push 9 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 9 }
    expect:
      success: true
  - description: "[caller: hello] Push 10 of the ten a minute allows"
    command: notification-push
    input: { title: Reminder 10 }
    expect:
      success: true
  - description: "[caller: hello] The eleventh is refused, naming the fixed rate and when to retry"
    command: notification-push
    input: { title: Reminder 11 }
    expect:
      success: false
      error:
        code: RATE_LIMITED
        suggestion: { contains: fixed }
  - description: The owner sees which app hit which limit
    command: limit-usage-get
    input: {}
    expect:
      success: true
      data:
        instances:
          - { instance: hello, refusals: { pushes: 1 } }
