# Draft JTBD scenario for Loam's phase 4 specification. Needs Loam's runner (tag loam-runner):
# it runs on the seed p4-base and reads the step directives in descriptions, which AFD's
# `afd scenario run --server` ignores (the specification's "Jobs and scenarios"). The data is
# invented. Lists are asserted by index ('0'), and a single item by `'1': { notExists: true }`,
# since AFD compares a YAML list whole.
# hello.general.greeting may be set at workspace and project level; hello.project.board is a
# project-only key.
name: Find a setting from the palette
description: >-
  When I know what I want to change but not where it lives, I want to find it from the palette
  and change it there, so that I never browse the settings tree.
job: setting-from-palette
tags: [slice, loam-runner]
steps:
  - description: "[scope: prj_atlas] Searching settings finds the key, with its section and key apart"
    command: palette-search
    input: { query: greeting, kind: setting }
    expect:
      success: true
      data:
        items:
          '0': { kind: setting, section: hello.general, key: greeting }
          '1': { notExists: true }
  - description: With no project active, a project-only key is not listed
    command: palette-search
    input: { query: board, kind: setting }
    expect:
      success: true
      data:
        items: { length: 0 }
  - description: "[scope: prj_atlas] Choosing the row opens the section at the key"
    command: section-open
    input: { section: settings, target: hello.general.greeting }
    expect:
      success: true
  - description: "[scope: prj_atlas] I change it there"
    command: setting-set
    input: { section: hello.general, key: greeting, value: Hi Atlas, level: project }
    expect:
      success: true
      data: { value: Hi Atlas, from: project }
