manifest_version = 2
protocol = 1
afd_contract = "1.0"

[plugin]
id = "hello"
title = "Hello"
version = "0.1.0"
description = "One command, a sidebar list and a main view: the reference app."
kind = "view"
domains = ["hello"]
license = "MIT"

[view]
handlers = "dist/handlers.html"

[app]
scope_levels = ["workspace", "project"]

[[grants]]
name = "store"
reason = "Keeps the names greeted."

[[grants]]
name = "clock"
reason = "Stamps each greeting with the command context's clock."

[[grants]]
name = "settings"
reason = "Reads the greeting and the guest board's name, which a person sets for the workspace or a project."

[[commands]]
name = "hello-greet"
title = "Greet someone"
description = "Greet someone and remember the name, so it joins the sidebar's list."
category = "hello"
effects = ["store-write"]
input_schema = "schemas/hello-greet.input.json"
undoable = true
tool_meta = { ui = { resourceUri = "ui://hello/main" } }

[[commands]]
name = "hello-list"
title = "List greetings"
description = "List the names greeted so far, as the sidebar's list."
category = "hello"
effects = ["inspect"]
input_schema = { type = "object", properties = {}, additionalProperties = false }

[[commands]]
name = "hello-guests"
title = "List the guest book"
description = "List the visitors at the guest book, each with whether Hello has greeted them."
category = "hello"
effects = ["inspect"]
input_schema = { type = "object", properties = {}, additionalProperties = false }

[[commands]]
name = "hello-forget"
title = "Forget a name"
description = "Remove a greeted name from the list; the undo of hello-greet."
category = "hello"
effects = ["store-write"]
input_schema = "schemas/hello-forget.input.json"

[[skills]]
name = "hello-guide"
path = "skills/hello-guide"

[config]
schema = "schemas/config.schema.json"

[ui]
compositions = ["list-detail"]

[[ui.resources]]
uri = "ui://hello/main"
path = "dist/main.html"

[ui.layout]
sidebar = { open = true, width = 260 }

[ui.surfaces.rail]
label = "Hello"
icon = "system/document"
order = 10

[ui.surfaces.sidebar]
shape = "list"
command = "hello-list"
title = "Greetings"

[ui.surfaces.main]
resource = "ui://hello/main"
command = "hello-list"

# Phase 4's settings (its 3.1): the greeting, for the workspace and each project, and the guest board, for a
# project alone. Hello reads them through the `settings` grant and greets with the one that applies here.
[[ui.settings]]
id = "general"
title = "General"
description = "How Hello greets people."
levels = ["workspace", "project"]

[ui.settings.schema]
type = "object"
additionalProperties = false

[ui.settings.schema.properties.greeting]
type = "string"
title = "Greeting"
description = "The word Hello greets with, as in Hello, friend!"
maxLength = 40
default = "Hello"

# A key narrower than its section: the workspace's alone, so a link to it opens the workspace's level.
[ui.settings.schema.properties.signoff]
type = "string"
title = "Sign-off"
description = "How the workspace's notes from Hello end."
levels = ["workspace"]
maxLength = 40
default = "Bye"

[[ui.settings]]
id = "project"
title = "Project"
description = "Hello in one project."
levels = ["project"]

[ui.settings.schema]
type = "object"
additionalProperties = false

[ui.settings.schema.properties.board]
type = "string"
title = "Guest board"
description = "The name of this project's guest board."
maxLength = 60
default = "Guests"
