<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Hello</title>
		<style>
			body {
				margin: 0;
				padding: var(--space-layout-md);
				background: var(--color-surface-page);
				color: var(--color-text-primary);
				font-family: var(--font-family-body);
				font-size: var(--type-body-md-size);
				line-height: var(--type-body-md-line);
			}
			h1 {
				margin-block: 0 var(--space-stack-md);
				font-size: var(--type-title-md-size);
				line-height: var(--type-title-md-line);
				font-weight: var(--type-title-md-weight);
			}
			form {
				display: flex;
				flex-wrap: wrap;
				align-items: end;
				gap: var(--space-inline-sm);
				margin-block-end: var(--space-stack-md);
			}
			label {
				display: grid;
				gap: var(--space-stack-xs);
			}
			/*
			 * As violet-text-field and violet-button draw them (Refined, D159): the field is a well, its 3:1 rule
			 * an inner line along the top over the well's shadow, and the button a key raised by the control
			 * shadow. Forced colors drops box-shadow, so it draws both as borders.
			 */
			input,
			button {
				box-sizing: border-box;
				min-block-size: var(--size-target-comfortable);
				padding-inline: max(var(--space-inline-md), calc(var(--size-target-comfortable) * 0.375));
				border-radius: var(--radius-md);
				font: inherit;
			}
			input {
				border: 1px solid var(--color-border-subtle);
				background: var(--color-field-background);
				box-shadow:
					inset 0 1px 0 var(--color-field-border),
					var(--shadow-well);
				color: var(--color-field-text);
			}
			input:hover {
				box-shadow:
					inset 0 1px 0 var(--color-field-border-hover),
					var(--shadow-well);
			}
			input:focus-visible {
				border-color: var(--color-field-border-focus);
			}
			button {
				border: 1px solid transparent;
				background: var(--color-action-primary-background);
				box-shadow: var(--shadow-control);
				color: var(--color-action-primary-text);
				font-weight: var(--weight-medium);
				cursor: pointer;
			}
			button:hover {
				background: var(--color-action-primary-hover);
			}
			button:active {
				background: var(--color-action-primary-pressed);
				box-shadow: none;
			}
			:focus-visible {
				outline: var(--size-focus-ring-width) solid var(--color-focus-ring);
				outline-offset: 1px;
			}
			p {
				margin-block: 0 var(--space-stack-sm);
			}
			@media (forced-colors: active) {
				body {
					background: Canvas;
					color: CanvasText;
				}
				input,
				button {
					border-color: ButtonText;
				}
				:focus-visible {
					outline-color: Highlight;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Hello</h1>
			<form id="greet">
				<label>
					Name
					<input id="name" name="name" autocomplete="off" />
				</label>
				<button type="submit">Greet</button>
			</form>
			<p id="greets"></p>
			<p id="greeting" role="status"></p>
			<p id="count"></p>
			<p id="selected"></p>
		</main>
		<script type="module" src="../view-main.ts"></script>
	</body>
</html>
