manifest_version = 2
protocol = 1
afd_contract = "1.0"

[plugin]
id = "violet"
title = "Violet"
version = "0.1.0"
description = "Token trees: browse, compare, change with a preview first, check contrast and the components' interface, and export."
kind = "native"
domains = ["violet"]
license = "MIT"

[native]
entry = "dist/native.js"

[app]
scope_levels = ["workspace", "project"]

[config]
schema = "schemas/config.json"

[[grants]]
name = "store"
reason = "Keeps each tree's nodes, operations, rules and history."

[[grants]]
name = "clock"
reason = "Stamps each change, so a replayed session writes the same times."

[[grants]]
name = "random"
reason = "Draws each record's id, so a replayed session writes the same ids."

[[grants]]
name = "documents"
reason = "Finds the other tree a comparison names, and lists trees to compare with."

[[commands]]
name = "violet-node-list"
title = "List tree nodes"
description = "List a token tree's nodes (ids are paths like product/dark) with each node's kind, parent and how many tokens it sets itself. Find trees with document-list { type: \"violet-tree\" }."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-node-list.input.json"
errors = []

[[commands]]
name = "violet-node-get"
title = "Read a node"
description = "Read one node of a token tree and the tokens it sets itself, each with its operation (add or override) and value."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-node-get.input.json"
errors = ["NODE_NOT_FOUND"]

[[commands]]
name = "violet-node-create"
title = "Create a node"
description = "Add a node, usually a theme, under a parent; it inherits every value until it overrides one. restore: true brings back a deleted node with its tokens."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-node-create.input.json"
undoable = true
errors = ["NODE_ALREADY_EXISTS", "INVALID_PARENT", "NODE_NOT_FOUND", "VALIDATION_ERROR"]

[[commands]]
name = "violet-node-delete"
title = "Delete a node"
description = "Delete a node that has no children; its tokens are kept so the undo brings it back."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-node-delete.input.json"
undoable = true
errors = ["NODE_NOT_FOUND", "NODE_HAS_CHILDREN"]

[[commands]]
name = "violet-token-resolve"
title = "Resolve tokens"
description = "Resolve the tokens a node ends up with, each with the node that set it. filter is a glob such as color.text.*; read summaries first on large trees."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-token-resolve.input.json"
errors = ["NODE_NOT_FOUND"]

[[commands]]
name = "violet-token-find"
title = "Find tokens"
description = "Find tokens by words in their id, description or category, with the nodes that set each. An empty list is not an error."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-token-find.input.json"
errors = []

[[commands]]
name = "violet-token-lineage"
title = "Show token lineage"
description = "Show where a node's value for a token comes from: each node on the way from the one that added it, and what each did (add, override, inherit)."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-token-lineage.input.json"
errors = ["NODE_NOT_FOUND", "TOKEN_NOT_FOUND"]

[[commands]]
name = "violet-token-compare"
title = "Compare nodes"
description = "Compare two to four nodes of one tree side by side, only tokens that differ; each cell says whether it differs from the first node."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-token-compare.input.json"
errors = ["VALIDATION_ERROR", "NODE_NOT_FOUND"]

[[commands]]
name = "violet-tree-compare"
title = "Compare two trees"
description = "Compare a node of this tree with a node of another tree in the same scope: tokens whose values differ, and tokens only one side has."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-tree-compare.input.json"
errors = ["DOCUMENT_NOT_FOUND", "NODE_NOT_FOUND"]

[[commands]]
name = "violet-change-list"
title = "List changes"
description = "List changes to a tree's nodes and tokens, newest first, with the old and new value, who made each and the reason given."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-change-list.input.json"
errors = ["NODE_NOT_FOUND"]

[[commands]]
name = "violet-change-preview"
title = "Preview changes"
description = "Preview token changes on a node without writing: which nodes change, which are shielded by their own override, and which contrast rules break. Apply exactly that with the apply step it returns."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-change-preview.input.json"
errors = ["NODE_NOT_FOUND", "TOKEN_NOT_FOUND", "TOKEN_ALREADY_EXISTS", "INVALID_TOKEN_VALUE", "OPERATION_NOT_ALLOWED", "VALIDATION_ERROR"]

[[commands]]
name = "violet-change-apply"
title = "Apply changes"
description = "Apply up to 50 token changes on one node as one change with one undo, as violet-change-preview showed them."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-change-apply.input.json"
undoable = true
errors = ["NODE_NOT_FOUND", "TOKEN_NOT_FOUND", "TOKEN_ALREADY_EXISTS", "INVALID_TOKEN_VALUE", "OPERATION_NOT_ALLOWED", "VALIDATION_ERROR"]

[[commands]]
name = "violet-token-add"
title = "Add a token"
description = "Add a token a node defines (its children inherit it). To change an existing token's value use violet-token-override; writes are not checked against the rules, so preview first."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-token-add.input.json"
undoable = true
errors = ["NODE_NOT_FOUND", "TOKEN_ALREADY_EXISTS", "INVALID_TOKEN_VALUE", "VALIDATION_ERROR"]

[[commands]]
name = "violet-token-override"
title = "Override a token"
description = "Set a node's own value for a token it already has; the result says whether the value it replaced was inherited. Preview first with violet-change-preview."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-token-override.input.json"
undoable = true
errors = ["NODE_NOT_FOUND", "TOKEN_NOT_FOUND", "INVALID_TOKEN_VALUE", "VALIDATION_ERROR"]

[[commands]]
name = "violet-token-reset"
title = "Reset a token"
description = "Take back a node's own value for a token, so it follows its parent again; on the node that added the token, this removes it."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-token-reset.input.json"
undoable = true
errors = ["NODE_NOT_FOUND", "TOKEN_NOT_FOUND", "OPERATION_NOT_ALLOWED"]

[[commands]]
name = "violet-theme-preview"
title = "Preview a theme"
description = "Return the custom properties a preview of a node applies (--violet-color-text-primary: #1b1b1f), and any value refused as unsafe to draw."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-theme-preview.input.json"
errors = ["NODE_NOT_FOUND"]

[[commands]]
name = "violet-constraint-set"
title = "Set node constraints"
description = "Set a node's rules, such as contrast floors (text against the page at 4.5:1); merge: true adds to the node's rules. Rules are checked by violet-violation-list, not on write."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-constraint-set.input.json"
undoable = true
errors = ["NODE_NOT_FOUND", "DUPLICATE_CONSTRAINT_ID", "VALIDATION_ERROR"]

[[commands]]
name = "violet-violation-list"
title = "List violations"
description = "List contrast and other rule failures across every node of the tree, each with its token, rule and measured ratio."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-violation-list.input.json"
errors = ["NODE_NOT_FOUND"]

[[commands]]
name = "violet-interface-check"
title = "Check component interface"
description = "Check that every entry of the shared components' token interface resolves in each theme node; list each missing entry by node."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-interface-check.input.json"
errors = ["NODE_NOT_FOUND"]

[[commands]]
name = "violet-export"
title = "Export a theme"
description = "Export a node's resolved tokens in one format (css under a selector, json, …), with the tree's open checks stated beside it."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-export.input.json"
errors = ["NODE_NOT_FOUND", "VALIDATION_ERROR", "INVALID_TOKEN_VALUE", "TOKEN_REFERENCE_NOT_FOUND", "CIRCULAR_REFERENCE", "NOT_IMPLEMENTED"]

[[commands]]
name = "violet-tree-import"
title = "Import tree files"
description = "Bring a tree in from DTCG token files, one node per file, all or nothing. replace: true replaces the tree, refused while changes are unexported unless exportedRev is the rev violet-tree-export returned."
category = "violet"
effects = ["store-write"]
input_schema = "schemas/violet-tree-import.input.json"
errors = ["NODE_ALREADY_EXISTS", "OPERATION_NOT_ALLOWED", "INVALID_TOKEN_VALUE", "INVALID_PARENT", "CIRCULAR_REFERENCE", "VALIDATION_ERROR"]

[[commands]]
name = "violet-tree-export"
title = "Export tree files"
description = "Write the tree back as DTCG files, one per node with only that node's own values, and the rev to pass to a later replacing import."
category = "violet"
effects = ["inspect"]
input_schema = "schemas/violet-tree-export.input.json"
errors = ["OPERATION_NOT_ALLOWED", "INVALID_TOKEN_VALUE", "VALIDATION_ERROR"]

[ui.surfaces.rail]
label = "Violet"
icon = "system/folder"
order = 40

[ui.surfaces.main]
element = "token-tree-main"

[[ui.documents]]
id = "violet-tree"
title = "Token tree"
icon = "system/folder"
content_schema = "schemas/violet-tree.content.json"
content_version = 1
instance_commands = [
	"violet-node-list",
	"violet-node-get",
	"violet-node-create",
	"violet-node-delete",
	"violet-token-resolve",
	"violet-token-find",
	"violet-token-lineage",
	"violet-token-compare",
	"violet-tree-compare",
	"violet-change-list",
	"violet-change-preview",
	"violet-change-apply",
	"violet-token-add",
	"violet-token-override",
	"violet-token-reset",
	"violet-theme-preview",
	"violet-constraint-set",
	"violet-violation-list",
	"violet-interface-check",
	"violet-export",
	"violet-tree-import",
	"violet-tree-export",
]
export_command = "violet-tree-export"
import_command = "violet-tree-import"

[ui.documents.editor]
element = "token-tree-editor"

[ui.documents.inspector]
element = "token-tree-inspector"

[ui.documents.binding]
model = "command"
selection = "item"
locator = "item"
conflict = "last-writer-wins"

[[ui.documents.templates]]
id = "blank"
title = "Blank tree"

[ui.documents.templates.content]
format = "violet-tree"
version = 1
rev = 0
syncedRev = 0

[ui.documents.templates.content.seed]
files = []

[[ui.documents.templates]]
id = "example"
title = "Example tree"

[ui.documents.templates.content]
format = "violet-tree"
version = 1
rev = 0
syncedRev = 0

[ui.documents.templates.content.seed]
files = [
	{ name = "example.tokens.json", content = "{\"$extensions\":{\"dev.lushly.violet\":{\"node\":\"example\",\"type\":\"product\"}},\"color\":{\"$type\":\"color\",\"surface\":{\"page\":{\"$value\":\"#ffffff\"}},\"text\":{\"primary\":{\"$value\":\"#1b1b1f\"},\"muted\":{\"$value\":\"#6b6b75\"}},\"field\":{\"border\":{\"$value\":\"#8a8a94\"}},\"action\":{\"primary\":{\"background\":{\"$value\":\"#5b3fd1\"}}}},\"size\":{\"$type\":\"dimension\",\"focus-ring\":{\"width\":{\"$value\":\"2px\"}}}}" },
	{ name = "example_light.tokens.json", content = "{\"$extensions\":{\"dev.lushly.violet\":{\"node\":\"example/light\",\"parent\":\"example\",\"type\":\"theme\"}}}" },
	{ name = "example_dark.tokens.json", content = "{\"$extensions\":{\"dev.lushly.violet\":{\"node\":\"example/dark\",\"parent\":\"example\",\"type\":\"theme\"}},\"color\":{\"surface\":{\"page\":{\"$value\":\"#121214\"}},\"text\":{\"primary\":{\"$value\":\"#ececf1\"},\"muted\":{\"$value\":\"#9a9aa6\"}},\"field\":{\"border\":{\"$value\":\"#6e6e7a\"}}}}" },
	{ name = "example_high-contrast.tokens.json", content = "{\"$extensions\":{\"dev.lushly.violet\":{\"node\":\"example/high-contrast\",\"parent\":\"example\",\"type\":\"theme\"}},\"color\":{\"text\":{\"primary\":{\"$value\":\"#000000\"}},\"field\":{\"border\":{\"$value\":\"#000000\"}}},\"size\":{\"focus-ring\":{\"width\":{\"$value\":\"3px\"}}}}" },
]

[ui.documents.templates.content.seed.constraints]
example = [
	{ id = "text-on-page", name = "Text on the page", applyTo = "color.text.*", severity = "error", enabled = true, config = { type = "contrast", against = "color.surface.page", min = 4.5 } },
]

