# JTBD scenario for Mail's step F (plugin.spec.md, "Jobs and scenarios"). It runs against
# `loam-mail serve` on the scripted IMAP server, seeded as `mail-f-base`, with
# `afd scenario run <dir> --server <url>` and an ordinary agent's token. The data is invented.
# mail-f-base holds the person's account 1 (me@example.com) and message 7 (thread 7), in which
# ada@example.com asks whether Thursday works.
# What a scenario cannot show: the send itself. Every step runs as one ordinary agent, whose send
# is held, so the steps show what the preview gives, that each change raises the revision, and
# that a send naming any revision but the current one is refused before it is held, so no
# approval is ever issued for a version the person was not shown. That a draft changed between
# the hold and an approved retry sends nothing is the engine's test F-T7, with an approver's token
# on the scripted servers.
name: Only what I saw is sent
description: >-
  When I approve sending a draft, I want exactly the version I saw to go, with the account and
  recipients I saw, so that a change made after I looked can never go out under my approval.
job: send-what-i-saw
tags: [slice, mail-engine]
steps:
  - description: A reply to Ada is drafted
    command: mail-draft-create
    input: { answers: 7, to: [ada@example.com], subject: "Re: Thursday", body: Thursday works for me. }
    expect:
      success: true
      data:
        revision: 1
  - description: The preview gives the revision, the sending account and each recipient, with why it is allowed
    command: mail-draft-show
    input: { draft: "${{ steps[0].data.draft }}" }
    expect:
      success: true
      data:
        revision: 1
        account: 1
        recipientBasis:
          to:
            '0': thread
            '1': { notExists: true }
        content:
          trust: content
          to:
            '0': ada@example.com
            '1': { notExists: true }
          body: Thursday works for me.
  - description: Someone changes the draft
    command: mail-draft-update
    input: { draft: "${{ steps[0].data.draft }}", revision: 1, body: Thursday works. Bring the invoice. }
    expect:
      success: true
      data:
        revision: 2
  - description: The preview now shows the new revision and the new text
    command: mail-draft-show
    input: { draft: "${{ steps[0].data.draft }}", revision: 2 }
    expect:
      success: true
      data:
        revision: 2
        content: { body: { contains: invoice } }
  - description: A preview asked for the revision before the change shows nothing
    command: mail-draft-show
    input: { draft: "${{ steps[0].data.draft }}", revision: 1 }
    expect:
      success: false
      error:
        code: PREVIEW_CHANGED
  - description: A send naming the revision before the change is refused before it is held
    command: mail-draft-send
    input: { draft: "${{ steps[0].data.draft }}", revision: 1 }
    expect:
      success: false
      error:
        code: PREVIEW_CHANGED
        suggestion: { contains: mail-draft-show }
  - description: So is a send naming a revision the draft has not reached
    command: mail-draft-send
    input: { draft: "${{ steps[0].data.draft }}", revision: 3 }
    expect:
      success: false
      error:
        code: PREVIEW_CHANGED
  - description: A send naming the revision shown is held for the person
    command: mail-draft-send
    input: { draft: "${{ steps[0].data.draft }}", revision: 2 }
    expect:
      success: false
      error:
        code: APPROVAL_REQUIRED
