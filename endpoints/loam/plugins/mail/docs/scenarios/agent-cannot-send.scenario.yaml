# JTBD scenario for Mail's step F (plugin.spec.md, "Jobs and scenarios"). It runs against
# `loam-mail serve` on the scripted IMAP server, seeded as `mail-f-base`, with
# `afd scenario run <dir> --server <url>` and an ordinary agent's token: not an approver. The
# data is invented. mail-f-base holds the person's account 1 (me@example.com) and message 7
# (thread 7), in which ada@example.com asks whether Thursday works.
# What a scenario cannot show: that the held result carries no `details.approvalToken` (an
# error's details cannot be asserted), and that an approver's evidence releases the send (every
# step runs as one caller, and the runner cannot set `_meta`). Both are the engine's tests F-T3
# and F-T4.
name: An agent cannot send, though it can see the command
description: >-
  When an agent connected over MCP asks the mail engine to send, I want the send held for me
  whatever the agent does, so that nothing leaves my account unless I decided it.
job: agent-cannot-send
tags: [slice, mail-engine]
steps:
  - description: The agent drafts a reply to Ada
    command: mail-draft-create
    input: { answers: 7, to: [ada@example.com], subject: "Re: Thursday", body: Thursday works for me. }
    expect:
      success: true
      data:
        revision: 1
  - description: The agent asks to send it; the engine holds the send for the person
    command: mail-draft-send
    input: { draft: "${{ steps[0].data.draft }}", revision: 1 }
    expect:
      success: false
      error:
        code: APPROVAL_REQUIRED
        suggestion: { contains: terminal }
  - description: The draft is still a draft
    command: mail-draft-show
    input: { draft: "${{ steps[0].data.draft }}" }
    expect:
      success: true
      data:
        state: open
        revision: 1
  - description: The agent cannot make itself an approver
    command: mail-token-create
    input: { name: Helper, role: approver }
    expect:
      success: false
      error:
        code: COMMAND_NOT_FOUND
  - description: The agent cannot change the rules it works under
    command: mail-policy-set
    input: { changePerCall: 1000 }
    expect:
      success: false
      error:
        code: COMMAND_NOT_FOUND
