# Draft JTBD scenario for Mail's step F (plugin.spec.md, "Jobs and scenarios"). It runs against
# `loam-mail serve` on the scripted IMAP server, seeded as `mail-f-base`, with
# `afd scenario run <dir> --server <url>` and an ordinary agent's token. The data is invented.
# mail-f-base holds reply set 3, answering a cohort story: reply 1 to ada@example.com, who asked
# about Thursday, and reply 2 to bea@example.com, who asked about the invoice. The person's
# answers are recorded, and neither reply has text. The reply-set commands' keys are step E3's;
# the step F pull request that builds units aligns this file with E3 as merged.
# What a scenario cannot show: the result's `dev.loam/unit` marker, because the matcher reads a
# key with a dot as a path, so the unit's id is asserted where it is echoed (`unit`); that the
# unit's parts hold only Ada's message and the answers to her (the engine's test F-T10); and that
# Loam composes the unit in a fresh context (Loam's P5-A7).
name: Hand out each reply with only its own inputs
description: >-
  When an agent writes the replies of a reply set, I want each handed out with only its own
  sender's message and my answers to it, and recorded with what it was written from, so that I
  can check every reply against exactly its inputs before I send the set.
job: compose-replies-apart
tags: [slice, mail-engine]
steps:
  - description: The first unit is Ada's reply, holding her address as content
    command: mail-replyset-next
    input: { replyset: 3 }
    expect:
      success: true
      data:
        replyset: 3
        reply: 1
        unit: { matches: '^rsu_3_1_[0-9]+$' }
        content: { trust: content, recipient: { address: ada@example.com } }
  - description: The composed text is submitted against that unit
    command: mail-replyset-submit
    input: { replyset: 3, reply: 1, unit: "${{ steps[0].data.unit }}", text: Dear Ada, Thursday works. }
    expect:
      success: true
      data:
        reply: { reply: 1, composedVia: unit }
  - description: The next unit is Bea's
    command: mail-replyset-next
    input: { replyset: 3 }
    expect:
      success: true
      data:
        reply: 2
        content: { trust: content, recipient: { address: bea@example.com } }
  - description: A unit that does not match the reply's inputs is refused
    command: mail-replyset-submit
    input: { replyset: 3, reply: 2, unit: rsu_3_2_999, text: Dear Bea, Thursday works. }
    expect:
      success: false
      error:
        code: UNIT_NOT_OPEN
        suggestion: { contains: mail-replyset-next }
  - description: The set shows Ada's reply with what it was written from, and Bea's as not written yet
    command: mail-replyset-show
    input: { replyset: 3 }
    expect:
      success: true
      data:
        replyset:
          replies:
            '0':
              reply: 1
              unit: "${{ steps[0].data.unit }}"
              inputs: { message: { exists: true }, answers: { exists: true } }
              content: { trust: content, recipient: { address: ada@example.com }, text: { contains: Ada } }
            '1':
              reply: 2
              content: { text: { notExists: true } }
