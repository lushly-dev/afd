# JTBD scenario for Mail's step F (plugin.spec.md, "Jobs and scenarios"). It runs against
# `loam-mail serve` on the scripted IMAP server, seeded as `mail-f-base`, with
# `afd scenario run <dir> --server <url>` and an ordinary agent's token. The data is invented.
# mail-f-base holds reply set 1: reply 1 to ada@example.com, who asked about Thursday, and
# reply 2 to bea@example.com, who asked about the invoice. The person's answers are recorded,
# and neither reply has text.
# What a scenario cannot show: the result's `dev.loam/unit` marker, because the matcher and the
# step references read a key with a dot as a path, so the unit's id and claim are used where the
# result repeats them (`unit`, `claim`); that the stored unit equals the one handed out, since
# expectations are not resolved against earlier steps (F-T9 checks it); that the unit's parts
# hold only Ada's message and the answers to her (F-T10); and that Loam composes the unit in a
# fresh context (Loam's P5-A7). The set's send is held for every caller the runner can be; a set
# with a reply that has no text is refused before the hold, so both replies are written first.
name: Hand out each reply with only its own inputs
description: >-
  When an agent writes the replies of a reply set, I want each handed out with only its own
  sender's message and my answers to it, and recorded with what it was written from, so that I
  can check every reply against exactly its inputs before I send the set.
job: compose-replies-apart
tags: [slice, mail-engine]
steps:
  - description: The first unit is Ada's reply, holding her address as content
    command: mail-replyset-next
    input: { replyset: 1 }
    expect:
      success: true
      data:
        replyset: 1
        reply: 1
        unit: { matches: '^rsu_1_1_[0-9]+$' }
        claim: { matches: '^[A-Za-z0-9_-]{43}$' }
        content: { trust: content, recipient: { address: ada@example.com } }
  - description: The composed text is submitted against that unit, with its claim
    command: mail-replyset-submit
    input:
      replyset: 1
      reply: 1
      unit: "${{ steps[0].data.unit }}"
      claim: "${{ steps[0].data.claim }}"
      text: "Dear Ada, Thursday works."
    expect:
      success: true
      data:
        reply: { reply: 1, source: submitted }
  - description: The same claim cannot be used twice
    command: mail-replyset-submit
    input:
      replyset: 1
      reply: 1
      unit: "${{ steps[0].data.unit }}"
      claim: "${{ steps[0].data.claim }}"
      text: "Dear Ada, Friday works."
    expect:
      success: false
      error:
        code: UNIT_NOT_OPEN
        suggestion: { contains: mail-replyset-next }
  - description: The next unit is Bea's
    command: mail-replyset-next
    input: { replyset: 1 }
    expect:
      success: true
      data:
        reply: 2
        content: { trust: content, recipient: { address: bea@example.com } }
  - description: Ada's claim cannot submit Bea's reply
    command: mail-replyset-submit
    input:
      replyset: 1
      reply: 2
      unit: "${{ steps[3].data.unit }}"
      claim: "${{ steps[0].data.claim }}"
      text: "Dear Bea, Thursday works."
    expect:
      success: false
      error:
        code: UNIT_NOT_OPEN
  - description: Bea's reply is submitted with her own unit's claim
    command: mail-replyset-submit
    input:
      replyset: 1
      reply: 2
      unit: "${{ steps[3].data.unit }}"
      claim: "${{ steps[3].data.claim }}"
      text: "Dear Bea, the invoice is attached."
    expect:
      success: true
      data:
        reply: { reply: 2, source: submitted }
  - description: The set shows each reply with what it was written from
    command: mail-replyset-show
    input: { replyset: 1 }
    expect:
      success: true
      data:
        replyset:
          replies:
            '0':
              reply: 1
              source: submitted
              unit: { matches: '^rsu_1_1_[0-9]+$' }
              inputs: { message: { exists: true }, answers: { exists: true } }
              content: { trust: content, recipient: { address: ada@example.com }, text: "Dear Ada, Thursday works." }
            '1':
              reply: 2
              source: submitted
              content: { trust: content, recipient: { address: bea@example.com }, text: "Dear Bea, the invoice is attached." }
  - description: A preview asked for a revision the set is not at shows nothing
    command: mail-replyset-show
    input: { replyset: 1, revision: 999 }
    expect:
      success: false
      error:
        code: PREVIEW_CHANGED
  - description: The send's confirmation preview shows every recipient and text whole, and none of the audit
    command: mail-replyset-preview
    input: { replyset: 1, revision: "${{ steps[6].data.replyset.revision }}" }
    expect:
      success: true
      data:
        replyset:
          id: 1
          state: open
          content: { trust: content, alreadySent: { length: 0 } }
          replies:
            '0':
              differs: { exists: true }
              unit: { notExists: true }
              inputs: { notExists: true }
              content: { trust: content, to: ada@example.com, text: "Dear Ada, Thursday works." }
            '1':
              content: { trust: content, to: bea@example.com, text: "Dear Bea, the invoice is attached." }
            '2': { notExists: true }
  - description: Sending the set at the revision shown is held for the person
    command: mail-replyset-send
    input: { replyset: 1, revision: "${{ steps[6].data.replyset.revision }}" }
    expect:
      success: false
      error:
        code: APPROVAL_REQUIRED
