[package]
name = "loam_mail"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Loam Mail's engine: a person's mail on their machine, served as AFD commands"
repository = "https://github.com/lushly-dev/afd"

# The engine is its own workspace, as Umbel is (the engine's specification, section 2).
[workspace]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[lib]
name = "loam_mail"

[[bin]]
name = "loam-mail"
path = "src/main.rs"

[dependencies]
# Step B5 adds `server` when it serves MCP; until then the lock stays without the MCP SDK.
afd = { path = "../../../../../packages/rust", default-features = false, features = ["native", "approval", "journal-file"] }
async-trait = "0.1"
mail-parser = "1.0.1"
# The store (the specification's section 4). SQLite is bundled, at the version Umbel pins, so the
# repository carries one.
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
# The log's file names, and a message's identity.
sha2 = "0.11"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "stopwords", "stemmer", "lz4-compression"] }
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
# The log is compressed: mail is mostly text.
zstd = { version = "0.14", default-features = false }

# Making a batch of the log's files durable with one flush: a plain `fsync` per file and one
# `F_FULLFSYNC` on macOS, `syncfs` on Linux. `std` offers only the full flush per file.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
async-trait = "0.1"
serde_json = "1"
tempfile = "3"
