[package]
name = "loam-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Loam's desktop host: the web shell in Tauri 2's webview, with mounts over a Rust transport"

[lib]
name = "loam_desktop"
path = "src/lib.rs"

[[bin]]
name = "loam-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# Phase 6 specification, section 2: every crate exactly pinned. No `devtools` feature, and no plugin whose
# JavaScript permissions could be granted.
[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"
percent-encoding = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# P6-D4's origin case drives the commands through Tauri's own IPC, on its mock runtime.
tauri = { version = "=2.12.5", features = ["test"] }

[features]
# `tauri build` turns this on, so the release binary serves its own protocols rather than a dev server.
custom-protocol = ["tauri/custom-protocol"]
