[package]
name = "loam-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Loam's desktop host: the web shell in Tauri 2's webview, with mounts and the copilot's model requests over a Rust transport"

[lib]
name = "loam_desktop"
path = "src/lib.rs"

[[bin]]
name = "loam-desktop"
path = "src/main.rs"

[build-dependencies]
sha2 = "=0.11.1"
tauri-build = { version = "=2.7.6", features = [] }

# Phase 6 specification, section 2: every crate exactly pinned. No `devtools` feature, and no plugin whose
# JavaScript permissions could be granted. `tracing` is enabled on `tauri` (#1448) so `Webview::on_message`
# routes its invoke-key mismatch through `tracing::error!` (handled by `logging::init`) instead of `eprintln!`.
[dependencies]
tauri = { version = "=2.12.7", features = ["tracing"] }
tracing = "=0.1.44"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls", "zip"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "http2"] }
serde = { version = "1", features = ["derive"] }
# `float_roundtrip`: a number read exactly as JavaScript reads it, so the materializer prints what the CLI prints
# (phase 5 no-terminal amendment, 9.3; `js_json`).
serde_json = { version = "1", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "net", "signal"] }
futures-util = "0.3"
percent-encoding = "2"
# The inbound endpoint (phase 6 specification, 10.8) and pre-bearer verified loopback mounts (phase 5
# no-terminal amendment, 5.2): HTTP/1.1 on loopback, at the versions `reqwest` already locks;
# the per-run token and proof nonces from the operating system's random source.
hyper = { version = "=1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
getrandom = "=0.3.4"
# The headless materializer's projection `generation` (phase 5 no-terminal amendment, 9.2), and
# constant-time HMAC-SHA256 for pre-bearer `/health` proof verification (5.2), at the versions `Cargo.lock`
# and `loam-mail` already pin.
sha2 = "=0.11.1"
hmac = "=0.13.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# A copilot provider's key from the macOS keychain (phase 5 specification, 4.2), via Security.framework
# instead of spawning `/usr/bin/security`, at the exact versions `loam-mail` and `Cargo.lock` already pin.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
keyring-core = "=1.0.1"
security-framework = "=3.7.0"

# A copilot provider's key from the Credential Manager (phase 5 specification, 4.2), owner-only ACL checks on open
# file handles (`mounts::owner_only`), `inbound.json` created owner-only and the bridge's console (10.8), at the version
# Tauri's own dependencies already lock.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
# P6-D4's origin case drives the commands through Tauri's own IPC, on its mock runtime.
tauri = { version = "=2.12.7", features = ["test"] }

[features]
# `build:app` turns this on (and `tauri build` turns on `tauri/custom-protocol` itself), so the binary serves its own
# protocols rather than a dev server.
custom-protocol = ["tauri/custom-protocol"]

# P6-D5 updater harness: runs standalone checks under `cargo test`, drives real `tauri-plugin-updater`
# HTTPS installs when invoked by `test/installers/p6-d5.test.ts`, and acts as the signed PE payload on
# Windows (with an embedded `asInvoker` manifest so `ShellExecuteW` never prompts UAC).
[[test]]
name = "updater"
path = "tests/updater.rs"
harness = false
