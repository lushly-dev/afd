name: Umbel

on:
  push:
    branches: [main]
    paths:
      - 'endpoints/umbel/**'
      - '!endpoints/umbel/docs/**'
      # Umbel depends on the afd crate by path.
      - 'packages/rust/**'
      # The conformance job runs the todo example's suite and AFD's CLI against Umbel.
      - 'packages/examples/todo/**'
      - 'packages/cli/**'
      - '.github/workflows/umbel.yml'
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/umbel/**'
      - '!endpoints/umbel/docs/**'
      - 'packages/rust/**'
      # The conformance job runs the todo example's suite and AFD's CLI against Umbel.
      - 'packages/examples/todo/**'
      - 'packages/cli/**'
      - '.github/workflows/umbel.yml'
  # The macOS leg and the MSRV check run daily and on demand.
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every test binary links wasmtime; keep their debug information small enough for the
  # hosted runners' disks.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # A todo example or AFD CLI change runs only the conformance job; the host checks need a change to Umbel, the afd crate or this workflow. Scheduled and manual runs check everything.
    name: Affected units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      host: ${{ steps.host.outputs.run }}
    env:
      AFD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: host
        run: node scripts/affected.mjs gate --path endpoints/umbel/ --path packages/rust/ --path .github/workflows/umbel.yml

  check:
    name: Umbel (fmt, clippy, test)
    needs: scope
    if: needs.scope.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: endpoints/umbel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: endpoints/umbel
      - name: Format
        run: cargo fmt --all --check
      # The embedded backend's own tests belong to the `knowledge` job. The host depends on the
      # backend through its default feature `store-embedded` (phase 2 step 4), so this job builds
      # SQLite and tantivy once anyway; `--exclude` only keeps the backend's tests out of it.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude umbel-store-embedded --all-targets -- -D warnings
      - name: Clippy (library only, no default features)
        run: cargo clippy --locked -p umbel --lib --no-default-features -- -D warnings
      - name: Clippy (library only, mounted loader)
        run: cargo clippy --locked -p umbel --lib --no-default-features --features mounted -- -D warnings
      - name: Clippy (library only, component loader)
        run: cargo clippy --locked -p umbel --lib --no-default-features --features component -- -D warnings
      - name: Clippy (mounted SDK and hello-mcp)
        run: cargo clippy --locked -p umbel-sdk -p umbel-plugin-hello --features umbel-sdk/mounted,umbel-plugin-hello/mounted --all-targets -- -D warnings
      # The components are built for WASI 0.2, so they are linted for that target too (the host
      # target lints them above as plain crates; wit-bindgen stubs the imports there).
      - name: Clippy (components, wasm32-wasip2)
        run: cargo clippy --locked --target wasm32-wasip2 -p umbel-fixture-behaviors -p umbel-fixture-imports -p umbel-fixture-sockets -p umbel-fixture-future -p umbel-plugin-hello --features umbel-plugin-hello/component -- -D warnings
      # The component-loader tests read hello and the fixture components from
      # target/wasm32-wasip2/release/; no .wasm file is committed.
      - name: Build the components
        run: cargo build --locked --release --target wasm32-wasip2 -p umbel-fixture-behaviors -p umbel-fixture-imports -p umbel-fixture-sockets -p umbel-fixture-future -p umbel-plugin-hello --features umbel-plugin-hello/component
      # A host test cannot use another crate's CARGO_BIN_EXE_*: the mounted-loader tests find
      # hello-mcp in the target directory, next to the test binaries.
      - name: Build hello-mcp
        run: cargo build --locked -p umbel-plugin-hello --features mounted --bin hello-mcp
      - name: Test
        run: cargo test --locked --workspace --exclude umbel-store-embedded

  msrv:
    name: Umbel (MSRV 1.97)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: endpoints/umbel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: endpoints/umbel
          key: msrv
      - name: Check
        run: cargo +1.97.0 check --locked --workspace --exclude umbel-store-embedded --all-targets

  # The knowledge stack's crates (phase 2 specification, section 12): the store traits and the
  # conformance suite, and the embedded backend with its bundled SQLite and tantivy builds. Each
  # later step adds its crates to these commands. Step 3 measured the job cold on the development
  # machine (build 83 s, clippy 20 s, tests 75 s, the wasm and MSRV checks 27 s: about 3.4 minutes
  # at -j4 on a loaded host). Three times that is 10 minutes; the timeout is 15 because the hosted
  # runners are slower than that machine and had not run the job when this was set
  # (specification, "Amendments from step 3", C14).
  knowledge:
    name: Umbel knowledge (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: endpoints/umbel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: endpoints/umbel
          key: knowledge
      - name: Clippy
        run: cargo clippy --locked -p umbel-store -p umbel-store-embedded --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked -p umbel-store -p umbel-store-embedded
      # The traits and types build for WebAssembly components (section 1); the backend does not.
      - name: Check umbel-store (wasm32-wasip2)
        run: cargo check --locked --target wasm32-wasip2 -p umbel-store
      - name: Install Rust 1.97
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Check (MSRV 1.97)
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.97.0 check --locked -p umbel-store -p umbel-store-embedded --all-targets

  # The todo example's conformance suite against Umbel, and AFD's own clients (specification
  # section 13, exit runs 3 and 4 and the external client check).
  conformance:
    name: Umbel (todo conformance, mounted run, AFD clients)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      # Installs the toolchain endpoints/umbel pins; the todo backend pins the same channel.
      - name: Install Rust toolchain
        working-directory: endpoints/umbel
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            endpoints/umbel
            packages/examples/todo/backends/rust
          key: conformance
      - run: pnpm install --frozen-lockfile
      # `afd` (validate, scenario run) is the CLI package's build.
      - name: Build the afd CLI
        run: pnpm -F @lushly-dev/afd-cli... build
      # Run 3: umbel-todo (the umbel command line with the todo plugin compiled in) over
      # Streamable HTTP behind its bearer token.
      - name: Todo conformance (umbel-todo)
        run: pnpm --filter @afd/example-todo test:conformance:umbel
      - name: Todo conformance (umbel-todo, MCP 2026-07-28)
        run: pnpm --filter @afd/example-todo test:conformance:umbel --mode modern
      # Modern only: a 2025 request over stateless HTTP has no back channel for elicitation,
      # so the accept and decline cases need MCP 2026-07-28 (as for the Rust backend).
      - name: Confirmations (umbel-todo, MCP 2026-07-28)
        run: pnpm --filter @afd/example-todo test:conformance:umbel --suite confirmations --mode modern
      # Run 4: the stock umbel binary, with no plugin compiled in, mounts the Rust todo
      # backend over Streamable HTTP from plugins/todo in the workspace.
      - name: Todo conformance (stock umbel, mounted Rust backend)
        run: pnpm --filter @afd/example-todo test:conformance:umbel-mounted
      - name: Todo conformance (stock umbel, mounted Rust backend, MCP 2026-07-28)
        run: pnpm --filter @afd/example-todo test:conformance:umbel-mounted --mode modern
      # `afd validate --surface --strict` and the todo JTBD scenarios against umbel-todo with
      # hello and todo enabled.
      - name: AFD clients (afd validate --surface, afd scenario run)
        run: >
          bash endpoints/umbel/tests/scripts/external-clients.sh
          endpoints/umbel/target/debug/umbel-todo
          packages/cli/dist/bin.js
          packages/examples/todo/scenarios
      - name: Check the working tree is unchanged
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::Running the conformance suites changed the working tree:"
            echo "$changes"
            exit 1
          fi

  # A second plugin needs no host change (specification section 13, exit run 2; review
  # should-fix 12): a pull request may change plugin crates or the host, not both.
  plugin-isolation:
    name: Umbel (plugin isolation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plugins and host code are not in one pull request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          plugins=$(printf '%s\n' "$changed" | grep -E '^endpoints/umbel/plugins/' || true)
          host=$(printf '%s\n' "$changed" | grep -E '^endpoints/umbel/(src|wit|schemas)/' || true)
          if [ -n "$plugins" ] && [ -n "$host" ]; then
            echo "::error::This pull request changes both endpoints/umbel/plugins/ and host code (src/, wit/ or schemas/). Split it: a plugin must not need a host change."
            echo "Plugin files:"; printf '%s\n' "$plugins"
            echo "Host files:"; printf '%s\n' "$host"
            exit 1
          fi
          echo "Plugin files changed: $(printf '%s' "$plugins" | grep -c . || true)"
          echo "Host files changed: $(printf '%s' "$host" | grep -c . || true)"
