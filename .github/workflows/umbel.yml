name: Umbel

on:
  push:
    branches: [main]
    paths:
      - 'endpoints/umbel/**'
      - '!endpoints/umbel/docs/**'
      # Umbel depends on the afd crate by path.
      - 'packages/rust/**'
      # The conformance job runs the todo example's suite and AFD's CLI against Umbel.
      - 'packages/examples/todo/**'
      - 'packages/cli/**'
      # The components plugin's default pack is a byte-equal copy of Specimen's fixture, and its
      # reader is held to Specimen's invalid fixtures (specification, section 4).
      - 'foundations/specimen/fixtures/pack/**'
      - 'foundations/specimen/docs/pack-format.md'
      # Its end-to-end tests serve FAST-AF's committed pack with the catalog export wrote for it
      # (specification, section 12, step C4), so a rebuilt record without a new export fails here.
      - 'foundations/fast-af/packages/violet-elements/pack/**'
      - '.cargo/config.toml'
      - '.github/workflows/umbel.yml'
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/umbel/**'
      - '!endpoints/umbel/docs/**'
      - 'packages/rust/**'
      # The conformance job runs the todo example's suite and AFD's CLI against Umbel.
      - 'packages/examples/todo/**'
      - 'packages/cli/**'
      # The components plugin's default pack is a byte-equal copy of Specimen's fixture, and its
      # reader is held to Specimen's invalid fixtures (specification, section 4).
      - 'foundations/specimen/fixtures/pack/**'
      - 'foundations/specimen/docs/pack-format.md'
      # Its end-to-end tests serve FAST-AF's committed pack with the catalog export wrote for it
      # (specification, section 12, step C4), so a rebuilt record without a new export fails here.
      - 'foundations/fast-af/packages/violet-elements/pack/**'
      - '.cargo/config.toml'
      - '.github/workflows/umbel.yml'
  # The macOS leg and the MSRV check run daily and on demand.
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Every test binary links wasmtime; keep their debug information small enough for the
  # hosted runners' disks.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # A todo example or AFD CLI change runs only the conformance job; the host checks need a change to Umbel, the afd crate or this workflow. Scheduled and manual runs check everything.
    name: Affected units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      host: ${{ steps.host.outputs.run }}
    env:
      AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: host
        run: node scripts/affected.mjs gate --path endpoints/umbel/ --except endpoints/umbel/docs/ --path packages/rust/ --path foundations/specimen/fixtures/pack/ --path foundations/specimen/docs/pack-format.md --path foundations/fast-af/packages/violet-elements/pack/ --path .cargo/config.toml --path .github/workflows/umbel.yml

  check:
    name: Umbel (fmt, clippy, test)
    needs: scope
    if: needs.scope.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: endpoints/umbel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: endpoints/umbel
      - name: Format
        run: cargo fmt --all --check
      # The embedded backend's own tests belong to the `knowledge` job. The host depends on the
      # backend through its default feature `store-embedded` (phase 2 step 4), so this job builds
      # SQLite and tantivy once anyway; `--exclude` only keeps the backend's tests out of it.
      - name: Clippy
        run: cargo clippy --locked --workspace --exclude umbel-store-embedded --all-targets -- -D warnings
      - name: Clippy (library only, no default features)
        run: cargo clippy --locked -p umbel --lib --no-default-features -- -D warnings
      - name: Clippy (library only, mounted loader)
        run: cargo clippy --locked -p umbel --lib --no-default-features --features mounted -- -D warnings
      - name: Clippy (library only, component loader)
        run: cargo clippy --locked -p umbel --lib --no-default-features --features component -- -D warnings
      - name: Clippy (mounted SDK and hello-mcp)
        run: cargo clippy --locked -p umbel-sdk -p umbel-plugin-hello --features umbel-sdk/mounted,umbel-plugin-hello/mounted --all-targets -- -D warnings
      # The components are built for WASI 0.2, so they are linted for that target too (the host
      # target lints them above as plain crates; wit-bindgen stubs the imports there).
      - name: Clippy (components, wasm32-wasip2)
        run: cargo clippy --locked --target wasm32-wasip2 -p umbel-fixture-behaviors -p umbel-fixture-imports -p umbel-fixture-sockets -p umbel-fixture-future -p umbel-plugin-hello --features umbel-plugin-hello/component -- -D warnings
      # The components plugin has no component build until its step D2, so it is linted for the
      # target and not built as a `.wasm` file (specification, section 11).
      - name: Clippy (components plugin, wasm32-wasip2)
        run: cargo clippy --locked --target wasm32-wasip2 -p umbel-plugin-components -- -D warnings
      # The component-loader tests read hello and the fixture components from
      # target/wasm32-wasip2/release/; no .wasm file is committed.
      - name: Build the components
        run: cargo build --locked --release --target wasm32-wasip2 -p umbel-fixture-behaviors -p umbel-fixture-imports -p umbel-fixture-sockets -p umbel-fixture-future -p umbel-plugin-hello --features umbel-plugin-hello/component
      # A host test cannot use another crate's CARGO_BIN_EXE_*: the mounted-loader tests find
      # hello-mcp in the target directory, next to the test binaries.
      - name: Build hello-mcp
        run: cargo build --locked -p umbel-plugin-hello --features mounted --bin hello-mcp
      # --no-fail-fast here and in the other test steps: one failing test binary must not hide the
      # results of the binaries after it.
      - name: Test
        run: cargo test --locked --no-fail-fast --workspace --exclude umbel-store-embedded --exclude umbel-okf --exclude umbel-scan --exclude umbel-plugin-sources-filesystem --exclude umbel-plugin-knowledge --exclude umbel-plugin-memory --exclude umbel-plugin-context --exclude umbel-plugin-components --exclude umbel-plugin-curator --exclude umbel-first-party --exclude umbel-hook

  msrv:
    name: Umbel (MSRV 1.97)
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: endpoints/umbel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.97
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: endpoints/umbel
          key: msrv
      - name: Check
        run: cargo +1.97.0 check --locked --workspace --exclude umbel-store-embedded --all-targets

  # The knowledge stack's crates (phase 2 specification, section 12): the store traits and the
  # conformance suite, and the embedded backend with its bundled SQLite and tantivy builds. Each
  # later step adds its crates to these commands. Step 3 measured the job cold on the development
  # machine (build 83 s, clippy 20 s, tests 75 s, the wasm and MSRV checks 27 s: about 3.4 minutes
  # at -j4 on a loaded host). Three times that is 10 minutes, and the timeout was 15 until the
  # hosted runners had run the job (specification, "Amendments from step 3", C14). They are slower
  # than that: with a cold cache the macOS leg took 12 to 15 minutes on 2026-11-08 to 11-10 and was
  # cancelled at 15 once, and the Linux leg took 13. The timeout is 30, twice the slowest hosted
  # run, so a cold cache no longer fails the job. Phase 3 step 3a's embedded memory store is in
  # `umbel-store-embedded`, so the same `cargo test` runs its `memory_*` tests and `run_all`, which
  # now holds the memory conformance groups. Step 3b's sealing and key-file tests are there too:
  # `cargo test` enables the crate's `testkit` feature (the crash points of section 7.4) through its
  # dev-dependency on itself, and `memory_machine_backup.rs`, the Time Machine exclusion, runs only
  # on macOS, so on the daily and manual macOS leg of this matrix.
  knowledge:
    name: Umbel knowledge (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: endpoints/umbel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: endpoints/umbel
          key: knowledge
      - name: Clippy
        run: cargo clippy --locked -p umbel-store -p umbel-store-embedded -p umbel-okf -p umbel-scan -p umbel-plugin-sources-filesystem -p umbel-plugin-knowledge --all-targets -- -D warnings
      # `eval_gate` runs `knowledge-eval` on the seeded thousand-document fixture, holds the report to
      # the gate and to `plugins/knowledge/eval/baseline.json`, and writes the report here;
      # `exit_thousand` (the phase 2 exit criterion) writes its own report beside it.
      - name: Test
        env:
          UMBEL_EVAL_REPORT: ${{ runner.temp }}/knowledge-eval-report.json
          UMBEL_EXIT_REPORT: ${{ runner.temp }}/knowledge-exit-report.json
        run: cargo test --locked --no-fail-fast -p umbel-store -p umbel-store-embedded -p umbel-okf -p umbel-scan -p umbel-plugin-sources-filesystem -p umbel-plugin-knowledge
      # Without the `code` feature (tree-sitter and its grammars) code collections are plain text.
      - name: Clippy (knowledge without code)
        run: cargo clippy --locked -p umbel-plugin-knowledge --no-default-features --all-targets -- -D warnings
      - name: Test (knowledge without code)
        run: cargo test --locked --no-fail-fast -p umbel-plugin-knowledge --no-default-features
      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knowledge-eval-report-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/knowledge-eval-report.json
            ${{ runner.temp }}/knowledge-exit-report.json
          if-no-files-found: warn
      # The traits and types build for WebAssembly components (section 1); the backend does not.
      - name: Check umbel-store (wasm32-wasip2)
        run: cargo check --locked --target wasm32-wasip2 -p umbel-store
      - name: Install Rust 1.97
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Check (MSRV 1.97)
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.97.0 check --locked -p umbel-store -p umbel-store-embedded -p umbel-okf -p umbel-scan -p umbel-plugin-sources-filesystem -p umbel-plugin-knowledge --all-targets

  # The memory stack's crates (phase 3 specification, section 12): the memory and context
  # plugins, and from phase 4 step 4 the curator, whose tests boot a host with the embedded stores
  # and no loader, so no wasmtime; the `umbel-first-party` binary, the only crate with both (D80),
  # which from phase 4 step 7 links the curator too, and whose `curator_drafts`, `curator_run`,
  # `curator_leaks` and `exit_curator` (the phase 4 exit criterion) run it beside the knowledge
  # plugin; and
  # `umbel-hook`, on serde alone, whose tests run a fixture binary in place of
  # `umbel-first-party`. `cargo fmt` and the
  # workspace clippy are the `check` job's, which leaves these crates' tests to this job; the
  # `check` job's host tests include `tests/default_tools.rs`. Step 8 measured the job's clippy
  # and tests cold at 120 s on the development machine; three times that is six minutes. Hosted
  # runners are slower, as the knowledge job found (C14): the macOS leg took 11 to 13 minutes on
  # 2026-11-08 and 11-09, so the timeout is 30, the knowledge job's.
  memory:
    name: Umbel memory (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.host == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: endpoints/umbel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: endpoints/umbel
          key: memory
      - name: Clippy
        run: cargo clippy --locked -p umbel-plugin-memory -p umbel-plugin-context -p umbel-plugin-components -p umbel-plugin-curator -p umbel-first-party -p umbel-hook --all-targets -- -D warnings
      # `exit_memory` (the phase 3 exit criterion) writes its report here, as the knowledge job's
      # `exit_thousand` does; `leak_probes`, `poisoning` and `forget_bytes` are in the same crate.
      # `exit_curator` (the phase 4 exit criterion) writes its own beside it; `curator_leaks` is
      # in the same crate.
      - name: Test
        env:
          UMBEL_EXIT_REPORT: ${{ runner.temp }}/memory-exit-report.json
          UMBEL_CURATOR_EXIT_REPORT: ${{ runner.temp }}/curator-exit-report.json
        run: cargo test --locked --no-fail-fast -p umbel-plugin-memory -p umbel-plugin-context -p umbel-plugin-components -p umbel-plugin-curator -p umbel-first-party -p umbel-hook
      - name: Upload the exit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memory-exit-report-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/memory-exit-report.json
            ${{ runner.temp }}/curator-exit-report.json
          if-no-files-found: warn
      - name: Install Rust 1.97
        if: matrix.os == 'ubuntu-latest'
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Check (MSRV 1.97)
        if: matrix.os == 'ubuntu-latest'
        run: cargo +1.97.0 check --locked -p umbel-plugin-memory -p umbel-plugin-context -p umbel-plugin-components -p umbel-plugin-curator -p umbel-first-party -p umbel-hook --all-targets

  # The todo example's conformance suite against Umbel, and AFD's own clients (specification
  # section 13, exit runs 3 and 4 and the external client check).
  conformance:
    name: Umbel (todo conformance, mounted run, AFD clients)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      # Installs the toolchain endpoints/umbel pins; the todo backend pins the same channel.
      - name: Install Rust toolchain
        working-directory: endpoints/umbel
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            endpoints/umbel
            packages/examples/todo/backends/rust
          key: conformance
      - run: pnpm install --frozen-lockfile
      # `afd` (validate, scenario run) is the CLI package's build.
      - name: Build the afd CLI
        run: pnpm -F @lushly-dev/afd-cli... build
      # Run 3: umbel-todo (the umbel command line with the todo plugin compiled in) over
      # Streamable HTTP behind its bearer token.
      - name: Todo conformance (umbel-todo)
        run: pnpm --filter @afd/example-todo test:conformance:umbel
      - name: Todo conformance (umbel-todo, MCP 2026-07-28)
        run: pnpm --filter @afd/example-todo test:conformance:umbel --mode modern
      # Modern only: a 2025 request over stateless HTTP has no back channel for elicitation,
      # so the accept and decline cases need MCP 2026-07-28 (as for the Rust backend).
      - name: Confirmations (umbel-todo, MCP 2026-07-28)
        run: pnpm --filter @afd/example-todo test:conformance:umbel --suite confirmations --mode modern
      # Run 4: the stock umbel binary, with no plugin compiled in, mounts the Rust todo
      # backend over Streamable HTTP from plugins/todo in the workspace.
      - name: Todo conformance (stock umbel, mounted Rust backend)
        run: pnpm --filter @afd/example-todo test:conformance:umbel-mounted
      - name: Todo conformance (stock umbel, mounted Rust backend, MCP 2026-07-28)
        run: pnpm --filter @afd/example-todo test:conformance:umbel-mounted --mode modern
      # `afd validate --surface --strict` and the todo JTBD scenarios against umbel-todo with
      # hello and todo enabled.
      - name: AFD clients (afd validate --surface, afd scenario run)
        run: >
          bash endpoints/umbel/tests/scripts/external-clients.sh
          endpoints/umbel/target/debug/umbel-todo
          packages/cli/dist/bin.js
          packages/examples/todo/scenarios
      - name: Check the working tree is unchanged
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::Running the conformance suites changed the working tree:"
            echo "$changes"
            exit 1
          fi

  # A second plugin needs no host change (specification section 13, exit run 2; review
  # should-fix 12): a pull request may change plugin crates or the host, not both.
  plugin-isolation:
    name: Umbel (plugin isolation)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Plugins and host code are not in one pull request
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          plugins=$(printf '%s\n' "$changed" | grep -E '^endpoints/umbel/plugins/' || true)
          host=$(printf '%s\n' "$changed" | grep -E '^endpoints/umbel/(src|wit|schemas)/' || true)
          # A first-party plugin that needs a host service which does not exist yet (the phase 2
          # specification's steps 5 to 8) ships it in the same pull request. The pull request says
          # so on a line of its own: "Plugin-isolation-exempt: <the host change and why>". The rule
          # still holds for a plugin that only uses what the host offers.
          exempt=$(printf '%s\n' "$PR_BODY" | grep -E '^Plugin-isolation-exempt: .+' || true)
          if [ -n "$plugins" ] && [ -n "$host" ] && [ -n "$exempt" ]; then
            echo "This pull request changes plugins and host code, and declares: $exempt"
          elif [ -n "$plugins" ] && [ -n "$host" ]; then
            echo "::error::This pull request changes both endpoints/umbel/plugins/ and host code (src/, wit/ or schemas/). Split it: a plugin must not need a host change."
            echo "Plugin files:"; printf '%s\n' "$plugins"
            echo "Host files:"; printf '%s\n' "$host"
            exit 1
          fi
          echo "Plugin files changed: $(printf '%s' "$plugins" | grep -c . || true)"
          echo "Host files changed: $(printf '%s' "$host" | grep -c . || true)"
