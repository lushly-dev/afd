name: Conformance

# Runs the todo example's shared conformance suite (spec/test-cases.json)
# against the TypeScript, Python and Rust backends, plus each backend's own
# checks. The Python backend installs the repository's python/ package and the
# Rust backend depends on packages/rust, so changes there are checked too.

on:
  push:
    branches: [main]
    paths:
      - 'packages/examples/todo/**'
      - 'packages/server/**'
      - 'packages/core/**'
      - 'packages/rust/**'
      - 'python/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/conformance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/examples/todo/**'
      - 'packages/server/**'
      - 'packages/core/**'
      - 'packages/rust/**'
      - 'python/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/conformance.yml'

permissions:
  contents: read

jobs:
  todo:
    name: Todo conformance (TypeScript + Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      # Sets UV_PYTHON, so every uv command below uses Python 3.12.
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: packages/examples/todo/backends/python/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # --locked fails if uv.lock is stale (for example after a dependency
      # change in python/pyproject.toml); run `uv lock` in the backend to fix.
      - name: Install Python backend
        working-directory: packages/examples/todo/backends/python
        run: uv sync --locked

      - name: Python backend tests
        working-directory: packages/examples/todo/backends/python
        run: uv run --locked pytest -q

      - name: Conformance (TypeScript backend)
        run: pnpm --dir packages/examples/todo test:conformance:ts

      - name: Conformance (Python backend)
        run: pnpm --dir packages/examples/todo test:conformance:py

      # The stores must never write tracked files (data/todos.json is gitignored).
      - name: Check the working tree is unchanged
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::Building and testing the todo example changed the working tree:"
            echo "$changes"
            exit 1
          fi

  todo-rust:
    name: Todo conformance (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CARGO_TERM_COLOR: always

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is preinstalled on GitHub-hosted runners. `rustup toolchain install`
      # (no args) installs the toolchain pinned in the backend's rust-toolchain.toml.
      - name: Install Rust toolchain
        working-directory: packages/examples/todo/backends/rust
        run: rustup toolchain install

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: packages/examples/todo/backends/rust

      - name: Format
        working-directory: packages/examples/todo/backends/rust
        run: cargo fmt --check

      # --locked fails if Cargo.lock is stale (for example after a dependency
      # change in packages/rust); run `cargo build` in the backend and commit
      # the updated Cargo.lock to fix.
      - name: Clippy
        working-directory: packages/examples/todo/backends/rust
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust backend tests
        working-directory: packages/examples/todo/backends/rust
        run: cargo test --locked

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      # The runner needs only tsx and the MCP SDK; no package build is required.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Conformance (Rust backend)
        run: pnpm --dir packages/examples/todo test:conformance:rs

      - name: Check the working tree is unchanged
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "::error::Building and testing the Rust backend changed the working tree:"
            echo "$changes"
            exit 1
          fi
