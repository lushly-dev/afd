name: Python

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'spec/**'
      - '!spec/**/*.md'
      - '.github/workflows/publish-python.yml'
      - 'scripts/python-wheel-smoke.py'
      - '.github/workflows/python.yml'
      - '.github/workflows/queue.yml'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'spec/**'
      - '!spec/**/*.md'
      - '.github/workflows/publish-python.yml'
      - 'scripts/python-wheel-smoke.py'
      - '.github/workflows/python.yml'
      - '.github/workflows/queue.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: python.yml

  test:
    name: Python ${{ matrix.python-version }}
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and the classifiers in python/pyproject.toml.
        python-version: ['3.11', '3.12', '3.13', '3.14']

    defaults:
      run:
        shell: bash
        working-directory: python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sets UV_PYTHON, so every uv command below uses the matrix Python.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Build wheel
        run: uv build

      # Each extra gets a fresh venv with only the wheel and that extra's
      # dependencies, so an import that needs an uninstalled extra fails here.
      - name: Install smoke test (base, client, server, cli, testing)
        run: |
          set -euo pipefail
          wheel=$(ls dist/afd-*.whl)
          for extra in base client server cli testing; do
            echo "::group::afd[$extra]"
            venv="$RUNNER_TEMP/afd-smoke-$extra"
            uv venv "$venv"
            py="$venv/bin/python"
            if [ "$extra" = base ]; then
              uv pip install --python "$py" "$wheel"
            else
              uv pip install --python "$py" "${wheel}[${extra}]"
            fi
            "$py" -I ../scripts/python-wheel-smoke.py "$extra"
            if [ "$extra" = cli ]; then
              "$venv/bin/afd" --help
            fi
            echo "::endgroup::"
          done
