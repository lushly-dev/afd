name: Violet

on:
  push:
    branches: [main]
    paths:
      - 'foundations/violet/**'
      - 'integrations/violet-afd/**'
      - 'endpoints/violet-cli/**'
      - 'endpoints/violet-server/**'
      - 'tests/consumers/violet/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/violet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'foundations/violet/**'
      - 'integrations/violet-afd/**'
      - 'endpoints/violet-cli/**'
      - 'endpoints/violet-server/**'
      - 'tests/consumers/violet/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/violet.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # Triggered by a shared input such as pnpm-lock.yaml, the suites below run only when the
    # change reaches their packages (scripts/affected.mjs). Manual runs check everything.
    name: Affected units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.run.outputs.run }}
    env:
      AFD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: run
        run: node scripts/affected.mjs gate --package @lushly-dev/violet-core --package @lushly-dev/violet-runtime --package @lushly-dev/violet-afd --package @lushly-dev/violet-cli --package @lushly-dev/violet-server --path tests/consumers/violet/ --path .github/workflows/violet.yml

  suites-and-consumers:
    name: Violet full suites, upstream lint and packed consumers
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Local stores only here; the stores job runs the Postgres and Neon driver legs.
      VIOLET_TEST_POSTGRES: ''
      VIOLET_TEST_POSTGRES_URL: ''
      VIOLET_NEON_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (AFD core is packed for the AFD 2.x consumer case)
        run: pnpm -F "@lushly-dev/violet-cli..." -F @lushly-dev/violet-runtime -F @lushly-dev/afd-core build
      - name: Build leaves tracked files unchanged
        run: |
          git diff --exit-code -- foundations/violet integrations/violet-afd endpoints/violet-cli endpoints/violet-server
          test -z "$(git status --porcelain -- foundations/violet integrations/violet-afd endpoints/violet-cli endpoints/violet-server)"
      - name: Upstream Biome 1.9 lint
        run: pnpm -F @lushly-dev/violet-core -F @lushly-dev/violet-runtime -F @lushly-dev/violet-afd -F @lushly-dev/violet-cli -F @lushly-dev/violet-server lint
      - name: Full core and integration suites, including the SQLite store legs
        run: pnpm -F @lushly-dev/violet-core -F @lushly-dev/violet-afd test:db
      - name: Runtime, CLI and server suites
        run: pnpm -F @lushly-dev/violet-runtime -F @lushly-dev/violet-cli -F @lushly-dev/violet-server test
      - run: pnpm -F @lushly-dev/specimen exec playwright install --with-deps chromium
      - name: Packed-artifact consumers outside the workspace
        run: node tests/consumers/violet/verify-artifacts.mjs --output "$RUNNER_TEMP/violet-receipt"
      - name: Upload consumer receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: violet-artifact-receipt
          path: ${{ runner.temp }}/violet-receipt/
          retention-days: 7

  stores:
    name: Postgres and Neon driver store legs
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:31ba9c94a03ada9988f2bb493a22a75eef3a185884533e5cdbcd498ea835b08f # 17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Fail instead of skipping when the URL is missing.
      VIOLET_TEST_POSTGRES: required
      VIOLET_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The Neon leg runs the real Neon driver through an in-process WebSocket proxy to this
      # Postgres (src/db/neon-local.test-support.ts); hosted Neon is not exercised.
      VIOLET_NEON_LOCAL_PROXY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F "@lushly-dev/violet-afd..." build
      - name: Core and integration suites on Postgres and the Neon driver
        run: pnpm -F @lushly-dev/violet-core -F @lushly-dev/violet-afd test:db
