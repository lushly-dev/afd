# Publish the Rust crate to crates.io
#
# Triggers on a pushed tag matching 'rust-v*' (e.g., rust-v0.1.0). The tag must
# match `version` in packages/rust/Cargo.toml.
#
# Runs the same checks as rust.yml, then publishes with crates.io trusted
# publishing (OIDC): rust-lang/crates-io-auth-action exchanges the job's GitHub
# OIDC token for a short-lived crates.io token and revokes it when the job ends.
# No long-lived token is stored.
#
# crates.io offers trusted publishing only for a crate that already exists, so
# the first release is published by hand (see the do-release skill). Then add a
# trusted publisher in the crate's settings on crates.io:
#   - Repository owner: lushly-dev
#   - Repository name: afd
#   - Workflow filename: publish-rust.yml
#   - Environment: crates-io
#
# A version that is already on crates.io is not uploaded again, so the tag of a
# hand-published release, or a re-run, passes its checks without publishing.
#
name: Publish Rust Crate

on:
  push:
    tags:
      - 'rust-v*'

permissions:
  contents: read

jobs:
  version:
    name: Validate version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version matches tag
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#rust-v}"
          CARGO_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "Tag version: $TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch: the tag is $TAG_VERSION but Cargo.toml is $CARGO_VERSION"
            exit 1
          fi
          echo "version=$CARGO_VERSION" >> "$GITHUB_OUTPUT"

  check:
    name: Rust checks
    needs: version
    uses: ./.github/workflows/rust.yml

  publish:
    name: Publish to crates.io
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/afd
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether crates.io has this version
        id: registry
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent 'lushly-dev/afd publish-rust.yml (https://github.com/lushly-dev/afd)' \
            "https://crates.io/api/v1/crates/afd/$VERSION")
          case "$STATUS" in
            200)
              echo "::notice::afd $VERSION is already on crates.io; nothing to publish."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered HTTP $STATUS for afd $VERSION"
              exit 1
              ;;
          esac

      # rustup is preinstalled on GitHub-hosted runners; this installs the
      # toolchain pinned in packages/rust/rust-toolchain.toml.
      - name: Install Rust toolchain
        if: steps.registry.outputs.published == 'false'
        run: rustup toolchain install

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.registry.outputs.published == 'false'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
