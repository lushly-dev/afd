# Publish the Rust crate to crates.io
#
# Triggers on a pushed tag matching 'rust-v*' (e.g., rust-v0.1.0). The tag must
# match `version` in packages/rust/Cargo.toml.
#
# Runs the same checks as rust.yml, then publishes with crates.io trusted
# publishing (OIDC): rust-lang/crates-io-auth-action exchanges the job's GitHub
# OIDC token for a short-lived crates.io token and revokes it when the job ends.
# No long-lived token is stored.
#
# afd 0.1.0 is published and the GitHub trusted publisher is configured.
# Subsequent versions use that existing publisher; no bootstrap token is needed.
# Publisher identity:
#   - Repository owner: lushly-dev
#   - Repository name: afd
#   - Workflow filename: publish-rust.yml
#   - Environment: crates-io
#
# A version that is already on crates.io is not uploaded again, so the tag of a
# hand-published release, or a re-run, passes its checks without publishing.
#
name: Publish Rust Crate

on:
  push:
    tags:
      - 'rust-v*'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  version:
    name: Validate version matches tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate version matches tag
        id: version
        run: |
          python ../../scripts/release-native.py --root ../.. --unit afd-rust --route crates-tag --tag "$RELEASE_TAG"
          echo "version=${RELEASE_TAG#rust-v}" >> "$GITHUB_OUTPUT"

  check:
    name: Rust checks
    needs: version
    uses: ./.github/workflows/rust.yml

  publish:
    name: Publish to crates.io
    needs: [version, check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: crates-io
      url: https://crates.io/crates/afd
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate publish admission before registry lookup
        run: >-
          python ../../scripts/release-native.py --root ../..
          --unit afd-rust --route crates-tag --tag "$RELEASE_TAG"

      - name: Check whether crates.io has this version
        id: registry
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user-agent 'lushly-dev/afd publish-rust.yml (https://github.com/lushly-dev/afd)' \
            "https://crates.io/api/v1/crates/afd/$VERSION")
          case "$STATUS" in
            200)
              echo "::notice::afd $VERSION is already on crates.io; nothing to publish."
              echo "published=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "published=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::crates.io answered HTTP $STATUS for afd $VERSION"
              exit 1
              ;;
          esac

      # rustup is preinstalled on GitHub-hosted runners; this installs the
      # toolchain pinned in packages/rust/rust-toolchain.toml.
      - name: Install Rust toolchain
        if: steps.registry.outputs.published == 'false'
        run: rustup toolchain install

      - name: Package and inspect the candidate before authentication
        if: steps.registry.outputs.published == 'false'
        id: package
        run: |
          cargo package --registry crates-io
          ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/afd-rust-package.XXXXXX")
          cp "target/package/afd-${RELEASE_TAG#rust-v}.crate" "$ARTIFACT_DIR/"
          python ../../scripts/release-native.py --root ../.. --unit afd-rust --route crates-tag --tag "$RELEASE_TAG" --artifacts "$ARTIFACT_DIR" --receipt "$RUNNER_TEMP/native-rust-receipt.json"
          echo "directory=$ARTIFACT_DIR" >> "$GITHUB_OUTPUT"

      - name: Authenticate with crates.io
        if: steps.registry.outputs.published == 'false'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.registry.outputs.published == 'false'
        env:
          ARTIFACT_DIR: ${{ steps.package.outputs.directory }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          python ../../scripts/release-native.py --root ../.. --unit afd-rust --route crates-tag --tag "$RELEASE_TAG" --artifacts "$ARTIFACT_DIR" --verify-receipt "$RUNNER_TEMP/native-rust-receipt.json"
          # Cargo repackages the checked source; this receipt is inspection trace,
          # not evidence that these exact archive bytes reached the registry.
          cargo publish --registry crates-io
