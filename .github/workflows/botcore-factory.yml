name: Botcore factory

# The software factory plugin (endpoints/botcore/plugins/botcore-factory) has its own gate:
# botcore.yml tests Botcore's core and builds its other distributions, but runs no plugin's
# tests. The plugin's pytest includes the proposal's jobs run through AFD's TypeScript scenario
# runner, so it also runs when the runner, the jobs, the label rules or AFD's adapter change.
on:
  push:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'packages/core/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - 'docs/features/proposed/software-factory/scenarios/**'
      - 'scripts/issue-labels.mjs'
      - '.github/labels.json'
      - 'botcore.toml'
      - '.github/workflows/botcore-factory.yml'
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'packages/core/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - 'docs/features/proposed/software-factory/scenarios/**'
      - 'scripts/issue-labels.mjs'
      - '.github/labels.json'
      - 'botcore.toml'
      - '.github/workflows/botcore-factory.yml'

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: Plugin (lint, unit tests, jobs through the scenario runner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: endpoints/botcore/plugins/botcore-factory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build AFD's scenario runner
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm -F "@lushly-dev/afd-testing..." build
      - name: Verify lock and install the plugin's development environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests
      - name: Test (units, and the jobs through AFD's TypeScript scenario runner)
        run: uv run --frozen pytest -q
