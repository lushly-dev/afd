name: Botcore factory

# The software factory plugin (endpoints/botcore/plugins/botcore-factory) has its own gate:
# botcore.yml tests Botcore's core, its sibling packages and its other plugins, and builds its
# distributions, but not this plugin, which has its own lock file. The plugin's pytest includes
# the proposal's jobs run through AFD's TypeScript scenario runner, so it also runs when the
# runner, the jobs, the label rules or AFD's adapter change. The lane runs on macOS and Windows
# hosts as well as Linux, and its state and locks are files that each platform treats in its
# own way, so the suite (the multi-process lock tests included) runs on all three.
on:
  push:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'packages/core/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - 'scripts/check-test-*.mjs'
      - 'scripts/discovery-parsers.mjs'
      - 'scripts/report-test-changes.mjs'
      - 'docs/features/active/software-factory/scenarios/**'
      - 'scripts/issue-labels.mjs'
      - 'scripts/pre-push.mjs'
      - 'scripts/verify-record.mjs'
      - 'scripts/affected/**'
      - 'scripts/release/exec-tool.mjs'
      - '.github/labels.json'
      - 'botcore.toml'
      - '.github/workflows/botcore-factory.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'packages/core/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - 'scripts/check-test-*.mjs'
      - 'scripts/discovery-parsers.mjs'
      - 'scripts/report-test-changes.mjs'
      - 'docs/features/active/software-factory/scenarios/**'
      - 'scripts/issue-labels.mjs'
      - 'scripts/pre-push.mjs'
      - 'scripts/verify-record.mjs'
      - 'scripts/affected/**'
      - 'scripts/release/exec-tool.mjs'
      - '.github/labels.json'
      - 'botcore.toml'
      - '.github/workflows/botcore-factory.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: botcore-factory.yml

  plugin:
    name: Plugin on ${{ matrix.os }}, Python ${{ matrix.python }} (lint, unit tests, jobs through the scenario runner)
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Each platform reports its own result: a Linux failure must not hide a Windows one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    defaults:
      run:
        # Git Bash on Windows: PowerShell would let an early failing line in a step pass.
        shell: bash
        working-directory: endpoints/botcore/plugins/botcore-factory
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: endpoints/botcore/plugins/botcore-factory/uv.lock
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Build AFD's scenario runner
        working-directory: .
        run: pnpm -F "@lushly-dev/afd-testing..." build
      - name: Verify lock and install the plugin's development environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Lint
        # The same files on every platform: once is enough.
        if: runner.os == 'Linux'
        run: |
          uv run --frozen ruff check src tests
          uv run --frozen ruff format --check src tests
      - name: Test (units, and the jobs through AFD's TypeScript scenario runner)
        run: uv run --frozen pytest -q
