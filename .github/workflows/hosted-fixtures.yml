name: Local hosted-test fixtures

on:
  push:
    branches: [main]
    paths:
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'packages/view-state/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'scripts/run-hosted-local.mjs'
      - 'scripts/hosted/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hosted-fixtures.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'packages/view-state/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'scripts/run-hosted-local.mjs'
      - 'scripts/hosted/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/hosted-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    name: HTTPS/OAuth, durable REST and Convex fixture checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @lushly-dev/afd-auth exec playwright install --with-deps chromium
      # No external endpoints, provider accounts or hosted secrets are configured.
      - run: pnpm test:hosted:local
