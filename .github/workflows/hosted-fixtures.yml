name: Local hosted-test fixtures

on:
  push:
    branches: [main]
    paths:
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'packages/view-state/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/playwright-install/**'
      - 'scripts/run-hosted-local.mjs'
      - 'scripts/release/exec-tool.mjs'
      - 'scripts/hosted/**'
      - 'package.json'
      - '.github/workflows/hosted-fixtures.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'packages/view-state/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/playwright-install/**'
      - 'scripts/run-hosted-local.mjs'
      - 'scripts/release/exec-tool.mjs'
      - 'scripts/hosted/**'
      - 'package.json'
      - '.github/workflows/hosted-fixtures.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: hosted-fixtures.yml

  local:
    name: HTTPS/OAuth, durable REST and Convex fixture checks
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      # Under a minute as a rule; apt held this step for 50 when a runner could not resolve Ubuntu's mirrors.
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/afd-auth'
        timeout-minutes: 10
      # No external endpoints, provider accounts or hosted secrets are configured.
      - run: pnpm test:hosted:local
