name: FAST-AF

on:
  push:
    branches: [main]
    paths:
      - 'foundations/fast-af/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/playwright-install/**'
      - 'tests/consumers/fast-af/**'
      - 'scripts/release/exec-tool.mjs'
      - 'scripts/codemods/split-define.mjs'
      - 'foundations/violet/packages/runtime/src/property.ts'
      - '.github/workflows/fast-af.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'foundations/fast-af/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/playwright-install/**'
      - 'tests/consumers/fast-af/**'
      - 'scripts/release/exec-tool.mjs'
      - 'scripts/codemods/split-define.mjs'
      - 'foundations/violet/packages/runtime/src/property.ts'
      - '.github/workflows/fast-af.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # fast-element's Firefox and WebKit suites run daily and on demand; pull requests and pushes
  # run its Playwright suites on Chromium.
  schedule:
    - cron: '11 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Upstream FAST-AF setting: force a Chromium GC after each Vitest browser file so shared-memory
  # files do not accumulate in /tmp during the component suite.
  VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '1000'

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: fast-af.yml

  scope:
    # Triggered by a shared input such as pnpm-lock.yaml, the suites below run only when the
    # change reaches their packages (scripts/affected.mjs). Manual runs check everything.
    name: Affected units
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.runtime.outputs.run }}
      components: ${{ steps.components.outputs.run }}
    env:
      AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: runtime
        run: node scripts/affected.mjs gate --package @lushly-dev/fast-element --path .github/workflows/fast-af.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/
      - id: components
        run: node scripts/affected.mjs gate --package @lushly-dev/violet-elements --path foundations/violet/packages/runtime/src/property.ts --path tests/consumers/fast-af/ --path scripts/release/exec-tool.mjs --path .github/workflows/fast-af.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/

  runtime:
    name: fast-element build, migration rules and browser suites
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    # Upstream reports 23-36 minutes for this scope on healthy runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build (exports, types, bundles, API reports)
        run: pnpm -F @lushly-dev/fast-element build
      - name: Build leaves tracked sources and API reports unchanged
        run: git diff --exit-code -- foundations/fast-af && test -z "$(git status --porcelain -- foundations/fast-af)"
      # Under a minute as a rule; apt held this step for 50 when a runner could not resolve Ubuntu's mirrors.
      - name: Install Playwright browsers
        timeout-minutes: 10
        uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/fast-element'
          browsers: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium firefox webkit' || 'chromium' }}
      - name: Upstream test:ci (docs, API reports, exports, types, migration rules, Playwright on three browsers)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: pnpm -F @lushly-dev/fast-element test:ci
      - name: Upstream test:ci checks, with the Playwright suites on Chromium
        if: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        working-directory: foundations/fast-af/packages/element/packages/fast-element
        # test:ci with test:chromium in place of test:playwright.
        run: |
          for script in doc:path-exports:check doc:ci doc:exports:ci test:exports test:types test:migration-rules test:chromium; do
            pnpm run "$script"
          done

  components:
    name: violet-elements browser suites, generated artifacts and packed consumers
    needs: scope
    if: needs.scope.outputs.components == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm -F "@lushly-dev/violet-elements..." build
      - name: Type-check component specs (stories are checked by Specimen)
        run: pnpm -F @lushly-dev/violet-elements typecheck
      - name: Packed package exports, contents and source maps (upstream check:v3 violet scope)
        run: pnpm -F @lushly-dev/violet-elements verify:exports
      - name: Regenerated theme, icons and custom-elements manifest match the tracked files
        run: |
          pnpm -F @lushly-dev/violet-elements theme:build
          pnpm -F @lushly-dev/violet-elements icons:build
          pnpm -F @lushly-dev/violet-elements cem:analyze
          git diff --exit-code -- foundations/fast-af
          test -z "$(git status --porcelain -- foundations/fast-af)"
      - run: pnpm -F @lushly-dev/violet-elements lint
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/violet-elements'
          browsers: chromium firefox webkit
        timeout-minutes: 10
      - name: Component browser suite with coverage thresholds (Chromium)
        run: pnpm -F @lushly-dev/violet-elements test:browser
      - name: Component browser suite (Firefox)
        run: pnpm -F @lushly-dev/violet-elements test:browser:firefox
      - name: Component browser suite (WebKit)
        run: pnpm -F @lushly-dev/violet-elements test:browser:webkit
      - name: Packed-artifact consumers outside the workspace
        run: node tests/consumers/fast-af/verify-artifacts.mjs --browser chromium --output "$RUNNER_TEMP/fast-af-receipt"
      - name: Upload consumer receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-af-artifact-receipt
          path: ${{ runner.temp }}/fast-af-receipt/
          retention-days: 7
