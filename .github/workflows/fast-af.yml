name: FAST-AF

on:
  push:
    branches: [main]
    paths:
      - 'foundations/fast-af/**'
      - 'tests/consumers/fast-af/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/fast-af.yml'
  pull_request:
    branches: [main]
    paths:
      - 'foundations/fast-af/**'
      - 'tests/consumers/fast-af/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/fast-af.yml'
  # fast-element's Firefox and WebKit suites run daily and on demand; pull requests and pushes
  # run its Playwright suites on Chromium.
  schedule:
    - cron: '11 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Upstream FAST-AF setting: force a Chromium GC after each Vitest browser file so shared-memory
  # files do not accumulate in /tmp during the component suite.
  VITEST_CHROMIUM_GC_DISK_THRESHOLD_GB: '1000'

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # Triggered by a shared input such as pnpm-lock.yaml, the suites below run only when the
    # change reaches their packages (scripts/affected.mjs). Manual runs check everything.
    name: Affected units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.runtime.outputs.run }}
      components: ${{ steps.components.outputs.run }}
    env:
      AFD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: runtime
        run: node scripts/affected.mjs gate --package @lushly-dev/fast-element --path .github/workflows/fast-af.yml
      - id: components
        run: node scripts/affected.mjs gate --package @lushly-dev/violet-elements --path tests/consumers/fast-af/ --path .github/workflows/fast-af.yml

  runtime:
    name: fast-element build, migration rules and browser suites
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    # Upstream reports 23-36 minutes for this scope on healthy runners.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (exports, types, bundles, API reports)
        run: pnpm -F @lushly-dev/fast-element build
      - name: Build leaves tracked sources and API reports unchanged
        run: git diff --exit-code -- foundations/fast-af && test -z "$(git status --porcelain -- foundations/fast-af)"
      - name: Install Playwright browsers
        run: >-
          pnpm -F @lushly-dev/fast-element exec playwright install --with-deps
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'chromium firefox webkit' || 'chromium' }}
      - name: Upstream test:ci (docs, API reports, exports, types, migration rules, Playwright on three browsers)
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: pnpm -F @lushly-dev/fast-element test:ci
      - name: Upstream test:ci checks, with the Playwright suites on Chromium
        if: ${{ !(github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        working-directory: foundations/fast-af/packages/element/packages/fast-element
        # test:ci with test:chromium in place of test:playwright.
        run: |
          for script in doc:path-exports:check doc:ci doc:exports:ci test:exports test:types test:migration-rules test:chromium; do
            pnpm run "$script"
          done

  components:
    name: violet-elements Chromium suite, generated artifacts and packed consumers
    needs: scope
    if: needs.scope.outputs.components == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F "@lushly-dev/violet-elements..." build
      - name: Packed package exports, contents and source maps (upstream check:v3 violet scope)
        run: pnpm -F @lushly-dev/violet-elements verify:exports
      - name: Regenerated theme, icons and custom-elements manifest match the tracked files
        run: |
          pnpm -F @lushly-dev/violet-elements theme:build
          pnpm -F @lushly-dev/violet-elements icons:build
          pnpm -F @lushly-dev/violet-elements cem:analyze
          git diff --exit-code -- foundations/fast-af
          test -z "$(git status --porcelain -- foundations/fast-af)"
      - run: pnpm -F @lushly-dev/violet-elements lint
      - run: pnpm -F @lushly-dev/violet-elements exec playwright install --with-deps chromium
      - name: Component browser suite with coverage thresholds
        run: pnpm -F @lushly-dev/violet-elements test:browser
      - name: Packed-artifact consumers outside the workspace
        run: node tests/consumers/fast-af/verify-artifacts.mjs --browser chromium --output "$RUNNER_TEMP/fast-af-receipt"
      - name: Upload consumer receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fast-af-artifact-receipt
          path: ${{ runner.temp }}/fast-af-receipt/
          retention-days: 7
