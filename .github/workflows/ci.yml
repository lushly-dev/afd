name: CI

# Pull requests and pushes build, typecheck and test only the workspace packages the change
# affects (scripts/affected.mjs: owning packages, their dependents, and lockfile changes by
# importer); lint and the repository-wide checks always run. The daily schedule and manual runs
# check the whole workspace, catching anything the change analysis cannot see.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Pull requests and pushes test the .nvmrc version; the daily and manual whole-workspace
        # runs add the older supported versions.
        node-version: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["22.x", "24.x", "26.x"]' || '["26.x"]') }}

    env:
      AFD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'affected' || 'all' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History (without blobs) to diff against the base.
          fetch-depth: 0
          filter: blob:none

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Affected packages
        run: node scripts/affected.mjs list

      - name: Quality gate
        run: pnpm check

      - name: Upload coverage
        # Keep the daily whole-workspace baseline and failure diagnostics; scoped runs are partial.
        if: >-
          ${{ !cancelled() && matrix.node-version == '26.x' &&
          (github.event_name == 'schedule' || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: packages/*/coverage/
          retention-days: 7
