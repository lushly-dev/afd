name: CI

# Pull requests and pushes build, typecheck and test only the workspace packages the change
# affects (scripts/affected.mjs: owning packages, their dependents, and lockfile changes by
# importer); lint and the repository-wide checks always run. The daily schedule and manual runs
# check the whole workspace, catching anything the change analysis cannot see. A pull request checks
# out its merge ref, whose first parent is main as merged, not the older pull_request.base.sha.
# A merge group is checked as a pull request is, against the commit the queue built it on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            package.json
            commitlint.config.js
            scripts/check-pr-title.mjs
          sparse-checkout-cone-mode: false
      - name: Lint pull request title as commit subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-pr-title.mjs

  lint-and-test:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # Pull requests and pushes test the .nvmrc version; the daily and manual whole-workspace
        # runs add the older supported versions.
        node-version: >-
          ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && '["22.x", "24.x", "26.x"]' || '["26.x"]') }}

    env:
      AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && 'affected' || 'all' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # History (without blobs) to diff against the base.
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ matrix.node-version }}

      - name: Affected packages
        run: node scripts/affected.mjs list

      - name: Quality gate
        run: pnpm check

      - name: Upload coverage
        # Keep the daily whole-workspace baseline and failure diagnostics; scoped runs are partial.
        if: >-
          ${{ !cancelled() && matrix.node-version == '26.x' &&
          (github.event_name == 'schedule' || failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: packages/*/coverage/
          retention-days: 7
