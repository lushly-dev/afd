name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    # The page runs afd-core in the browser, so a core change redeploys it too.
    paths: ['site/**', 'packages/core/**', 'scripts/build-site-runtime.mjs']
  # Redeploy after each release so the stamped version picks up what was published.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm

      # The site's live demos run the real afd-core registry in the browser.
      # Rebuild that bundle from this commit so it always matches the source.
      - name: Build the site's afd-core bundle
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @lushly-dev/afd-core build
          node scripts/build-site-runtime.mjs

      # Stamp the version npm actually serves into llms.txt (and any
      # data-afd-version element), so it matches what `npm install` gives people.
      - name: Stamp published version
        run: |
          version=$(npm view @lushly-dev/afd-core version)
          sed -i -E "s|(data-afd-version>)[^<]*|\1v${version}|g" site/index.html
          if [ -f site/llms.txt ]; then sed -i -E "s|^(Version: )v.*|\1v${version}|" site/llms.txt; fi

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
