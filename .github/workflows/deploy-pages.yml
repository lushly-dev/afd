name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    # The page runs afd-core in the browser, so a core change redeploys it too.
    paths: ['site/**', 'packages/core/**', 'scripts/build-site-runtime.mjs']
  # Redeploy after each release so the stamped version picks up what was published.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # The site's live demos run the real afd-core registry in the browser.
      # Rebuild that bundle from this commit so it always matches the source.
      - name: Build the site's afd-core bundle
        run: |
          pnpm -F @lushly-dev/afd-core build
          node scripts/build-site-runtime.mjs

      # Stamp the version npm actually serves into llms.txt (and any
      # data-afd-version element), so it matches what `npm install` gives people.
      - name: Stamp published version
        run: |
          version=$(npm view @lushly-dev/afd-core version)
          sed -i -E "s|(data-afd-version>)[^<]*|\1v${version}|g" site/index.html
          if [ -f site/llms.txt ]; then sed -i -E "s|^(Version: )v.*|\1v${version}|" site/llms.txt; fi
          # The degit commands that teach a coding agent AFD pin the skill to a release tag; point
          # them at the release just published (#2689).
          sed -i -E "s|(skills/afd#@lushly-dev/afd-core@)[0-9][0-9A-Za-z.+-]*|\1${version}|g" \
            site/index.html site/js/runtime.js site/llms.txt

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
