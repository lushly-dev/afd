name: Main credit

# Every commit that lands on main credits only its author: no Co-authored-by line, a person's
# included, except one naming that author by the same address. ci-ok checks a pull request's own
# commits and the commits its merge group holds, before they land; this checks what did land, so a
# commit that went around the queue, or a merge method that writes its own message (a squash adds
# a Co-authored-by line for every commit author whose address isn't the merging account's), is
# still caught (scripts/commit-credit.mjs --push-event). Main is not rewritten, so a failure here
# means fixing the path that wrote it.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  main-credit:
    name: main-credit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/commit-credit.mjs
          sparse-checkout-cone-mode: false

      - name: Check the pushed commits' credit
        run: node scripts/commit-credit.mjs --push-event
