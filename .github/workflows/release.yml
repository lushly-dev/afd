name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery_approval:
        description: SHA-256 of the reviewed .release/npm-recovery.json
        required: true
        type: string

# A group keeps one pending run, and a newer run replaces it. So a recovery dispatch has a group of
# its own: in the pushes' group, a push to main cancelled a recovery that was waiting behind an
# earlier push's run (twice on 2026-11-11). The group is not what keeps two runs from publishing.
# The durable claim is: a push run stops at a failed or pending claim, and a recovery takes over
# only the exact failed claim its approval names.
concurrency: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-recovery' || '' }}

# `pnpm install` installs the lefthook git hooks, and the Changesets action pushes the release
# branch: the pre-push hook would run package tests against unbuilt output on the runner.
env:
  LEFTHOOK: '0'

jobs:
  # An approved release of Specimen publishes its prebuilt native hosts with the core, at its
  # version, and each must be built on its own platform. This reads the same committed intent the
  # release job does and decides only whether to build them; the release job decides again and
  # fails if a host it needs is missing.
  hosts-needed:
    if: github.event_name == 'push'
    name: Select prebuilt hosts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      specimen: ${{ steps.intent.outputs.specimen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect approved npm release intent
        id: intent
        run: |
          node scripts/release-control.mjs intent-status --output "$RUNNER_TEMP/npm-intent-status.json"
          node --input-type=module -e 'import fs from "node:fs"; const status = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-intent-status.json`)); fs.appendFileSync(process.env.GITHUB_OUTPUT, `specimen=${status.publishable && status.selectedUnits.includes("specimen")}\n`);'

  # Built on the images specimen.yml's host-packages job checks them on (Linux links glibc 2.35),
  # with no build cache, and staged through stage.mjs, which reads each binary's header.
  specimen-hosts:
    needs: hosts-needed
    if: needs.hosts-needed.outputs.specimen == 'true'
    name: Specimen host (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-22.04
          - platform: linux-arm64-gnu
            os: ubuntu-22.04-arm
          - platform: darwin-arm64
            os: macos-15
          - platform: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Install Rust toolchain
        working-directory: foundations/specimen/host
        run: rustup toolchain install
      - name: Native host release build
        working-directory: foundations/specimen/host
        run: cargo build --release --locked
      - name: Stage and check the host
        run: node foundations/specimen/host/stage.mjs ${{ matrix.platform }}
      - name: Upload the host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: specimen-host-binary-${{ matrix.platform }}
          path: foundations/specimen/packages/host-${{ matrix.platform }}/bin/specimen-host
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [hosts-needed, specimen-hosts]
    # Runs when no host was needed, and never after a host build failed.
    if: >-
      github.event_name == 'push' && !cancelled() &&
      needs.hosts-needed.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.specimen-hosts.result)
    name: Version or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      statuses: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Inspect durable publication claim
        id: claim-status
        run: |
          node scripts/release-claim.mjs inspect --output "$RUNNER_TEMP/npm-claim-status.json"
          node --input-type=module -e 'import fs from "node:fs"; const claim = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-claim-status.json`)); fs.appendFileSync(process.env.GITHUB_OUTPUT, `state=${claim.state}\n`);'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect approved npm release intent
        id: intent
        run: |
          node scripts/release-control.mjs intent-status --output "$RUNNER_TEMP/npm-intent-status.json"
          node --input-type=module -e 'import fs from "node:fs"; const status = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-intent-status.json`)); const claim = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-claim-status.json`)); if (status.state === "fulfilled" && claim.state !== "succeeded") throw new Error("Publication held: registry versions exist without verified finalization"); if (status.publishable && claim.state === "succeeded") throw new Error("Publication held: completed claim disagrees with registry"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `publishable=${status.publishable}\nspecimen=${status.publishable && status.selectedUnits.includes("specimen")}\n`);'

      # Publication is irreversible, so run the complete gate over the whole workspace first.
      # Pushes without an approved publication need no gate here: ci.yml checked the change.
      - name: Quality gate
        if: steps.intent.outputs.publishable == 'true'
        run: pnpm check:all

      - name: Download the prebuilt Specimen hosts
        if: steps.intent.outputs.specimen == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: specimen-host-binary-*
          path: ${{ runner.temp }}/specimen-hosts

      # Each platform package's prepack checks its host again, so none can be packed without one.
      - name: Stage the prebuilt Specimen hosts
        if: steps.intent.outputs.specimen == 'true'
        run: |
          for platform in linux-x64-gnu linux-arm64-gnu darwin-arm64 darwin-x64; do
            node foundations/specimen/host/stage.mjs "$platform" --binary "$RUNNER_TEMP/specimen-hosts/specimen-host-binary-$platform/specimen-host"
          done

      - name: Plan approved npm artifacts
        if: steps.intent.outputs.publishable == 'true'
        run: pnpm release:plan --plan "$RUNNER_TEMP/npm-plan.json"

      - name: Configure release tag author
        if: steps.intent.outputs.publishable == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Acquire durable publication claim
        id: claim
        if: steps.intent.outputs.publishable == 'true'
        run: node scripts/release-claim.mjs acquire --output "$RUNNER_TEMP/npm-claim.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish approved npm artifacts
        id: publish
        if: steps.intent.outputs.publishable == 'true'
        run: pnpm publish:npm --plan "$RUNNER_TEMP/npm-plan.json" --receipt "$RUNNER_TEMP/npm-publication.json"
        env:
          NPM_CONFIG_PROVENANCE: true

      # GITHUB_TOKEN cannot create a ref at a commit whose workflow files differ from main's, which a
      # workflow change merged during the release causes (#952). This token is created late and
      # reaches only the next step. Without the App, or if the token cannot be created, the push
      # uses GITHUB_TOKEN as before.
      - name: Create release tag token
        id: tag-token
        if: steps.intent.outputs.publishable == 'true' && vars.RELEASE_TAG_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_TAG_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_TAG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Push release tags and create GitHub Releases
        if: steps.intent.outputs.publishable == 'true'
        run: |
          if [ -n "$TAG_TOKEN" ]; then
            # The empty value drops the credential actions/checkout stored; git sends only the App's.
            credential=$(printf 'x-access-token:%s' "$TAG_TOKEN" | base64 -w0)
            echo "::add-mask::$credential"
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0=
            export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $credential"
          fi
          node scripts/release-finalize.mjs "$RUNNER_TEMP/npm-publication.json" "$RUNNER_TEMP/npm-plan.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_TOKEN: ${{ steps.tag-token.outputs.token }}

      - name: Complete durable publication claim
        id: complete
        if: steps.intent.outputs.publishable == 'true'
        run: node scripts/release-claim.mjs complete --claim "$RUNNER_TEMP/npm-claim.json" --plan "$RUNNER_TEMP/npm-plan.json" --receipt "$RUNNER_TEMP/npm-publication.json" --output "$RUNNER_TEMP/npm-claim-result.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hold failed publication claim
        if: ${{ failure() && steps.claim.outcome == 'success' && steps.complete.outcome != 'success' }}
        run: node scripts/release-claim.mjs fail --claim "$RUNNER_TEMP/npm-claim.json" --output "$RUNNER_TEMP/npm-claim-result.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retain npm publication evidence
        if: ${{ !cancelled() && steps.intent.outputs.publishable == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-plan.json
            ${{ runner.temp }}/npm-publication.json
            ${{ runner.temp }}/npm-claim.json
            ${{ runner.temp }}/npm-claim-result.json
            ${{ runner.temp }}/npm-plan.json.artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Select pending release batch
        id: selection
        run: |
          node scripts/release-control.mjs select --output "$RUNNER_TEMP/npm-selection.json"
          node --input-type=module -e 'import fs from "node:fs"; const selection = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-selection.json`)); fs.appendFileSync(process.env.GITHUB_OUTPUT, `selectable=${selection.selectable}\n`);'

      # Publication is independent of pending fragments held in other families.
      - name: Create selected release PR
        if: steps.selection.outputs.selectable == 'true'
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # v2 defaults to pushing through the GitHub API and to pushing git tags; keep v1's git
        # push, and leave every tag to scripts/release-finalize.mjs.
        with:
          version-script: pnpm version-packages
          create-github-releases: false
          push-git-tags: false
          push-with-git-cli: true
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  recover:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    name: Reconcile held npm publication
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      statuses: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Quality gate
        run: pnpm check:all
      - name: Configure release tag author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # GITHUB_TOKEN cannot create a ref at a commit whose workflow files differ from main's, which a
      # workflow change merged during the release causes (#952). This token is created late and
      # reaches only the next step. Without the App, or if the token cannot be created, the push
      # uses GITHUB_TOKEN as before.
      - name: Create release tag token
        id: tag-token
        if: vars.RELEASE_TAG_APP_CLIENT_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_TAG_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_TAG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Reconcile original artifacts and complete publication
        run: |
          if [ -n "$TAG_TOKEN" ]; then
            # The empty value drops the credential actions/checkout stored; git sends only the App's.
            credential=$(printf 'x-access-token:%s' "$TAG_TOKEN" | base64 -w0)
            echo "::add-mask::$credential"
            export GIT_CONFIG_COUNT=2
            export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0=
            export GIT_CONFIG_KEY_1=http.https://github.com/.extraheader
            export GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $credential"
          fi
          node scripts/release-recover.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_TOKEN: ${{ steps.tag-token.outputs.token }}
          NPM_CONFIG_PROVENANCE: true
          RECOVERY_APPROVAL: ${{ inputs.recovery_approval }}
      - name: Retain recovery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-recovery/
            ${{ runner.temp }}/npm-recovery-original/
            ${{ runner.temp }}/npm-recovery-failed/
            ${{ runner.temp }}/npm-plan.json.artifacts/
          retention-days: 30
