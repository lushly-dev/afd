name: C++

on:
  push:
    branches: [main]
    paths:
      - 'packages/cpp/**'
      # The C++ tests round-trip these golden fixtures and implement this spec.
      - 'spec/wire/**'
      - 'spec/pipeline-variables.md'
      - '.github/workflows/cpp.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cpp/**'
      - 'spec/wire/**'
      - 'spec/pipeline-variables.md'
      - '.github/workflows/cpp.yml'

permissions:
  contents: read

env:
  CLANG_FORMAT_VERSION: '22.1.8'
  EMSDK_VERSION: '6.0.10'

jobs:
  format:
    name: C++ (clang-format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # clang-format is pinned through PyPI so local runs (`uvx --from clang-format==<v>`) match CI.
      - name: Check formatting
        working-directory: packages/cpp
        run: |
          find include src tests cmake \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 uvx --from "clang-format==${CLANG_FORMAT_VERSION}" clang-format --dry-run -Werror

  build:
    name: C++ (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            preset: release
            cxx: g++
          - name: linux-clang-sanitize
            os: ubuntu-latest
            preset: asan
            cxx: clang++
          - name: noexcept-nortti
            os: ubuntu-latest
            preset: noexcept-nortti
            cxx: clang++
          - name: macos
            os: macos-latest
            preset: release
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
            preset: release
            cxx: ''

    defaults:
      run:
        working-directory: packages/cpp

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        shell: bash
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          if [ -z "$CXX" ]; then unset CXX; fi
          cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  emscripten:
    name: C++ (emscripten)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: emsdk
          key: emsdk-${{ runner.os }}-${{ env.EMSDK_VERSION }}

      # emsdk is cloned at a pinned tag instead of using a third-party setup action.
      - name: Install Emscripten
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${EMSDK_VERSION}" https://github.com/emscripten-core/emsdk.git emsdk
          ./emsdk/emsdk install "${EMSDK_VERSION}"
          ./emsdk/emsdk activate "${EMSDK_VERSION}"

      - name: Configure, build and test (tests run under Node)
        working-directory: packages/cpp
        run: |
          source "${GITHUB_WORKSPACE}/emsdk/emsdk_env.sh"
          emcmake cmake --preset emscripten
          cmake --build --preset emscripten
          ctest --preset emscripten
