name: Alfred

on:
  push:
    branches: [main]
    paths:
      # alfred's tests read the Python package, the wire fixtures and the
      # TypeScript/Rust export surfaces, so changes there must run them too.
      - 'alfred/**'
      - 'python/**'
      - 'endpoints/botcore/**'
      - 'scripts/release*/**'
      - 'scripts/release-*.mjs'
      - 'architecture.json'
      - 'botcore.toml'
      - 'skills/exports.json'
      - 'scripts/skill-profiles*.mjs'
      - '.claude/skills/**'
      - '.codex/skills'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - 'spec/**'
      - 'packages/**'
      - '.github/workflows/alfred.yml'
  pull_request:
    branches: [main]
    paths:
      # alfred's tests read the Python package, the wire fixtures and the
      # TypeScript/Rust export surfaces, so changes there must run them too.
      - 'alfred/**'
      - 'python/**'
      - 'endpoints/botcore/**'
      - 'scripts/release*/**'
      - 'scripts/release-*.mjs'
      - 'architecture.json'
      - 'botcore.toml'
      - 'skills/exports.json'
      - 'scripts/skill-profiles*.mjs'
      - '.claude/skills/**'
      - '.codex/skills'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - 'spec/**'
      - 'packages/**'
      - '.github/workflows/alfred.yml'

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: alfred

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node for disposable release-controller fixtures
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install fixture controller dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Check lock
        run: uv lock --check

      - name: Install development environment
        run: uv sync --all-extras --dev --frozen

      - name: Lint
        run: uv run --locked ruff check .

      - name: Test
        run: uv run --locked pytest tests/ -v

      - name: Build source packages and wheels
        run: |
          uv build --project ../python --out-dir "$RUNNER_TEMP/alfred-wheel-artifacts"
          uv build --project ../endpoints/botcore --out-dir "$RUNNER_TEMP/alfred-wheel-artifacts"
          uv build --out-dir "$RUNNER_TEMP/alfred-wheel-artifacts"

      - name: Smoke-test base wheel
        run: |
          python -m venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$RUNNER_TEMP"/alfred-wheel-artifacts/*.whl
          .wheel-smoke/bin/alfred --version
          mkdir "$RUNNER_TEMP/alfred-external-workspace"
          .wheel-smoke/bin/alfred --workspace "$RUNNER_TEMP/alfred-external-workspace" catalog
