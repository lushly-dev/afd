name: Alfred

on:
  push:
    branches: [main]
    paths:
      - 'alfred/**'
      - 'python/**'
      - 'endpoints/botcore/**'
      - 'scripts/check-test-*.mjs'
      - 'scripts/discovery-parsers.mjs'
      - 'scripts/report-test-changes.mjs'
      - 'scripts/release*/**'
      - 'scripts/release-*.mjs'
      - 'architecture.json'
      - 'botcore.toml'
      - 'skills/exports.json'
      - 'scripts/skill-profiles*.mjs'
      - '.claude/skills/**'
      - '.agents/skills'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - 'spec/**'
      - 'packages/**'
      - '.github/workflows/alfred.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'alfred/**'
      - 'python/**'
      - 'endpoints/botcore/**'
      - 'scripts/check-test-*.mjs'
      - 'scripts/discovery-parsers.mjs'
      - 'scripts/report-test-changes.mjs'
      - 'scripts/release*/**'
      - 'scripts/release-*.mjs'
      - 'architecture.json'
      - 'botcore.toml'
      - 'skills/exports.json'
      - 'scripts/skill-profiles*.mjs'
      - '.claude/skills/**'
      - '.agents/skills'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.nvmrc'
      - 'spec/**'
      - 'packages/**'
      - '.github/workflows/alfred.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: alfred.yml

  test-and-package:
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: alfred

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: alfred/uv.lock

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node and install fixture controller dependencies
        uses: ./.github/actions/setup-node-pnpm

      - name: Check lock
        run: uv lock --check

      - name: Install development environment
        run: uv sync --all-extras --dev --frozen

      - name: Lint
        run: uv run --locked ruff check .

      - name: Test
        run: uv run --locked pytest tests/ -v

      - name: Build source packages and wheels
        run: |
          uv build --project ../python --out-dir "$RUNNER_TEMP/alfred-wheel-artifacts"
          uv build --project ../endpoints/botcore --out-dir "$RUNNER_TEMP/alfred-wheel-artifacts"
          uv build --out-dir "$RUNNER_TEMP/alfred-wheel-artifacts"

      - name: Smoke-test base wheel
        run: |
          python -m venv .wheel-smoke
          uv pip install --python .wheel-smoke/bin/python "$RUNNER_TEMP"/alfred-wheel-artifacts/*.whl
          .wheel-smoke/bin/alfred --version
          mkdir "$RUNNER_TEMP/alfred-external-workspace"
          .wheel-smoke/bin/alfred --workspace "$RUNNER_TEMP/alfred-external-workspace" catalog
