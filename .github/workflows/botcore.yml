name: Botcore

on:
  # publish-botcore.yml runs this suite before it builds a release.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - '.github/workflows/botcore.yml'
      - '.github/workflows/publish-botcore.yml'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - '.github/workflows/botcore.yml'
      - '.github/workflows/publish-botcore.yml'

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    # A merge group starts every workflow, whatever its `paths`. The jobs below run for one only
    # when the files it changes match this workflow's own pull_request.paths; every other event
    # passes straight through (scripts/affected.mjs trigger).
    name: Merge queue paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: paths
        env:
          AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            node scripts/affected.mjs trigger botcore.yml
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  core-and-package:
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: endpoints/botcore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify lock and install core development environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra mcp --extra cdp --group packages
      - name: Lint
        run: uv run --frozen ruff check src/ tests/ scripts/ packages/ botcore-connectors/src/ botcore-connectors/tests/ plugins/botcore-teams/
      - name: Core tests
        # Stateful optional plugin integration scenarios are preserved but not admitted here.
        run: uv run --frozen pytest tests/ --ignore=tests/integration -q
      - name: Sibling package tests
        run: uv run --frozen python scripts/package_tests.py
      - name: Build all distributions and smoke-test isolated wheel assets
        run: uv run --frozen python scripts/package_smoke.py
