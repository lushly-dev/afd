name: Botcore

on:
  # publish-botcore.yml runs this suite before it builds a release.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/client/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish-botcore.yml'
      - 'docs/features/active/test-effectiveness/scenarios/**'
      - '.github/workflows/botcore.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/client/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/publish-botcore.yml'
      - 'docs/features/active/test-effectiveness/scenarios/**'
      - '.github/workflows/botcore.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  schedule:
    - cron: '5 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: botcore.yml

  core-and-package:
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: endpoints/botcore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # The core tests run the test effectiveness plan's gate outcome jobs through AFD's
      # TypeScript scenario runner (tests/test_gate_outcome_scenarios.py).
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Build AFD's scenario runner
        working-directory: .
        run: pnpm -F "@lushly-dev/afd-testing..." build
      - name: Verify lock and install core development environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra mcp --extra cdp --group packages
      - name: Lint
        run: uv run --frozen ruff check src/ tests/ scripts/ packages/ botcore-connectors/src/ botcore-connectors/tests/ plugins/botcore-teams/
      - name: Format check
        run: uv run --frozen ruff format --check src/ tests/ scripts/ packages/ botcore-connectors/src/ botcore-connectors/tests/ plugins/botcore-teams/
      - name: Type check
        run: uv run --frozen mypy src
      - name: Core tests
        # The integration scenarios drive the sibling packages, so they run with them below.
        run: uv run --frozen pytest tests/ --ignore=tests/integration -q
      - name: Sibling packages, plugins and integration scenarios
        # packages/*, botcore-connectors and every plugin but botcore-factory (its own workflow),
        # then the scenarios with a mocked LLM.
        run: uv run --frozen python scripts/package_tests.py
      - name: Build all distributions and smoke-test isolated wheel assets
        run: uv run --frozen python scripts/package_smoke.py
