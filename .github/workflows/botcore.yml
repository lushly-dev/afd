name: Botcore

on:
  # publish-botcore.yml runs this suite before it builds a release.
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - '.github/workflows/botcore.yml'
      - '.github/workflows/publish-botcore.yml'
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/botcore/**'
      - 'python/**'
      - '.github/workflows/botcore.yml'
      - '.github/workflows/publish-botcore.yml'

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: endpoints/botcore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify lock and install core development environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev --extra mcp --extra cdp
      - name: Lint
        run: uv run --frozen ruff check src/ tests/ scripts/ packages/botcore-agents/src/
      - name: Core tests
        # Stateful optional plugin integration scenarios are preserved but not admitted here.
        run: uv run --frozen pytest tests/ --ignore=tests/integration -q
      - name: Build all distributions and smoke-test isolated wheel assets
        run: uv run --frozen python scripts/package_smoke.py
