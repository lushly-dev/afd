name: Health dashboard

on:
  push:
    branches: [main]
    paths:
      - 'endpoints/health-dashboard/**'
      - 'endpoints/health/**'
      - 'foundations/fast-af/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/playwright-install/**'
      - '.github/workflows/health-dashboard.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/health-dashboard/**'
      - 'endpoints/health/**'
      - 'foundations/fast-af/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/actions/playwright-install/**'
      - '.github/workflows/health-dashboard.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: health-dashboard.yml

  scope:
    # Triggered by a shared input such as pnpm-lock.yaml, the suites below run only when the
    # change reaches their packages (scripts/affected.mjs). Manual runs check everything.
    name: Affected units
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.run.outputs.run }}
    env:
      AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: run
        run: node scripts/affected.mjs gate --package @lushly-dev/health-dashboard --path endpoints/health/ --path .github/workflows/health-dashboard.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/

  dashboard:
    name: Build, unit, fixtures, Chromium and axe
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: endpoints/health/uv.lock
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build the dashboard and its FAST-AF dependencies
        run: pnpm -F "@lushly-dev/health-dashboard..." build
      - run: pnpm -F @lushly-dev/health-dashboard typecheck
      - name: Unit suites (parsing, validation, verdict, view, build plugins) with coverage
        run: pnpm -F @lushly-dev/health-dashboard test --coverage
      - name: Committed fixtures match the Health CLI's output
        run: pnpm -F @lushly-dev/health-dashboard fixtures:check
      - name: Headless Health wheel has no unconditional or frontend dependency
        run: node endpoints/health-dashboard/scripts/verify-health-isolation.mjs
      # Under a minute as a rule; apt held this step for 50 when a runner could not resolve Ubuntu's mirrors.
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/health-dashboard'
        timeout-minutes: 10
      - name: Chromium suite (every status, invalid files, keyboard, CSP, axe WCAG 2.2 AA)
        run: pnpm -F @lushly-dev/health-dashboard test:browser
      - name: Build leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: health-dashboard-screenshots
          path: endpoints/health-dashboard/test-results/
          retention-days: 7
