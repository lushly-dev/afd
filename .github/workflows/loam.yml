name: Loam

on:
  push:
    branches: [main]
    paths:
      - 'endpoints/loam/**'
      - '!endpoints/loam/docs/**'
      - 'endpoints/loam/docs/phases/*/scenarios/**'
      - '!endpoints/loam/plugins/**'
      - 'foundations/fast-af/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/view-state/**'
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'packages/client/**'
      - 'packages/adapters/**'
      - 'packages/testing/**'
      - 'endpoints/umbel/**'
      - '!endpoints/umbel/docs/**'
      - 'packages/rust/**'
      - 'spec/plugin-manifest*'
      - 'spec/VERSION'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.cargo/config.toml'
      - '.github/actions/playwright-install/**'
      - 'foundations/violet/**'
      - 'foundations/specimen/**'
      - 'integrations/specimen-afd-runner/**'
      - 'integrations/violet-afd/**'
      - 'architecture.json'
      - 'endpoints/loam/docs/decisions.md'
      - '.github/workflows/loam.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/loam/**'
      - '!endpoints/loam/docs/**'
      - 'endpoints/loam/docs/phases/*/scenarios/**'
      - '!endpoints/loam/plugins/**'
      - 'foundations/fast-af/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/view-state/**'
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'packages/client/**'
      - 'packages/adapters/**'
      - 'packages/testing/**'
      - 'endpoints/umbel/**'
      - '!endpoints/umbel/docs/**'
      - 'packages/rust/**'
      - 'spec/plugin-manifest*'
      - 'spec/VERSION'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.cargo/config.toml'
      - '.github/actions/playwright-install/**'
      - 'foundations/violet/**'
      - 'foundations/specimen/**'
      - 'integrations/specimen-afd-runner/**'
      - 'integrations/violet-afd/**'
      - 'architecture.json'
      - 'endpoints/loam/docs/decisions.md'
      - '.github/workflows/loam.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # Daily, off the other workflows' hour (06:41 to 08:11 UTC): `AFD_SCOPE` is `all` for a scheduled run, as for a manual
  # one, so every gate opens and the frozen hosted lane runs against the shell `main` builds (Loam's D162; #1930). A
  # break only the built shell causes shows within a day, and no pull request waits on it. ci-ok reads only pull
  # request and merge group runs.
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: loam.yml

  scope:
    # Triggered by a shared input such as a foundation or pnpm-lock.yaml, the suite below runs only
    # when the change reaches Loam's packages (scripts/affected.mjs). Manual and scheduled runs check everything.
    name: Affected units
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.run.outputs.run }}
      mounted: ${{ steps.mounted.outputs.run }}
      hosted: ${{ steps.hosted.outputs.run }}
    env:
      AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      # `theme:check` below scans every `.ts` file of violet-elements' source, specs included, and a
      # spec reaches no dependent, so the path is named: no other workflow runs that check.
      - id: run
        run: node scripts/affected.mjs gate --package @lushly-dev/loam-app-checklist --package @lushly-dev/loam-app-hello --package @lushly-dev/loam-app-notes --package @lushly-dev/loam-app-tally --package @lushly-dev/loam-app-tasks --package @lushly-dev/loam-chrome --package @lushly-dev/loam-cli --package @lushly-dev/loam-console --package @lushly-dev/loam-copilot --package @lushly-dev/loam-desktop --package @lushly-dev/loam-identity --package @lushly-dev/loam-kernel --package @lushly-dev/loam-manifest --package @lushly-dev/loam-sdk --package @lushly-dev/loam-testing --package @lushly-dev/loam-theme --package @lushly-dev/loam-web --path foundations/fast-af/packages/violet-elements/src/ --path .cargo/config.toml --path .github/workflows/loam.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/
      # The same packages, and an Umbel or `afd` crate change, which reaches this job and not the ones below.
      - id: mounted
        run: node scripts/affected.mjs gate --package @lushly-dev/loam-app-checklist --package @lushly-dev/loam-app-hello --package @lushly-dev/loam-app-notes --package @lushly-dev/loam-app-tally --package @lushly-dev/loam-app-tasks --package @lushly-dev/loam-chrome --package @lushly-dev/loam-cli --package @lushly-dev/loam-console --package @lushly-dev/loam-copilot --package @lushly-dev/loam-desktop --package @lushly-dev/loam-identity --package @lushly-dev/loam-kernel --package @lushly-dev/loam-manifest --package @lushly-dev/loam-sdk --package @lushly-dev/loam-testing --package @lushly-dev/loam-theme --package @lushly-dev/loam-web --path .cargo/config.toml --path .github/workflows/loam.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/ --path endpoints/umbel/ --except endpoints/umbel/docs/ --path packages/rust/
      # The frozen hosted lane (Loam's D162 and D164): `@lushly-dev/loam-host` and the hosted criterion, whose packages
      # and paths architecture.json's `lanes` lists once. Its packages are named in neither gate above, and the jobs above
      # leave them out of their builds and suites, so a local change waits on nothing of the lane. This gate opens when a
      # lane path or input changes (`inputs`: the files outside it that it reads) or a package the server imports does
      # (the kernel, the CLI, identity, an AFD package).
      - id: hosted
        run: node scripts/affected.mjs gate --lane loam-hosted --path .github/workflows/loam.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/ --path architecture.json

  loam:
    name: Build, unit and Chromium
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      # Without the hosted server, the frozen lane's (D162), which the web host lists only for its hosted criterion: the
      # "Hosted development profile" job builds and tests it. scripts/affected.test.mjs holds every job but that one to
      # the `!` filter.
      - name: Build the web host and its dependencies
        run: pnpm -F "@lushly-dev/loam-web..." -F "!@lushly-dev/loam-host" build
      - name: Typecheck the packages and apps
        run: pnpm -F "./endpoints/loam/packages/*" -F "./endpoints/loam/apps/*" -F "!@lushly-dev/loam-host" typecheck
      # Verbose, so each test's title is in the log for the exit check (scripts/loam-exit-check.mjs).
      - name: Unit suites with coverage
        run: pnpm -F "./endpoints/loam/packages/*" -F "./endpoints/loam/apps/*" -F "!@lushly-dev/loam-host" test --coverage --reporter=verbose --reporter=github-actions
      # E2's and E11's AFD side, whose titles ci.yml's log cannot show: lefthook prints only a summary.
      - name: AFD's lean path
        run: |
          pnpm -F @lushly-dev/afd-server exec vitest run src/entry-points.test.ts --reporter=verbose --reporter=github-actions
          node --test --test-reporter=spec scripts/plugin-manifest.test.mjs
      # Phase 3's E9: afd-server's authorization suite (step 0a's verifier, its cases and the verified-credentials
      # brand; step 0c's scopes and a host's own layer) and afd-auth's, verbose, so the exit check reads their titles.
      - name: AFD's identity path
        run: |
          pnpm -F @lushly-dev/afd-server exec vitest run src/authorization-cases.test.ts src/mcp-auth.test.ts src/mcp-auth-verifier.test.ts src/mcp-auth-scopes.test.ts src/mcp-auth-host.test.ts src/verified-credentials.test.ts --reporter=verbose --reporter=github-actions
          pnpm -F @lushly-dev/afd-auth exec vitest run --reporter=verbose --reporter=github-actions
      - name: Theme contract against the tree
        run: pnpm -F @lushly-dev/loam-theme theme:check
      - name: Token-only lint
        run: pnpm -F @lushly-dev/loam-theme -F @lushly-dev/loam-chrome -F @lushly-dev/loam-console -F @lushly-dev/loam-app-hello -F @lushly-dev/loam-app-tally -F @lushly-dev/loam-app-tasks -F @lushly-dev/loam-app-notes -F @lushly-dev/loam-app-checklist lint:tokens
      # Under a minute as a rule; apt held this step for 50 when a runner could not resolve Ubuntu's mirrors.
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/loam-web'
        timeout-minutes: 10
      # Specimen's native host renders the chrome's fixtures for E2 and E4; test:browser builds it.
      - name: Install Rust toolchain
        working-directory: foundations/specimen/host
        run: rustup toolchain install
      # Shared with specimen.yml's stories and Chromium jobs: one entry for every ubuntu-latest release
      # build of Specimen's host (#1675).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: foundations/specimen/host
          shared-key: specimen-host-release
      - name: Chromium suite against the built shell (phase 0's E1 to E10, phase 1's so far, A1 to A3; the walk is its own job)
        run: pnpm -F @lushly-dev/loam-web test:browser
      - name: Bundle budget
        run: pnpm -F @lushly-dev/loam-web budget
      - name: Build leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload test results
        if: ${{ always() }}
        # A diagnostic: an outage of the artifact service must not fail a job whose suites passed.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loam-test-results
          path: endpoints/loam/packages/web/test-results/
          # A passing run writes no results; that is not worth a warning.
          if-no-files-found: ignore
          retention-days: 7

  # The editor area's seeded walk, beside the Chromium suite, which leaves it out: the same gate and build.
  walk:
    name: Editor walk
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build the web host and its dependencies
        run: pnpm -F "@lushly-dev/loam-web..." -F "!@lushly-dev/loam-host" build
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/loam-web'
        timeout-minutes: 10
      - name: The editor area's seeded walk, every seed, thirteen invariants after each step
        run: pnpm -F @lushly-dev/loam-web test:walk
      - name: The run leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload test results
        if: ${{ always() }}
        # A diagnostic: an outage of the artifact service must not fail a job whose suites passed.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loam-walk-test-results
          path: endpoints/loam/packages/web/test-results/
          # A passing run writes no results; that is not worth a warning.
          if-no-files-found: ignore
          retention-days: 7

  # #706: the mount and its scoped registry (E1), the sandboxed view (E2) and phase 4's I8 chord, in Firefox
  # (`vitest.engines.config.ts`), beside the Chromium suite that runs them with the rest. E1's floor case turns the
  # registries off, as a Firefox before 159 has them (D174).
  firefox:
    name: Firefox suites
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build the web host and its dependencies
        run: pnpm -F "@lushly-dev/loam-web..." -F "!@lushly-dev/loam-host" build
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/loam-web'
          browsers: firefox
        timeout-minutes: 10
      - name: The mount, the view and the chord in Firefox
        run: pnpm -F @lushly-dev/loam-web test:firefox
      - name: The run leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload test results
        if: ${{ always() }}
        # A diagnostic: an outage of the artifact service must not fail a job whose suites passed.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loam-firefox-test-results
          path: endpoints/loam/packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # #706: the same suites in WebKit, on macOS: Apple's port, which has scoped custom element registries as Safari 26 does.
  # Playwright's Linux WebKit is the GTK port, which has none, so it is below the support floor (D174, #2254) and is not
  # run: E1's mount cases would fail there. Phase 1's 9.7 records it.
  webkit:
    name: WebKit suites
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build the web host and its dependencies
        run: pnpm -F "@lushly-dev/loam-web..." -F "!@lushly-dev/loam-host" build
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/loam-web'
          browsers: webkit
        timeout-minutes: 10
      - name: The mount, the view and the chord in WebKit
        run: pnpm -F @lushly-dev/loam-web test:webkit
      - name: The run leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload test results
        if: ${{ always() }}
        # A diagnostic: an outage of the artifact service must not fail a job whose suites passed.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loam-webkit-test-results
          path: endpoints/loam/packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Hello mounted and a real Umbel in the console, through a test-only relay (D64). The relay is not a hosted
  # server: this proves the stock `umbel`, its bearer layer, the browser's MCP client under the CSP, discovery,
  # the console and the journal. So an Umbel change runs this proof without running Loam's whole suite.
  mounted:
    name: Mounted against Umbel
    needs: scope
    if: needs.scope.outputs.mounted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install Rust toolchain
        working-directory: endpoints/umbel
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: endpoints/umbel
      - name: Build the web host and its dependencies
        run: pnpm -F "@lushly-dev/loam-web..." -F "!@lushly-dev/loam-host" build
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/loam-web'
        timeout-minutes: 10
      - name: E3, E4 and E9's mounted part, through a test-only relay
        run: pnpm -F @lushly-dev/loam-web test:mounted
      - name: The run leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload test results
        if: ${{ always() }}
        # A diagnostic: an outage of the artifact service must not fail a job whose suites passed.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loam-mounted-test-results
          path: endpoints/loam/packages/web/test-results/
          # A passing run writes no results; that is not worth a warning.
          if-no-files-found: ignore
          retention-days: 7

  # The frozen hosted lane (Loam's D162 and D164; architecture.json's `lanes`), and the only job a change's scope builds,
  # typechecks and tests it in: the hosted server's units, its store (P6-E7) and phase 6's hosted criterion, Chromium against
  # `loam-host dev`, the development profile on https://localhost with a generated certificate (`openssl`, on the
  # runner), its server a child process per test file. A pull request or merge group runs it when the `hosted` gate
  # opens, as a push to main does for the same change, and ci-ok then requires it like any job of this workflow. A
  # local change it does not read (the web host's source, which the criterion serves built) waits on nothing of it, so
  # a break shows in the daily scheduled run, when the gate next opens or in a manual run; fixes that keep this job
  # green are allowed while the lane is frozen.
  hosted:
    name: Hosted development profile
    needs: scope
    if: needs.scope.outputs.hosted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      # The web host too: the server's units and the criterion read the built shell.
      - name: Build the web host, the hosted server and their dependencies
        run: pnpm -F "@lushly-dev/loam-web..." -F "@lushly-dev/loam-host..." build
      - name: Typecheck the hosted server and the hosted criterion
        run: |
          pnpm -F @lushly-dev/loam-host typecheck
          pnpm -F @lushly-dev/loam-web typecheck:hosted
      # Verbose, so each P6- title is in the log for the exit check (scripts/loam-exit-check.mjs).
      - name: The hosted server's unit suites with coverage
        run: pnpm -F @lushly-dev/loam-host test --coverage --reporter=verbose --reporter=github-actions
      # Phase 6's P6-E7: local-db's SqliteAdapter, the hosted server's store, against the DataAdapter contract,
      # and its entry kept out of the root; verbose, since ci.yml's log cannot show its titles.
      - name: AFD's host path
        run: pnpm -F @lushly-dev/local-db exec vitest run src/sqlite-adapter.test.ts src/entry.test.ts --reporter=verbose --reporter=github-actions
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/loam-web'
        timeout-minutes: 10
      # Verbose, so each P6- title is in the log for the exit check (scripts/loam-exit-check.mjs).
      - name: Hosted criterion against the development profile
        run: pnpm -F @lushly-dev/loam-web test:hosted
      - name: The run leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload test results
        if: ${{ always() }}
        # A diagnostic: an outage of the artifact service must not fail a job whose suites passed.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loam-hosted-test-results
          path: endpoints/loam/packages/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
