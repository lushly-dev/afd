name: Loam

on:
  push:
    branches: [main]
    paths:
      - 'endpoints/loam/**'
      - '!endpoints/loam/docs/**'
      # The foundations and AFD packages Loam builds on.
      - 'foundations/fast-af/**'
      - 'foundations/violet/**'
      - 'foundations/specimen/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/view-state/**'
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/loam.yml'
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/loam/**'
      - '!endpoints/loam/docs/**'
      - 'foundations/fast-af/**'
      - 'foundations/violet/**'
      - 'foundations/specimen/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/view-state/**'
      - 'packages/auth/**'
      - 'packages/local-db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/loam.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    # Triggered by a shared input such as a foundation or pnpm-lock.yaml, the suite below runs only
    # when the change reaches Loam's packages (scripts/affected.mjs). Manual runs check everything.
    name: Affected units
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.run.outputs.run }}
    env:
      AFD_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: run
        run: node scripts/affected.mjs gate --package @lushly-dev/loam-chrome --package @lushly-dev/loam-kernel --package @lushly-dev/loam-theme --package @lushly-dev/loam-web --path .github/workflows/loam.yml

  loam:
    name: Build, unit and Chromium
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web host and its dependencies
        run: pnpm -F "@lushly-dev/loam-web..." build
      - name: Typecheck the four packages
        run: pnpm -F "./endpoints/loam/packages/*" typecheck
      - name: Unit suites with coverage
        run: pnpm -F "./endpoints/loam/packages/*" test --coverage
      - name: Theme contract against the tree
        run: pnpm -F @lushly-dev/loam-theme theme:check
      - name: Token-only lint
        run: pnpm -F @lushly-dev/loam-theme -F @lushly-dev/loam-chrome lint:tokens
      - run: pnpm -F @lushly-dev/loam-web exec playwright install --with-deps chromium
      # Specimen's native host renders the chrome's fixtures for E2 and E4; test:browser builds it.
      - name: Install Rust toolchain
        working-directory: foundations/specimen/host
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: foundations/specimen/host
      - name: Chromium suite against the built shell (E1 to E10, A1 to A3)
        run: pnpm -F @lushly-dev/loam-web test:browser
      - name: Bundle budget
        run: pnpm -F @lushly-dev/loam-web budget
      - name: Build leaves tracked files unchanged
        run: test -z "$(git status --porcelain)"
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: loam-test-results
          path: endpoints/loam/packages/web/test-results/
          retention-days: 7
