name: Health

on:
  push:
    branches: [main]
    paths:
      - 'endpoints/health/**'
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'LICENSE'
      - '.github/workflows/health.yml'
      - '.github/workflows/queue.yml'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/health/**'
      - 'endpoints/botcore/**'
      - 'python/**'
      - 'LICENSE'
      - '.github/workflows/health.yml'
      - '.github/workflows/queue.yml'

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: health.yml

  test-and-package:
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: endpoints/health
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify lock and install development environment
        run: |
          uv lock --check
          uv sync --frozen --extra dev --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run --frozen ruff check src tests scripts
          uv run --frozen ruff format --check src tests scripts
      - name: Type check
        run: uv run --frozen mypy src
      - name: Test
        run: uv run --frozen pytest -q
      - name: Build wheel and sdist, scan contents and smoke-test isolated consumers
        run: uv run --frozen python scripts/package_smoke.py
