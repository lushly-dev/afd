name: Specimen

on:
  push:
    branches: [main]
    paths:
      - 'foundations/specimen/**'
      - 'integrations/specimen-afd/**'
      - 'integrations/specimen-afd-runner/**'
      - 'integrations/specimen-fast-af/**'
      - 'endpoints/specimen-cli/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - '.cargo/config.toml'
      - '.github/actions/playwright-install/**'
      - 'foundations/fast-af/packages/element/packages/fast-element/**'
      - 'foundations/fast-af/packages/violet-elements/**'
      - 'tests/consumers/pnpm.mjs'
      - 'tests/consumers/specimen/**'
      - 'scripts/release/exec-tool.mjs'
      - '.github/workflows/specimen.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'foundations/specimen/**'
      - 'integrations/specimen-afd/**'
      - 'integrations/specimen-afd-runner/**'
      - 'integrations/specimen-fast-af/**'
      - 'endpoints/specimen-cli/**'
      - 'packages/core/**'
      - 'packages/server/**'
      - 'packages/testing/**'
      - 'pnpm-lock.yaml'
      - '.cargo/config.toml'
      - '.github/actions/playwright-install/**'
      - 'foundations/fast-af/packages/element/packages/fast-element/**'
      - 'foundations/fast-af/packages/violet-elements/**'
      - 'tests/consumers/pnpm.mjs'
      - 'tests/consumers/specimen/**'
      - 'scripts/release/exec-tool.mjs'
      - '.github/workflows/specimen.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: specimen.yml

  scope:
    # Triggered by a shared input such as pnpm-lock.yaml, the suites below run only when the
    # change reaches their packages (scripts/affected.mjs). Manual runs check everything.
    name: Affected units
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.run.outputs.run }}
      host: ${{ steps.host.outputs.run }}
      hosts: ${{ steps.hosts.outputs.run }}
      stories: ${{ steps.stories.outputs.run }}
    env:
      AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - id: run
        run: node scripts/affected.mjs gate --package @lushly-dev/specimen --package @lushly-dev/specimen-afd --package @lushly-dev/specimen-afd-runner --package @lushly-dev/specimen-cli --package @lushly-dev/specimen-fast-af --path tests/consumers/specimen/ --path tests/consumers/pnpm.mjs --path scripts/release/exec-tool.mjs --path .github/workflows/specimen.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/
      - id: host
        run: node scripts/affected.mjs gate --path foundations/specimen/host/ --path .cargo/config.toml --path .github/workflows/specimen.yml
      - id: hosts
        run: node scripts/affected.mjs gate --path foundations/specimen/host/ --path foundations/specimen/packages/ --path foundations/specimen/src/host.ts --path tests/consumers/specimen/ --path tests/consumers/pnpm.mjs --path scripts/release/exec-tool.mjs --path .cargo/config.toml --path .github/workflows/specimen.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/
      - id: stories
        run: node scripts/affected.mjs gate --package @lushly-dev/violet-elements --path .github/workflows/specimen.yml --path .github/actions/setup-node-pnpm/ --path .github/actions/playwright-install/

  host:
    name: Specimen native host (format, clippy, tests)
    needs: scope
    if: needs.scope.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: foundations/specimen/host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: foundations/specimen/host
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked

  host-packages:
    # The prebuilt hosts @lushly-dev/specimen installs as optional dependencies. Each is built on
    # the oldest image Playwright supports for its platform (Linux links glibc 2.35), packed
    # through its package's prepack check and installed by every packed consumer, with no
    # SPECIMEN_HOST_BINARY. The tarballs are the candidates a release route would publish; this
    # job publishes nothing.
    name: Prebuilt host (${{ matrix.platform }})
    needs: scope
    if: needs.scope.outputs.hosts == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-22.04
          - platform: linux-arm64-gnu
            os: ubuntu-22.04-arm
          - platform: darwin-arm64
            os: macos-15
          - platform: darwin-x64
            os: macos-15-intel
          - platform: win32-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        # Git Bash on Windows so $RUNNER_TEMP and multi-line steps behave identically on all OSes.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm -F "@lushly-dev/specimen-cli..." build
      # Under a minute as a rule; apt held this step for 50 when a runner could not resolve Ubuntu's mirrors.
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/specimen'
        timeout-minutes: 10
      - name: Allow Chromium user namespaces under AppArmor
        if: runner.os == 'Linux'
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            cache="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
            mapfile -t bins < <(find "$cache" -type f \( -name 'chrome-headless-shell' -o -name 'headless_shell' -o -name 'chrome' \) -executable | sort)
            if [ "${#bins[@]}" -eq 0 ]; then
              echo "No Playwright Chromium binaries found under $cache" >&2
              exit 1
            fi
            {
              echo 'abi <abi/4.0>,'
              echo 'include <tunables/global>'
              i=0
              for bin in "${bins[@]}"; do
                i=$((i + 1))
                printf 'profile specimen-playwright-chromium-%d "%s" flags=(unconfined) {\n  userns,\n}\n' "$i" "$bin"
              done
            } | sudo tee /etc/apparmor.d/specimen-playwright-chromium >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/specimen-playwright-chromium
          fi
      - name: Install Rust toolchain
        working-directory: foundations/specimen/host
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: foundations/specimen/host
      - name: Native host release build
        run: pnpm -F @lushly-dev/specimen build:host
      - name: Packed consumers on this platform's host package
        env:
          SPECIMEN_CHROMIUM_SANDBOX: '1'
        run: node tests/consumers/specimen/verify-artifacts.mjs --output "$RUNNER_TEMP/specimen-receipt"
      - name: Pack the host package
        run: |
          node foundations/specimen/host/stage.mjs ${{ matrix.platform }}
          pnpm -F @lushly-dev/specimen-host-${{ matrix.platform }} pack --pack-destination "$RUNNER_TEMP/specimen-host"
      - name: Upload the host package and consumer receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specimen-host-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/specimen-host/
            ${{ runner.temp }}/specimen-receipt/
          retention-days: 7

  stories:
    # AFD's FAST-AF stories: upstream's Storybook and Fastbot were not imported, so this is their
    # runner and their story contract.
    name: FAST-AF's stories on Specimen
    needs: scope
    if: needs.scope.outputs.stories == 'true'
    runs-on: ubuntu-latest
    # `actions: read` lists and downloads main's bench report (the size delta below).
    permissions:
      contents: read
      actions: read
    # The pack check runs every story twice more after the contract's run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm -F "@lushly-dev/violet-elements..." build
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/specimen'
        timeout-minutes: 10
      - name: Allow Chromium user namespaces under AppArmor
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            cache="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
            mapfile -t bins < <(find "$cache" -type f \( -name 'chrome-headless-shell' -o -name 'headless_shell' -o -name 'chrome' \) -executable | sort)
            if [ "${#bins[@]}" -eq 0 ]; then
              echo "No Playwright Chromium binaries found under $cache" >&2
              exit 1
            fi
            {
              echo 'abi <abi/4.0>,'
              echo 'include <tunables/global>'
              i=0
              for bin in "${bins[@]}"; do
                i=$((i + 1))
                printf 'profile specimen-playwright-chromium-%d "%s" flags=(unconfined) {\n  userns,\n}\n' "$i" "$bin"
              done
            } | sudo tee /etc/apparmor.d/specimen-playwright-chromium >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/specimen-playwright-chromium
          fi
      - name: Install Rust toolchain
        working-directory: foundations/specimen/host
        run: rustup toolchain install
      # Shared by this workflow's stories and Chromium jobs and loam.yml's: one entry for every
      # ubuntu-latest release build of the host. Keyed per job, each kept its own 272 MB copy and
      # the stories job rarely wrote one on main; an exact hit saves nothing (#1675).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: foundations/specimen/host
          shared-key: specimen-host-release
      - name: Native host release build
        run: pnpm -F @lushly-dev/specimen build:host
      - name: Story typecheck, every story, the story contract, the review page's budgets and the component pack
        env:
          SPECIMEN_CHROMIUM_SANDBOX: '1'
          SPECIMEN_BUILD_REPORT: ${{ runner.temp }}/bench-report/specimen-build.json
        run: pnpm -F @lushly-dev/violet-elements test:stories
      # The bench's size delta against main's, module by module, in the job summary for the reviewer
      # (#2634). Every run keeps its report as an artifact; main's is the newest one a push run on
      # main kept, which is the bench as main builds it, since a push that leaves the bench alone does
      # not run this job. Pull requests and merge groups read it the same way, and so does a push,
      # against the push before it. Advisory: these steps never fail the job.
      - name: Keep the bench report
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: violet-elements-bench-report
          path: ${{ runner.temp }}/bench-report/specimen-build.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Bench size against main
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main="$RUNNER_TEMP/bench-main"
          # Main's report is the newest one a successful push run on main kept: a failed run's report
          # is not main's build, and neither is a pull request's from a fork's branch named main.
          # Runs are newest first; one with no report left (expired, or the job skipped) is passed over.
          base=""
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/specimen.yml/runs?branch=main&event=push&status=success&per_page=30" \
            --jq '.workflow_runs[] | select(.head_repository.full_name == .repository.full_name) | "\(.id) \(.head_sha)"' || true)
          while read -r id sha; do
            [ -n "$id" ] && [ "$id" != "$GITHUB_RUN_ID" ] || continue
            if gh run download "$id" -n violet-elements-bench-report -D "$main" 2>/dev/null; then
              base="main @ $sha"
              break
            fi
          done <<< "$runs"
          node foundations/fast-af/packages/violet-elements/scripts/size-delta.mjs \
            --before "$main/specimen-build.json" \
            --after "$RUNNER_TEMP/bench-report/specimen-build.json" \
            --base "$base"

  browser-and-consumers:
    name: Specimen Chromium suite and packed consumers
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm -F "@lushly-dev/specimen-cli..." -F "@lushly-dev/specimen-fast-af..." -F "@lushly-dev/specimen-afd-runner..." build
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/specimen'
        timeout-minutes: 10
      - name: Allow Chromium user namespaces under AppArmor
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            cache="${PLAYWRIGHT_BROWSERS_PATH:-$HOME/.cache/ms-playwright}"
            mapfile -t bins < <(find "$cache" -type f \( -name 'chrome-headless-shell' -o -name 'headless_shell' -o -name 'chrome' \) -executable | sort)
            if [ "${#bins[@]}" -eq 0 ]; then
              echo "No Playwright Chromium binaries found under $cache" >&2
              exit 1
            fi
            {
              echo 'abi <abi/4.0>,'
              echo 'include <tunables/global>'
              i=0
              for bin in "${bins[@]}"; do
                i=$((i + 1))
                printf 'profile specimen-playwright-chromium-%d "%s" flags=(unconfined) {\n  userns,\n}\n' "$i" "$bin"
              done
            } | sudo tee /etc/apparmor.d/specimen-playwright-chromium >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/specimen-playwright-chromium
          fi
      - name: Install Rust toolchain
        working-directory: foundations/specimen/host
        run: rustup toolchain install
      # Shared by this workflow's stories and Chromium jobs and loam.yml's: one entry for every
      # ubuntu-latest release build of the host. Keyed per job, each kept its own 272 MB copy and
      # the stories job rarely wrote one on main; an exact hit saves nothing (#1675).
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: foundations/specimen/host
          shared-key: specimen-host-release
      - name: Native host release build
        run: pnpm -F @lushly-dev/specimen build:host
      - name: Full native suite (unit, resource, process-worker and Chromium)
        env:
          SPECIMEN_CHROMIUM_SANDBOX: '1'
        run: pnpm -F @lushly-dev/specimen test:browser
      - name: Integration and endpoint suites
        env:
          SPECIMEN_CHROMIUM_SANDBOX: '1'
        run: pnpm -F @lushly-dev/specimen-afd -F @lushly-dev/specimen-afd-runner -F @lushly-dev/specimen-cli -F @lushly-dev/specimen-fast-af test
      - name: FAST-AF plugin through the bench
        env:
          SPECIMEN_CHROMIUM_SANDBOX: '1'
        run: pnpm -F @lushly-dev/specimen-fast-af test:browser
      - name: AFD runner plugin through the bench
        env:
          SPECIMEN_CHROMIUM_SANDBOX: '1'
        run: pnpm -F @lushly-dev/specimen-afd-runner test:browser
      - name: Packed-artifact consumers outside the workspace
        env:
          SPECIMEN_CHROMIUM_SANDBOX: '1'
        run: node tests/consumers/specimen/verify-artifacts.mjs --output "$RUNNER_TEMP/specimen-receipt"
      - name: Upload consumer receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: specimen-artifact-receipt
          path: ${{ runner.temp }}/specimen-receipt/
          retention-days: 7
