name: Loam plugins

# Loam's plugins live in endpoints/loam/plugins/<name>/, outside loam.yml's filters (Loam's L8), so
# a plugin neither runs Loam's suite nor is run by it. Each plugin has one gate and one job here,
# and a change runs only the plugins it reaches.
on:
  push:
    branches: [main]
    paths:
      - 'endpoints/loam/plugins/**'
      - '!endpoints/loam/plugins/*/docs/**'
      - 'endpoints/loam/plugins/*/docs/scenarios/**'
      - 'packages/rust/**'
      - '.cargo/config.toml'
      - 'packages/auth/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/local-db/**'
      - 'packages/server/**'
      - 'packages/testing/**'
      - 'packages/view-state/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/playwright-install/**'
      - 'endpoints/loam/packages/cli/**'
      - 'endpoints/loam/packages/copilot/**'
      - 'endpoints/loam/packages/kernel/**'
      - 'endpoints/loam/packages/manifest/**'
      - 'endpoints/loam/packages/sdk/**'
      - 'endpoints/loam/packages/testing/**'
      - 'endpoints/loam/packages/theme/**'
      - 'foundations/fast-af/packages/**'
      - 'foundations/specimen/**'
      - 'foundations/violet/**'
      - 'integrations/specimen-fast-af/**'
      - 'integrations/violet-afd/**'
      - '.github/workflows/loam-plugins.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'endpoints/loam/plugins/**'
      - '!endpoints/loam/plugins/*/docs/**'
      - 'endpoints/loam/plugins/*/docs/scenarios/**'
      - 'packages/rust/**'
      - '.cargo/config.toml'
      - 'packages/auth/**'
      - 'packages/client/**'
      - 'packages/core/**'
      - 'packages/local-db/**'
      - 'packages/server/**'
      - 'packages/testing/**'
      - 'packages/view-state/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/playwright-install/**'
      - 'endpoints/loam/packages/cli/**'
      - 'endpoints/loam/packages/copilot/**'
      - 'endpoints/loam/packages/kernel/**'
      - 'endpoints/loam/packages/manifest/**'
      - 'endpoints/loam/packages/sdk/**'
      - 'endpoints/loam/packages/testing/**'
      - 'endpoints/loam/packages/theme/**'
      - 'foundations/fast-af/packages/**'
      - 'foundations/specimen/**'
      - 'foundations/violet/**'
      - 'integrations/specimen-fast-af/**'
      - 'integrations/violet-afd/**'
      - '.github/workflows/loam-plugins.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: loam-plugins.yml

  scope:
    # One step per plugin: its own folder but its documents, and what it builds on.
    name: Affected plugins
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mail: ${{ steps.mail.outputs.run }}
      violet: ${{ steps.violet.outputs.run }}
    env:
      AFD_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha || github.event.before }}
      AFD_SCOPE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && 'affected' || 'all' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: mail
        run: node scripts/affected.mjs gate --path endpoints/loam/plugins/mail/engine/ --path endpoints/loam/plugins/mail/scripts/ --path endpoints/loam/plugins/mail/docs/scenarios/ --path packages/rust/ --path .cargo/config.toml --path .github/workflows/loam-plugins.yml --path .github/actions/setup-node-pnpm/
      - id: violet
        run: node scripts/affected.mjs gate --package @lushly-dev/loam-app-violet --path endpoints/loam/plugins/violet/ --except endpoints/loam/plugins/violet/docs/ --path .github/actions/playwright-install/ --path .github/actions/setup-node-pnpm/ --path .github/workflows/loam-plugins.yml

  mail:
    name: Mail engine (fmt, clippy, test)
    needs: scope
    if: needs.scope.outputs.mail == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: endpoints/loam/plugins/mail/engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup is preinstalled on GitHub-hosted runners; with no arguments it installs the
      # toolchain pinned in the engine's rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: endpoints/loam/plugins/mail/engine
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy (test-doubles)
        run: cargo clippy --locked --all-targets --features test-doubles -- -D warnings
      - name: Test
        run: cargo test --no-fail-fast --locked
      - name: Test (test-doubles)
        run: cargo test --no-fail-fast --locked --features test-doubles
      - name: Build test-doubles binary
        run: cargo build --locked --features test-doubles --bin loam-mail
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Build AFD CLI
        working-directory: .
        run: pnpm -F "@lushly-dev/afd-cli..." build
      - name: Scenarios 1-5 (agent-cannot-send, send-what-i-saw, approve-what-was-proposed, unsubscribe-target-shown, compose-replies-apart)
        working-directory: .
        run: >-
          node endpoints/loam/plugins/mail/scripts/run-scenarios.mjs
          endpoints/loam/plugins/mail/docs/scenarios/agent-cannot-send.scenario.yaml
          endpoints/loam/plugins/mail/docs/scenarios/send-what-i-saw.scenario.yaml
          endpoints/loam/plugins/mail/docs/scenarios/approve-what-was-proposed.scenario.yaml
          endpoints/loam/plugins/mail/docs/scenarios/unsubscribe-target-shown.scenario.yaml
          endpoints/loam/plugins/mail/docs/scenarios/compose-replies-apart.scenario.yaml
      - name: Release build (no test-doubles)
        run: |
          cargo build --locked --release --bin loam-mail
          version="$(target/release/loam-mail --version)"
          echo "$version"
          if echo "$version" | grep -q 'test-doubles'; then
            echo "ERROR: release build must not include test-doubles" >&2
            exit 1
          fi
      - name: Refuse test-doubles in release profile
        run: |
          if output="$(cargo check --locked --release --features test-doubles 2>&1)"; then
            echo "ERROR: release profile compiled with test-doubles" >&2
            exit 1
          fi
          if ! echo "$output" | grep -q 'must never be enabled in release builds'; then
            echo "ERROR: release check failed for an unexpected reason:" >&2
            echo "$output" >&2
            exit 1
          fi

  violet:
    name: Violet plugin (scenarios, Specimen, pack)
    needs: scope
    if: needs.scope.outputs.violet == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
      - name: Build Violet plugin and workspace dependencies
        run: pnpm -F "@lushly-dev/loam-app-violet..." -F "!@lushly-dev/loam-host" build
      - name: Typecheck
        run: pnpm -F @lushly-dev/loam-app-violet typecheck
      - name: Lint tokens
        run: pnpm -F @lushly-dev/loam-app-violet lint:tokens
      - name: Unit and scenario tests
        run: pnpm -F @lushly-dev/loam-app-violet test
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/loam-app-violet'
        timeout-minutes: 10
      # Specimen's native host renders the plugin's fixtures; test:specimen builds it.
      - name: Install Rust toolchain
        working-directory: foundations/specimen/host
        run: rustup toolchain install
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: foundations/specimen/host
          shared-key: specimen-host-release
      - name: Specimen fixtures
        run: pnpm -F @lushly-dev/loam-app-violet test:specimen
      - name: Pack app
        run: pnpm -F @lushly-dev/loam-app-violet run pack
