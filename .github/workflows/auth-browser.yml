name: Auth browser integration

on:
  push:
    branches: [main]
    paths:
      - 'packages/auth/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/playwright-install/**'
      - '.github/workflows/auth-browser.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  # The merge queue. No path filter applies to it: the `queue` job below does that work.
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'packages/auth/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/actions/playwright-install/**'
      - '.github/workflows/auth-browser.yml'
      - '.github/workflows/queue.yml'
      - '.github/actions/setup-node-pnpm/**'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the checks still running on it; pushes to main all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  queue:
    name: Merge queue paths
    uses: ./.github/workflows/queue.yml
    with:
      workflow: auth-browser.yml

  browser:
    name: Better Auth browser lifecycle (Chromium)
    needs: queue
    if: needs.queue.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm -F @lushly-dev/afd-auth... build
      - uses: ./.github/actions/playwright-install
        with:
          package: '@lushly-dev/afd-auth'
      - run: pnpm -F @lushly-dev/afd-auth test:browser
