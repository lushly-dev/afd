version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Playwright 1.65's Chromium runs a behavior's connectedCallback before
      # fast-element binds its observables, failing element-controller.pw.spec.ts's
      # invocation-order test (#901). Lift this when fast-element handles that order.
      # Both names are held: with `@playwright/test` alone, the group moved `playwright`
      # to 1.65 beside it and the lockfile resolved two Playwright copies (#955).
      - dependency-name: '@playwright/test'
        versions:
          - '>=1.65.0'
      - dependency-name: playwright
        versions:
          - '>=1.65.0'
    groups:
      # fast-element's @playwright/test and every other unit's playwright move in one
      # update, so the lockfile never resolves two playwright copies (#600).
      playwright:
        patterns:
          - playwright
          - '@playwright/test'
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
        # Playwright moves only in the group above. This group took `@playwright/test`
        # as well and moved it alone, which split the lockfile the same way (#961).
        exclude-patterns:
          - playwright
          - '@playwright/test'

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # afd's server uses mcp.server.fastmcp, which mcp 2.x removed, so the
      # extras require mcp<2.
      - dependency-name: mcp
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /packages/rust
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # hmac and sha2 share the digest traits: either one bumped alone fails to compile.
      rustcrypto:
        patterns:
          - digest
          - hmac
          - sha2

  - package-ecosystem: uv
    directory: /alfred
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - area:ci
