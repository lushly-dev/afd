version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Playwright 1.65's Chromium runs a behavior's connectedCallback before
      # fast-element binds its observables, failing element-controller.pw.spec.ts's
      # invocation-order test (#901). Lift this when fast-element handles that order.
      # Both names are held: with `@playwright/test` alone, the group moved `playwright`
      # to 1.65 beside it and the lockfile resolved two Playwright copies (#955).
      - dependency-name: '@playwright/test'
        versions:
          - '>=1.65.0'
      - dependency-name: playwright
        versions:
          - '>=1.65.0'
      # Specimen's `test` helpers are the libraries `storybook/test` bundles, at the
      # versions it bundles (3.2.4 in Storybook 10.6), so a play means the same in both.
      # Move these two by hand when Storybook's own dependency on them moves (#958).
      - dependency-name: '@vitest/expect'
      - dependency-name: '@vitest/spy'
      # Specimen's chai is the one `@vitest/expect` 3.2.4 uses (chai 5), for the same reason.
      # chai 6 alone also pushed the bench's interaction code past its budget (#1304).
      - dependency-name: chai
        update-types:
          - version-update:semver-major
      - dependency-name: '@types/chai'
        update-types:
          - version-update:semver-major
      # The hosted Convex fixture pins 0.0.96, and moving it to 2.x is a rebuild on 2.x's
      # server setup and the Convex component, not a bump (#3006). The adapter's 2.x types
      # are checked through the `@convex-dev/auth-v2` alias. Lift this with the fixture.
      - dependency-name: '@convex-dev/auth'
        update-types:
          - version-update:semver-major
    groups:
      # fast-element's @playwright/test and every other unit's playwright move in one
      # update, so the lockfile never resolves two playwright copies (#600).
      playwright:
        patterns:
          - playwright
          - '@playwright/test'
      # Loam pins better-auth and its plugins together at one exact version and audits
      # their environment-variable reads on every move (#1960).
      better-auth:
        patterns:
          - better-auth
          - '@better-auth/*'
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch
        # Playwright and Better Auth move only in their groups above. Without exclusions
        # here, dev-deps takes the devDependencies copies alone and splits the lockfile
        # (#961, #1960).
        exclude-patterns:
          - playwright
          - '@playwright/test'
          - better-auth
          - '@better-auth/*'

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # afd's server uses mcp.server.fastmcp, which mcp 2.x removed, so the
      # extras require mcp<2.
      - dependency-name: mcp
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /packages/rust
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      # hmac and sha2 share the digest traits: either one bumped alone fails to compile.
      rustcrypto:
        patterns:
          - digest
          - hmac
          - sha2

  - package-ecosystem: uv
    directory: /alfred
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - area:ci

  # AFD's own Rust and Python roots outside the packages above, one entry per root, so each root's
  # minor and patch updates arrive as one pull request a week. The imported families (Botcore,
  # Health, Specimen) are left out: AGENTS.md has them changed here only with a provenance record of
  # why. Their lockfiles stay in the dependency graph, so Dependabot's security alerts still cover
  # the dependencies it reads from them.
  - package-ecosystem: cargo
    directory: /endpoints/umbel
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # Umbel stays on wasmtime's 48 long-term line (D39 in endpoints/umbel/docs/decisions.md);
      # patches within it still arrive. The next move, to the 60 line, is made by hand, with all
      # three crates together (#1851, #2082, #2083, #2085).
      - dependency-name: wasmtime
        versions:
          - '>=49'
      - dependency-name: wasmtime-wasi
        versions:
          - '>=49'
      - dependency-name: wasmtime-wasi-io
        versions:
          - '>=49'
      # The SSE types the bounded HTTP client returns are rmcp's, so sse-stream moves when
      # rmcp's own dependency on it does: 0.3 alone resolves a second copy and fails to compile
      # (#1852).
      - dependency-name: sse-stream
        versions:
          - '>=0.3'
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # Loam desktop pins its Tauri transport exactly, after a review of that source
  # (endpoints/loam/docs/phases/6-hosts/spec.md), so it and the crates pinned beside it move
  # only by hand.
  - package-ecosystem: cargo
    directory: /endpoints/loam/packages/desktop/src-tauri
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      - dependency-name: 'tauri*'
      - dependency-name: reqwest
      # Pinned at the version Tauri's own dependencies lock.
      - dependency-name: windows-sys
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /endpoints/loam/plugins/mail/engine
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /packages/examples/todo/backends/rust
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /packages/examples/todo/backends/python
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      uv-minor-patch:
        update-types:
          - minor
          - patch
