version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      dev-deps:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    labels:
      - dependencies
    ignore:
      # afd's server uses mcp.server.fastmcp, which mcp 2.x removed, so the
      # extras require mcp<2.
      - dependency-name: mcp
        update-types:
          - version-update:semver-major

  - package-ecosystem: cargo
    directory: /packages/rust
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: uv
    directory: /alfred
    schedule:
      interval: weekly
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
