name: Setup Node.js and pnpm
description: Install pnpm, configure Node.js with pnpm caching, and optionally run a frozen lockfile install.

inputs:
  node-version:
    description: Explicit Node.js version (overrides node-version-file when set)
    required: false
    default: ''
  node-version-file:
    description: Path to Node version file when node-version is empty
    required: false
    default: '.nvmrc'
  registry-url:
    description: Optional npm registry URL (for trusted publishing)
    required: false
    default: ''
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node.js
      if: inputs.node-version != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm

    - name: Setup Node.js (from version file)
      if: inputs.node-version == ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}
        cache: pnpm

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
