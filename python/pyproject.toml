[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afd"
version = "0.13.0"
description = "Agent-First Development toolkit for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Falkicon", email = "falkicon@example.com" }
]
keywords = [
    "agent-first",
    "afd",
    "mcp",
    "ai",
    "agent",
    "commands",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
server = [
    # mcp 2.x: MCPServer (mcp.server.mcpserver) serves MCP 2026-07-28 and the
    # 2025 initialize handshake from one endpoint. Capped at the newest minor the full
    # suite has passed on: the server relies on SDK internals (afd.server.sdk_internals).
    # The weekly "Python newest MCP SDK" workflow tests the newest 2.x; widen the cap,
    # here and in `client`, when it passes there (#1756).
    "mcp>=2.3,<2.4",
    # SkillCatalog frontmatter parsing walks yaml.parse() events under the YAML 1.2 core schema.
    "pyyaml>=6.0",
]
client = [
    "httpx>=0.27",
    "mcp>=2.3,<2.4",  # SseTransport and the streamable HTTP client; cap as in `server`
    "websockets>=14",  # additional_headers= needs websockets 14+
]
cli = [
    "click>=8.0",
    "rich>=13.0",
    "afd[server,client]",  # CLI needs the MCP transports (httpx, mcp)
]
testing = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyyaml>=6.0",
]
all = [
    "afd[server,client,cli,testing]",
]
dev = [
    "afd[all]",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "pytest-cov>=4.0",
]

[project.scripts]
afd = "afd.cli:main"

[project.entry-points."lushx.extensions"]
afd = "afd.lushx_ext:register"

[project.urls]
Homepage = "https://github.com/lushly-dev/afd"
Documentation = "https://github.com/lushly-dev/afd/tree/main/python"
Repository = "https://github.com/lushly-dev/afd"

[tool.hatch.build.targets.wheel]
packages = ["src/afd"]

# package.json is the private Changesets stub that holds the version for the release tooling
# (scripts/release/tracks.mjs); it is not part of the Python distribution.
[tool.hatch.build.targets.sdist]
exclude = ["/package.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
# Strict by default across the package, with explicit per-module overrides below
# ratcheting down as remaining non-core/non-server modules tighten (#1757).
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "afd.cli.*",
    "afd.client",
    "afd.connectors.*",
    "afd.direct",
    "afd.handoff_client",
    "afd.lushx_ext.*",
    "afd.platform",
    "afd.testing.*",
    "afd.transports.*",
]
strict = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false
no_implicit_reexport = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
