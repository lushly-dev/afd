[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alfred"
version = "0.1.0"
description = "AFD repo quality bot — deterministic tooling as MCP commands"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Falkicon", email = "falkicon@example.com" }
]
keywords = [
    "afd",
    "quality",
    "linting",
    "mcp",
    "agent",
    "botcore",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

dependencies = [
    "lushly-botcore>=0.2.0",
    "afd>=0.2.0",
    "click>=8.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
mcp = [
    "lushly-botcore[mcp]",
]
dev = [
    "alfred[mcp]",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[project.scripts]
alfred = "alfred.cli:main"

[project.entry-points."botcore.plugins"]
alfred = "alfred.plugin:AlfredPlugin"

[project.urls]
Repository = "https://github.com/lushly-dev/afd"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred"]

# Develop and test against the repo's own afd package (python/), not a PyPI
# release, so `uv run alfred` and `uv run pytest` use the same code. uv-only:
# built wheels keep the plain `afd>=...` requirement and install afd from PyPI.
[tool.uv.sources]
afd = { path = "../python", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# afd comes from the editable ../python install (see [tool.uv.sources]).
pythonpath = ["src"]
