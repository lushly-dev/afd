id: binding - convert call expression with event argument
valid:
  - export const template = html`
      <button @click="{foo($e)}"></button>
    `;
  - export const template = html`
      <input @focus="{foo($e)}"/>
    `;
invalid:
  - export const template = html`
      <button @click="${(x, c) => x.foo(c.event)}"></button>
    `;
  - export const template = html`
      <input @focus="${(x, c) => x.foo(c.event)}"/>
    `;
