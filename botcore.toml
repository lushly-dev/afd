# Botcore configuration for the AFD repository.
# Primary language is TypeScript; Python and Rust live in subdirectories.

botcore_version = "0.6.0"
language = "typescript"
linter = "biome"
test_runner = "vitest"
formatter = "biome"

# Quality thresholds. The file-size pair is shared with scripts/check-file-size.mjs
# (TypeScript and repository scripts); neither tool size-checks markdown.
file_size_warn = 500
file_size_error = 1500
coverage_threshold = 80
deps_max_major_behind = 1
check_changelog = true
check_agents = true

[skills]
# Shared project skills are generated by scripts/skill-profiles.mjs.
# Must equal listingBudget in skills/exports.json; pnpm check:skills compares them.
# Standing rule (owner, 2026-11-12): a PR that still needs more raises both to the
# listing total rounded up to the next 100, up to 8,000; above that, ask the owner.
listing_budget = 6300
# Skip every bundled canonical ID: seed must not rename or replace this profile.
skip = [
    "agent-config",
    "botcore-config",
    "browser-automation",
    "code-reviewer",
    "docs-manager",
    "mcp-builder",
    "plugin-builder",
    "security-auditor",
    "skill-manager",

    # AFD-local skills, including the session loop; skip also keeps seed from
    # treating a future local skill that shares a retired botcore name as botcore's.
    "afd",
    "afd-auth",
    "afd-cpp",
    "afd-directclient",
    "afd-python",
    "afd-rust",
    "afd-site-design",
    "afd-typescript",
    "brief-status",
    "cut-release",
    "end-session",
    "loam-design",
    "prepare-pr",
    "start-session",
    "triage-issues",
]

# Per-package overrides for Python and Rust subdirectories
[packages.python]
coverage_paths = ["src/"]

[packages.alfred]
coverage_paths = ["src/"]

[packages.rust]
coverage_paths = ["src/"]

# The bloat sweep (the sweep-bloat skill): it ranks files over file_size_warn by size and
# churn and records each pass on the trend issue; file_size_error is only the commit's
# runaway guard.
[sweep]
trend_issue = 1098

# The software factory's repository adapter (endpoints/botcore/plugins/botcore-factory; see
# docs/features/proposed/software-factory). Botcore reads a plugin's settings under
# [plugins.<entry point>]. Commands are argument lists, run in the cell's worktree. The lane's
# other keys (validate, coverage, install, required_check, ...) arrive with the commands that run
# them. review_evidence waits for prepare-pr's lane mode, which records the reviewed head; until
# then lane-enqueue refuses here with NOT_CONFIGURED.
[plugins.factory]
labels = ".github/labels.json"
# The cheap stages of pnpm check, run before a branch joins the queue.
prequeue = [
    { name = "lint", run = ["pnpm", "lint"] },
    { name = "typecheck", run = ["node", "scripts/affected.mjs", "run", "typecheck"] },
    { name = "portability", run = ["node", "scripts/check-portability.mjs"] },
    { name = "file-size", run = ["node", "scripts/check-file-size.mjs"] },
]
# A repair after a failing check may not edit these without gate-allow.
gate_paths = [
    "lefthook.yml",
    ".github/workflows/**",
    ".github/labels.json",
    "scripts/check-*.mjs",
    "scripts/issue-labels.mjs",
    "scripts/affected*",
    "biome.json",
    "package.json",
    "botcore.toml",
]
