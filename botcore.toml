# Botcore configuration for the AFD repository.
# Primary language is TypeScript; Python and Rust live in subdirectories.

botcore_version = "0.6.0"
language = "typescript"
linter = "biome"
test_runner = "vitest"
formatter = "biome"

# Quality thresholds. The file-size pair is shared with scripts/check-file-size.mjs
# (TypeScript/JS, Rust, Python, C++ and repository scripts); neither tool size-checks markdown.
file_size_warn = 500
file_size_error = 1500
coverage_threshold = 80
deps_max_major_behind = 1
check_changelog = true
check_agents = true

[skills]
# Shared project skills are generated by scripts/skill-profiles.mjs.
# Must equal listingBudget in skills/exports.json; pnpm check:skills compares them.
# Standing rule (owner, 2026-11-12): a PR that still needs more raises both to the
# listing total rounded up to the next 100, up to 8,000; above that, ask the owner.
listing_budget = 7000
# Skip every bundled canonical ID: seed must not rename or replace this profile.
skip = [
    "agent-config",
    "bloat-sweeper",
    "botcore-config",
    "browser-automation",
    "code-reviewer",
    "disk-hygiene",
    "docs-manager",
    "gate-discipline",
    "mcp-builder",
    "plugin-builder",
    "security-auditor",
    "skill-manager",

    # AFD-local skills, including the session loop; skip also keeps seed from
    # treating a future local skill that shares a retired botcore name as botcore's.
    "afd",
    "afd-auth",
    "afd-cpp",
    "afd-directclient",
    "afd-python",
    "afd-rust",
    "afd-site-design",
    "afd-typescript",
    "brief-status",
    "cut-release",
    "end-session",
    "loam-design",
    "prepare-pr",
    "run-fleet",
    "start-session",
    "triage-issues",
]

# Per-package overrides for Python and Rust subdirectories
[packages.python]
coverage_paths = ["src/"]

[packages.alfred]
coverage_paths = ["src/"]

[packages.rust]
coverage_paths = ["src/"]

# The bloat sweep (the sweep-bloat skill): it ranks files over file_size_warn by size and
# churn and records each pass on the trend issue; file_size_error is only the commit's
# runaway guard.
[sweep]
trend_issue = 1098
extensions = [
    ".ts",
    ".tsx",
    ".mts",
    ".cts",
    ".js",
    ".jsx",
    ".mjs",
    ".cjs",
    ".py",
    ".rs",
    ".cpp",
    ".hpp",
]
exclude = [
    "foundations/fast-af/packages/element/",
    "site/js/vendor/",
]

# The software factory's repository adapter (endpoints/botcore/plugins/botcore-factory; see
# docs/features/active/software-factory). Botcore reads a plugin's settings under
# [plugins.<entry point>]. Commands are argument lists, run in a worktree (the cell's, or one of
# the lane's slots).
[plugins.factory]
labels = ".github/labels.json"
install = ["pnpm", "install", "--frozen-lockfile"]
# pnpm verify writes the record pre-push accepts for the exact commit, so the lane's push runs
# no checks twice (scripts/verify-record.mjs). --keep-going runs every suite after one fails, and
# each local cargo step runs with --no-fail-fast, so an ejection lists every failing test, not
# only the first (lushly-dev/afd#1607).
validate = ["pnpm", "verify", "--keep-going"]
coverage = ["pnpm", "check:all"]
# prepare-pr's lane mode records the review of the exact head in the worktree's git directory;
# lane-enqueue accepts only a passing review of that commit (scripts/review-record.mjs). The lane
# runs this again from its own checkout of main before each validation, and that run binds: a
# change here or to the script takes effect once it is on main and the lane restarts.
review_evidence = [
    "node", "scripts/review-record.mjs", "verify", "--head", "{head}", "--worktree", "{worktree}",
]
# Reports what a branch did to its tests (deleted/skipped/loosened tests, rewritten assertions,
# changed snapshots or runner configs). The lane runs this from its clean checkout of the base
# so a branch cannot silence its own report; attached to attempt records and read by Phase 5's
# "never improves by checking less" hold (lushly-dev/afd#1387).
test_changes = [
    "node",
    "scripts/report-test-changes.mjs",
    "--root", "{worktree}",
    "--base", "{base}",
    "--head", "{head}",
    "--json",
]
required_check = "ci-ok"
# When main moves under a validated branch, the lane advances it without validating it again only
# if main's changes touch none of shared_paths or gate_paths, merge cleanly, and share no unit with
# the branch's (scripts/factory-units.mjs: packages with their dependents, workflows, directories).
units = ["node", "scripts/factory-units.mjs"]
shared_paths = [
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "package.json",
    ".npmrc",
    ".nvmrc",
    "tsconfig.json",
    "tsconfig.*.json",
    "biome.json",
    "lefthook.yml",
    ".github/workflows/**",
    ".github/actions/**",
    "scripts/affected*",
    "scripts/cargo-target.mjs",
    "scripts/rust-sweep.mjs",
    "scripts/ci/**",
    "scripts/sync-ci.mjs",
    "scripts/factory-units.mjs",
    "scripts/pre-push.mjs",
    "scripts/verify-record.mjs",
    "architecture.json",
    "botcore.toml",
    "**/uv.lock",
    "**/Cargo.lock",
    ".cargo/**",
]
# Past lane.maxBaseReruns, a move of main that merges cleanly lets the PR's ci-ok stand in for a
# new local validation, since ci-ok runs on the merge ref with main's own workflows and gates;
# main changing one of these still means validating again: lockfiles, dependency manifests and
# toolchain pins, whose effect only the full local install and verify show.
revalidate_paths = [
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "package.json",
    ".npmrc",
    ".nvmrc",
    "**/Cargo.lock",
    "**/uv.lock",
    "**/rust-toolchain.toml",
    "**/.cargo/**",
]
# ci-ok runs on pull requests only: after a merge that was not validated again, main is red when a
# check run on its merge commit fails, apart from publishing and deploying.
main_checks = [
    "!Version or Publish",
    "!Reconcile held npm publication",
    "!Select prebuilt hosts",
    "!Specimen host (*",
    "!deploy",
    "!Publish to *",
    "!workflow: Release",
    "!workflow: Deploy site to GitHub Pages",
    "!workflow: Publish *",
]
ignore_branches = ["changeset-release/*"]
# Ignored build output that stays inside a slot checkout (such as Specimen's build:host, which
# pins --target-dir target over CARGO_TARGET_DIR), removed when a slot is recycled or swept
# (lushly-dev/afd#1659).
slot_clean_paths = ["foundations/specimen/host/target"]
# The cheap stages of pnpm check, run before a branch joins the queue.
prequeue = [
    { name = "lint", run = ["pnpm", "lint"] },
    { name = "typecheck", run = ["node", "scripts/affected.mjs", "run", "typecheck"] },
    { name = "portability", run = ["node", "scripts/check-portability.mjs"] },
    { name = "file-size", run = ["node", "scripts/check-file-size.mjs"] },
]
# A repair after a failing check may not edit these without gate-allow.
gate_paths = [
    "lefthook.yml",
    ".github/workflows/**",
    ".github/labels.json",
    "scripts/check-*.mjs",
    "scripts/discovery-parsers.mjs",
    "scripts/report-test-changes.mjs",
    "scripts/policy/**",
    "scripts/gate-discipline.test.mjs",
    ".claude/skills/maintain-gates/scripts/**",
    "endpoints/botcore/src/botcore/skills/gate-discipline/scripts/**",
    "scripts/issue-labels.mjs",
    "scripts/affected*",
    "scripts/cargo-target.mjs",
    "scripts/rust-sweep.mjs",
    "scripts/ci/**",
    "scripts/sync-ci.mjs",
    "scripts/check-pr-title.mjs",
    "scripts/scheduled-failure-issue.mjs",
    "scripts/pre-push.mjs",
    "scripts/verify-record.mjs",
    "scripts/review-record.mjs",
    "scripts/provenance-merge.mjs",
    "scripts/release/provenance.mjs",
    "docs/features/active/factory-gateway/process.json",
    "biome.json",
    "package.json",
    "botcore.toml",
    # The lane's own code: its gate check, holds and review binding.
    "endpoints/botcore/plugins/botcore-factory/**",
]

# Two branches that each edit an imported unit both change its provenance records, so their merge
# conflicts in the records alone. The lane merges them three ways instead of ejecting the branch;
# a row or value both sides changed differently still ejects (lushly-dev/afd#1410, #1472). Health
# pins its provenance.json digest in test_provenance.py, which the script merges only when the sole
# conflict there is RECORD_SHA256.
[[plugins.factory.regenerate]]
name = "provenance"
paths = [
    "foundations/fast-af/provenance/*.json",
    "foundations/specimen/provenance/*.json",
    "foundations/violet/provenance/*.json",
    "endpoints/botcore/provenance/*.json",
    "endpoints/botcore/src/botcore/provenance/*.json",
    "endpoints/health/provenance/provenance.json",
    "endpoints/health/tests/test_provenance.py",
]
run = ["node", "scripts/provenance-merge.mjs"]

# What a build or install recreates inside a worktree, for botcore's disk-* commands (the
# free-disk-space skill). Read from origin's default branch, so a change applies once merged.
# Rust output goes after a day idle; node_modules and .venv share blocks with their stores and
# only go when a volume is low. Folders holding a checkout (.claude/worktrees) are never touched.
# An ignored path no entry names keeps tier 2 from removing its worktree, so only output a
# build, install or test run recreates is named. Left unnamed on purpose: `.umbel/` (an Umbel
# workspace with keys and a journal), `.specimen/` (capture sets, labels and decision evidence
# not yet recorded), Tauri's `gen/` beyond `gen/schemas` (Android version state), anything a
# machine excludes locally, Specimen's staged host binaries (one staged from CI cannot be
# rebuilt here) and `test-results` outside the folders below (Specimen's experiment driver
# keeps its evidence in one). *.tsbuildinfo goes with dist: tsc skips emitting when its build
# info survives the output it describes.
[disk]
landing_ref = "origin/main"
regenerable = [
    { path = "**/target", after_days = 1 },
    "**/dist",
    "**/*.tsbuildinfo",
    "**/coverage",
    "**/.vitest",
    "endpoints/loam/packages/web/test-results",
    "endpoints/loam/packages/desktop/test-results",
    "endpoints/health-dashboard/test-results",
    "foundations/fast-af/packages/element/packages/fast-element/test-results",
    "playwright-report",
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.ruff_cache",
    "**/.mypy_cache",
    "**/*.egg-info",
    "packages/cpp/build",
    "packages/examples/todo/backends/cpp/build",
    "endpoints/health/build",
    "endpoints/loam/packages/desktop/dist-installers",
    "endpoints/loam/packages/desktop/src-tauri/gen/schemas",
    "endpoints/loam/packages/desktop/src-tauri/permissions/autogenerated",
    "foundations/fast-af/packages/element/packages/fast-element/temp",
    "foundations/fast-af/packages/element/packages/fast-element/.rollupcache",
    "foundations/fast-af/packages/element/packages/fast-element/tsdoc-metadata.json",
    { path = "node_modules", when = "pressure" },
    { path = "**/node_modules", when = "pressure" },
    { path = "**/.venv", when = "pressure" },
]
copies = [".env", ".env.local"]
