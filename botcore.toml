# Botcore configuration for the AFD repository.
# Primary language is TypeScript; Python and Rust live in subdirectories.

botcore_version = "0.6.0"
language = "typescript"
linter = "biome"
test_runner = "vitest"
formatter = "biome"

# Quality thresholds. The file-size pair is shared with scripts/check-file-size.mjs
# (TypeScript and repository scripts); neither tool size-checks markdown.
file_size_warn = 500
file_size_error = 1500
coverage_threshold = 80
deps_max_major_behind = 1
check_changelog = true
check_agents = true

[skills]
# Shared project skills are generated by scripts/skill-profiles.mjs.
# Must equal listingBudget in skills/exports.json; pnpm check:skills compares them.
# Standing rule (owner, 2026-11-12): a PR that still needs more raises both to the
# listing total rounded up to the next 100, up to 8,000; above that, ask the owner.
listing_budget = 6800
# Skip every bundled canonical ID: seed must not rename or replace this profile.
skip = [
    "agent-config",
    "bloat-sweeper",
    "botcore-config",
    "browser-automation",
    "code-reviewer",
    "docs-manager",
    "gate-discipline",
    "mcp-builder",
    "plugin-builder",
    "security-auditor",
    "skill-manager",

    # AFD-local skills, including the session loop; skip also keeps seed from
    # treating a future local skill that shares a retired botcore name as botcore's.
    "afd",
    "afd-auth",
    "afd-cpp",
    "afd-directclient",
    "afd-python",
    "afd-rust",
    "afd-site-design",
    "afd-typescript",
    "brief-status",
    "cut-release",
    "end-session",
    "loam-design",
    "prepare-pr",
    "run-fleet",
    "start-session",
    "triage-issues",
]

# Per-package overrides for Python and Rust subdirectories
[packages.python]
coverage_paths = ["src/"]

[packages.alfred]
coverage_paths = ["src/"]

[packages.rust]
coverage_paths = ["src/"]

# The bloat sweep (the sweep-bloat skill): it ranks files over file_size_warn by size and
# churn and records each pass on the trend issue; file_size_error is only the commit's
# runaway guard.
[sweep]
trend_issue = 1098

# The software factory's repository adapter (endpoints/botcore/plugins/botcore-factory; see
# docs/features/active/software-factory). Botcore reads a plugin's settings under
# [plugins.<entry point>]. Commands are argument lists, run in a worktree (the cell's, or one of
# the lane's slots).
[plugins.factory]
labels = ".github/labels.json"
install = ["pnpm", "install", "--frozen-lockfile"]
# pnpm verify writes the record pre-push accepts for the exact commit, so the lane's push runs
# no checks twice (scripts/verify-record.mjs).
validate = ["pnpm", "verify"]
coverage = ["pnpm", "check:all"]
# prepare-pr's lane mode records the review of the exact head in the worktree's git directory;
# lane-enqueue accepts only a passing review of that commit (scripts/review-record.mjs). The lane
# runs this again from its own checkout of main before each validation, and that run binds: a
# change here or to the script takes effect once it is on main and the lane restarts.
review_evidence = [
    "node", "scripts/review-record.mjs", "verify", "--head", "{head}", "--worktree", "{worktree}",
]
required_check = "ci-ok"
# When main moves under a validated branch, the lane advances it without validating it again only
# if main's changes touch none of shared_paths or gate_paths, merge cleanly, and share no unit with
# the branch's (scripts/factory-units.mjs: packages with their dependents, workflows, directories).
units = ["node", "scripts/factory-units.mjs"]
shared_paths = [
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "package.json",
    ".npmrc",
    ".nvmrc",
    "tsconfig.json",
    "tsconfig.*.json",
    "biome.json",
    "lefthook.yml",
    ".github/workflows/**",
    ".github/actions/**",
    "scripts/affected*",
    "scripts/factory-units.mjs",
    "scripts/pre-push.mjs",
    "scripts/verify-record.mjs",
    "architecture.json",
    "botcore.toml",
    "**/uv.lock",
    "**/Cargo.lock",
    ".cargo/**",
]
# Past lane.maxBaseReruns, a move of main that merges cleanly lets the PR's ci-ok stand in for a
# new local validation, since ci-ok runs on the merge ref with main's own workflows and gates;
# main changing one of these still means validating again: lockfiles, dependency manifests and
# toolchain pins, whose effect only the full local install and verify show.
revalidate_paths = [
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
    "package.json",
    ".npmrc",
    ".nvmrc",
    "**/Cargo.lock",
    "**/uv.lock",
    "**/rust-toolchain.toml",
    "**/.cargo/**",
]
# ci-ok runs on pull requests only: after a merge that was not validated again, main is red when a
# check run on its merge commit fails, apart from publishing and deploying.
main_checks = [
    "!Version or Publish",
    "!Reconcile held npm publication",
    "!Select prebuilt hosts",
    "!Specimen host (*",
    "!deploy",
    "!Publish to *",
    "!workflow: Release",
    "!workflow: Deploy site to GitHub Pages",
    "!workflow: Publish *",
]
ignore_branches = ["changeset-release/*"]
# The cheap stages of pnpm check, run before a branch joins the queue.
prequeue = [
    { name = "lint", run = ["pnpm", "lint"] },
    { name = "typecheck", run = ["node", "scripts/affected.mjs", "run", "typecheck"] },
    { name = "portability", run = ["node", "scripts/check-portability.mjs"] },
    { name = "file-size", run = ["node", "scripts/check-file-size.mjs"] },
]
# A repair after a failing check may not edit these without gate-allow.
gate_paths = [
    "lefthook.yml",
    ".github/workflows/**",
    ".github/labels.json",
    "scripts/check-*.mjs",
    "scripts/policy/**",
    "scripts/gate-discipline.test.mjs",
    ".claude/skills/maintain-gates/scripts/**",
    "endpoints/botcore/src/botcore/skills/gate-discipline/scripts/**",
    "scripts/issue-labels.mjs",
    "scripts/affected*",
    "scripts/pre-push.mjs",
    "scripts/verify-record.mjs",
    "scripts/review-record.mjs",
    "scripts/provenance-merge.mjs",
    "biome.json",
    "package.json",
    "botcore.toml",
]

# Two branches that each edit an imported unit both change its provenance records, so their merge
# conflicts in the records alone. The lane merges them three ways instead of ejecting the branch;
# a row or value both sides changed differently still ejects (lushly-dev/afd#1410). Health's records
# keep their rows in provenance.json, which the script does not merge, so they are not listed.
[[plugins.factory.regenerate]]
name = "provenance"
paths = [
    "foundations/fast-af/provenance/*.json",
    "foundations/specimen/provenance/*.json",
    "foundations/violet/provenance/*.json",
    "endpoints/botcore/provenance/*.json",
    "endpoints/botcore/src/botcore/provenance/*.json",
]
run = ["node", "scripts/provenance-merge.mjs"]
