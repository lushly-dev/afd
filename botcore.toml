# Botcore configuration for the AFD repository.
# Primary language is TypeScript; Python and Rust live in subdirectories.

botcore_version = "0.6.0"
language = "typescript"
linter = "biome"
test_runner = "vitest"
formatter = "biome"

# Quality thresholds. The file-size pair is shared with scripts/check-file-size.mjs
# (TypeScript and repository scripts); neither tool size-checks markdown.
file_size_warn = 500
file_size_error = 1000
coverage_threshold = 80
deps_max_major_behind = 1
check_changelog = true
check_agents = true

[skills]
# Shared project skills are generated by scripts/skill-profiles.mjs.
# Must equal listingBudget in skills/exports.json; pnpm check:skills compares them.
# Standing rule (owner, 2026-11-12): a PR that still needs more raises both to the
# listing total rounded up to the next 100, up to 8,000; above that, ask the owner.
listing_budget = 6000
# Skip every bundled canonical ID: seed must not rename or replace this profile.
skip = [
    "agent-config",
    "botcore-config",
    "browser-automation",
    "code-reviewer",
    "docs-manager",
    "mcp-builder",
    "plugin-builder",
    "security-auditor",
    "skill-manager",

    # AFD-local skills, including the session loop; skip also keeps seed from
    # treating a local skill that shares a retired botcore name as botcore's.
    "afd",
    "afd-auth",
    "afd-cpp",
    "afd-directclient",
    "afd-python",
    "afd-rust",
    "afd-site-design",
    "afd-typescript",
    "brief-status",
    "do-end-session",
    "do-init-afd",
    "do-prepare-pr",
    "do-release",
    "loam-design",
]

# Per-package overrides for Python and Rust subdirectories
[packages.python]
coverage_paths = ["src/"]

[packages.alfred]
coverage_paths = ["src/"]

[packages.rust]
coverage_paths = ["src/"]
