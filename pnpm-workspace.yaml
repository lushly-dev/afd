packages:
  - "packages/*"
  - "foundations/*"
  - "foundations/*/packages/*"
  - "foundations/fast-af/packages/element/packages/fast-element"
  - "foundations/afd/typescript/*"
  - "integrations/*"
  - "endpoints/*"
  - "endpoints/loam/packages/*"
  - "endpoints/loam/apps/*"
  - "packages/auth/hosted/convex"
  - "packages/examples/_shared/*"
  - "packages/examples/chat"
  - "packages/examples/todo"
  - "packages/examples/todo/backends/*"
  - "packages/examples/todo/frontends/*"
  - "packages/examples/todo-directclient/backend"
  - "packages/examples/showcase/backend"

# Dependabot resolves with a 3-day minimum release age and fails every update while the lockfile
# holds a younger version, so a local lockfile refresh keeps to the same window.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@lushly-dev/*"
