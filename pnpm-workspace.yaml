packages:
  - "packages/*"
  - "foundations/*"
  - "foundations/*/packages/*"
  - "foundations/fast-af/packages/element/packages/fast-element"
  - "integrations/*"
  - "endpoints/*"
  - "endpoints/loam/packages/*"
  - "endpoints/loam/apps/*"
  - "endpoints/loam/plugins/*/app"
  - "packages/auth/hosted/convex"
  - "packages/examples/chat"
  - "packages/examples/todo"
  - "packages/examples/todo/backends/*"
  - "packages/examples/todo/frontends/*"
  - "packages/examples/todo-directclient/backend"
  - "packages/examples/todo-directclient/frontend"
  - "packages/examples/seed-library"
  - "packages/examples/pond"
  - "packages/examples/showcase/backend"
  # Private stubs that hold a release track's version for Changesets (scripts/release/tracks.mjs);
  # endpoints/botcore is the third, under "endpoints/*".
  - "python"
  - "spec"

# Dependabot resolves with a 3-day minimum release age and fails every update while the lockfile
# holds a younger version, so a local lockfile refresh keeps to the same window.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@lushly-dev/*"

# Bounded fixes for vulnerable transitive ranges. pnpm 11 and later read overrides only here.
overrides:
  "@types/node": "^26.6.6"
  "@auth/core": "^0.41.3"
  "convex>ws": "^8.21.0"
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"
  "brace-expansion@>=4.0.0 <5.0.12": "^5.0.12"
  "smol-toml@<=1.8.0": "^1.9.0"
  "source-map-js@>=1.0.0 <1.2.2": "^1.2.2"
  "zod@>=4.0.0 <4.6.6": "^4.6.6"

# No dependency's install script runs, as under pnpm 10's default; pnpm 12 fails an install that
# leaves one undecided. esbuild and lefthook take their binaries from optional dependencies, the
# root `prepare` script installs the hooks, and better-sqlite3 ships prebuilt bindings for x64 and
# arm64 Linux (glibc and musl), macOS and Windows, which its `binding.gyp` builds nothing over.
allowBuilds:
  "@ast-grep/cli": false
  "@google/genai": false
  better-sqlite3: false
  edgedriver: false
  esbuild: false
  geckodriver: false
  lefthook: false
  protobufjs: false
  rs-module-lexer: false
